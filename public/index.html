function kennisArtikel(k) {
  return '<div class="kb-kaart" data-kb-kaart="' + k.id + '"><div class="kb-kop"><b>' + esc(k.titel) + '</b>'
    + (k.categorie ? chip(k.categorie, 'blauw') : chip('geen categorie', ''))
    + (k.gebruikt ? '<span class="chip">' + k.gebruikt + '× gebruikt</span>' : '')
    + '<span style="margin-left:auto"></span>'
    + '<button class="knop klein stil" data-kb-gebruik="' + k.id + '">Gebruikt</button>'
    + '<button class="knop klein stil" data-kb-bewerk="' + k.id + '">Bewerken</button>'
    + '<button class="knop klein stil gevaar" data-kb-weg="' + k.id + '">Weg</button></div>'
    + (k.probleem ? '<div class="kb-tekst" style="margin-bottom:6px;color:var(--muted2)">' + esc(k.probleem) + '</div>' : '')
    + '<div class="kb-tekst">' + esc(k.oplossing) + '</div>'
    + (k.trefwoorden ? '<div class="hint" style="margin-top:6px">' + esc(k.trefwoorden) + '</div>' : '')
    + '</div>';
}
function kennisLijst(zoek) {
  const q = String(zoek || '').trim().toLowerCase();
  const lijst = q ? kennisCache.filter((k) => [k.titel, k.probleem, k.oplossing, k.categorie, k.trefwoorden].join(' ').toLowerCase().includes(q)) : kennisCache;
  if (!lijst.length) return '<p class="leeg" style="padding:16px">' + (q ? 'Geen artikelen met deze zoekterm.' : 'Nog geen artikelen. Maak de eerste aan.') + '</p>';
  return lijst.map(kennisArtikel).join('');
}

async function laadKennisbank() {
  ticketWeergave = 'kennisbank';
  beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="leeg">Kennisbank laden…</p></div></div>';
  try {
    const d = await api('/api/kennisbank');
    kennisCache = d.artikelen || [];
    window.TICKET_CATEGORIEEN = d.categorieen || [];
    beeld.innerHTML = ticketNav()
      + '<details class="uitklap"><summary>' + ico.plus + ' Nieuw artikel<span class="plus">+</span></summary><div class="binnen">'
      + '<form id="kb-form" class="form-rij">'
      + '<input type="hidden" name="id" value="">'
      + '<div class="form-rij twee"><label class="veld"><span>Titel</span><input name="titel" required maxlength="160" placeholder="Bijv. Website geeft 502 na herstart"></label>'
      + '<label class="veld"><span>Categorie</span><select name="categorie"><option value="">geen categorie</option>'
      + (d.categorieen || []).map((c) => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('') + '</select></label></div>'
      + '<label class="veld"><span>Probleem (wanneer geldt dit)</span><textarea name="probleem" maxlength="4000" placeholder="Beschrijf het symptoom."></textarea></label>'
      + '<label class="veld"><span>Oplossing</span><textarea name="oplossing" maxlength="8000" required placeholder="Wat werkt? Stap voor stap."></textarea></label>'
      + '<label class="veld"><span>Trefwoorden</span><input name="trefwoorden" maxlength="200" placeholder="bijv. proxy 502 herstart"></label>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="knop primair" type="submit" id="kb-opslaan">Artikel opslaan</button>'
      + '<button class="knop" type="button" id="kb-annuleer" style="display:none">Annuleren</button></div>'
      + '</form></div></details>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Kennisbank</h2><div class="rechts"><span class="meting-tijd">' + kennisCache.length + ' artikelen</span></div></div>'
      + '<div class="kaart-body" style="padding:12px 16px;border-bottom:1px solid var(--line)">'
      + '<div class="zoekbalk" style="margin:0"><span class="zoek-ico">' + ico.zoek + '</span>'
      + '<input type="search" id="kb-zoek" placeholder="Zoek op titel, probleem of trefwoord…" value="' + esc(kbZoek) + '">'
      + '<span class="zoek-tel" id="kb-tel"></span></div></div>'
      + '<div id="kb-lijst">' + kennisLijst(kbZoek) + '</div></div>';

    koppelTicketNav();
    const tel = () => {
      const q = String($('#kb-zoek').value || '').trim().toLowerCase();
      const n = q ? kennisCache.filter((k) => [k.titel, k.probleem, k.oplossing, k.categorie, k.trefwoorden].join(' ').toLowerCase().includes(q)).length : kennisCache.length;
      const el = $('#kb-tel');
      if (el) el.textContent = q ? n + ' van ' + kennisCache.length : kennisCache.length + ' artikelen';
    };
    $('#kb-zoek').addEventListener('input', () => {
      kbZoek = $('#kb-zoek').value;
      $('#kb-lijst').innerHTML = kennisLijst(kbZoek);
      koppelKennisKnoppen();
      tel();
    });
    tel();

    const form = $('#kb-form');
    const annuleer = $('#kb-annuleer');
    const opslaan = $('#kb-opslaan');
    const leegForm = () => {
      form.reset();
      form.elements.id.value = '';
      opslaan.textContent = 'Artikel opslaan';
      annuleer.style.display = 'none';
    };
    annuleer.addEventListener('click', leegForm);

    const bewerk = (id) => {
      const k = kennisCache.find((x) => String(x.id) === String(id));
      if (!k) return;
      form.elements.id.value = k.id;
      form.titel.value = k.titel || '';
      form.categorie.value = k.categorie || '';
      form.probleem.value = k.probleem || '';
      form.oplossing.value = k.oplossing || '';
      form.trefwoorden.value = k.trefwoorden || '';
      opslaan.textContent = 'Wijzigingen opslaan';
      annuleer.style.display = '';
      const det = form.closest('details.uitklap');
      if (det) det.open = true;
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      setTimeout(() => form.titel.focus(), 120);
    };

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const lichaam = Object.fromEntries(new FormData(form).entries());
      const id = lichaam.id;
      delete lichaam.id;
      try {
        if (id) {
          await api('/api/kennisbank/' + id, { method: 'PATCH', lichaam });
          toast('Artikel bijgewerkt');
        } else {
          const r = await api('/api/kennisbank', { method: 'POST', lichaam });
          toast('Artikel #' + r.artikel.id + ' opgeslagen');
        }
        laadKennisbank();
      } catch (err) { toast(err.message, true); }
    });

    const koppelKennisKnoppen = () => {
      beeld.querySelectorAll('[data-kb-gebruik]').forEach((b) => b.addEventListener('click', async () => {
        try { await api('/api/kennisbank/' + b.dataset.kbGebruik + '/gebruikt', { method: 'POST', lichaam: {} }); toast('Geteld als gebruikt'); laadKennisbank(); }
        catch (err) { toast(err.message, true); }
      }));
      beeld.querySelectorAll('[data-kb-bewerk]').forEach((b) => b.addEventListener('click', () => bewerk(b.dataset.kbBewerk)));
      beeld.querySelectorAll('[data-kb-weg]').forEach((b) => b.addEventListener('click', () => {
        const k = kennisCache.find((x) => String(x.id) === String(b.dataset.kbWeg));
        bevestig('Artikel verwijderen', 'Artikel ' + (k ? k.titel : '') + ' uit de kennisbank halen?', async () => {
          await api('/api/kennisbank/' + b.dataset.kbWeg, { method: 'DELETE' });
          toast('Artikel verwijderd'); laadKennisbank();
        });
      }));
    };
    koppelKennisKnoppen();
  } catch (e) {
    beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>';
  }
}

// ── modal ────────────────────────────────────────────────────────────────────
function bevestig(titel, tekst, ja) {
  const m = $('#modal');
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:8px">' + esc(titel) + '</h3><p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">' + esc(tekst) + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="knop" id="nee">Annuleren</button><button class="knop gevaar" id="ja">Verwijderen</button></div>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#nee').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#ja').addEventListener('click', async () => { try { await ja(); } catch (err) { toast(err.message, true); } sluit(); }, { once: true });
}

let hostsCache = [];
let hostsLaatst = null;        // laatste /api/hosts-antwoord, voor het live filteren
let hostZoek = '';             // zoekterm in de IP-lijst
let hostDetail = null;
let serverDetail = null;
let apparatenCache = [];
let apparaatDetail = null;
let netwerkLaatst = null;      // laatste netwerkscan in de UI
let netwerkBezig = false;

function hostStatus(st) {
  if (st === 'neer') return { klasse: 'neer', tekst: 'niet bereikbaar' };
  if (st === 'onderhoud') return { klasse: 'onderhoud', tekst: 'in onderhoud' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'nog niet gescand' };
  return { klasse: 'ok', tekst: 'bereikbaar' };
}
function poortChips(poorten, max = 12) {
  if (!poorten || !poorten.length) return '<span class="chip">geen open poorten</span>';
  const zichtbaar = poorten.slice(0, max);
  return '<div class="port-chips">' + zichtbaar.map((p) => '<span class="port"><b>' + p + '</b></span>').join('')
    + (poorten.length > max ? '<span class="port">+' + (poorten.length - max) + '</span>' : '') + '</div>';
}
function tlsChip(host) {
  if (host.tls_dagen === null || host.tls_dagen === undefined) return '';
  const d = Number(host.tls_dagen);
  if (d < 0) return chip('certificaat verlopen', 'rood');
  if (d < 14) return chip('certificaat ' + d + ' d', 'rood');
  if (d < 30) return chip('certificaat ' + d + ' d', 'amber');
  return chip('certificaat ' + d + ' d', 'groen');
}

async function laadHosts() {
  beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="leeg">IP-adressen laden…</p></div></div>';
  try {
    const d = await api('/api/hosts');
    hostsCache = d.hosts;
    zetTeller('tab-hosts', hostsCache.length);
    renderHosts(d);
  } catch (e) {
    beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>';
  }
}

function hostKaart(h) {
  const st = hostStatus(h.status);
  const naam = h.naam || h.hostnaam || h.ip;
  const onder = [h.hostnaam && h.hostnaam !== naam ? h.hostnaam : '', h.laatste_scan ? 'gescand ' + geleden(h.laatste_scan) : 'nog niet gescand',
    h.ping_ms !== null && h.ping_ms !== undefined ? nlGetal(h.ping_ms) + ' ms' : ''].filter(Boolean).join(' · ');
  return '<div class="host ' + st.klasse + '" data-host="' + esc(h.ip) + '">'
    + '<div class="top"><span class="stip ' + st.klasse + (st.klasse === 'neer' ? ' puls' : '') + '"></span>'
    + '<span class="naam">' + esc(naam) + '</span><span class="ip">' + esc(h.ip) + '</span>'
    + '<span class="rechts">' + (h.tickets_open ? chip(h.tickets_open + ' ticket' + (h.tickets_open === 1 ? '' : 's'), 'amber') : '')
    + (h.status === 'onderhoud' ? chip('onderhoud', 'blauw') : '') + '</span></div>'
    + '<div class="onder">' + esc(onder) + '</div>'
    + poortChips(h.poorten)
    + '<div class="voet"><span>' + st.tekst + '</span>'
    + (h.uptime24 !== null && h.uptime24 !== undefined ? '<span>· ' + nlGetal(h.uptime24) + '% up (24 u)</span>' : '')
    + (h.sites && h.sites.length ? '<span>· ' + h.sites.length + ' site' + (h.sites.length === 1 ? '' : 's') + '</span>' : '')
    + '<span class="rechts" style="margin-left:auto">' + tlsChip(h) + '</span></div>'
    + '</div>';
}
// Zoekterm past bij naam, hostnaam, IP of een open poort.
function hostPast(h) {
  const q = String(hostZoek || '').trim().toLowerCase();
  if (!q) return true;
  return [h.naam || '', h.hostnaam || '', h.ip || '', ...(h.poorten || [])].join(' ').toLowerCase().includes(q);
}
function hostRaster(d) {
  const alle = d.hosts || [];
  if (!alle.length) return '<p class="leeg">Nog geen IP-adressen. Voeg er hierboven één toe; de eerste scan start meteen.</p>';
  const lijst = alle.filter(hostPast);
  if (!lijst.length) return '<p class="leeg">Geen IP-adressen gevonden voor &bdquo;' + esc(String(hostZoek || '').trim()) + '&rdquo;.</p>';
  return lijst.map(hostKaart).join('');
}
function hostTelling(d) {
  const alle = (d.hosts || []).length;
  const q = String(hostZoek || '').trim();
  if (!q) return alle + ' adres' + (alle === 1 ? '' : 'sen');
  return (d.hosts || []).filter(hostPast).length + ' van ' + alle;
}
function koppelHostKaarten() {
  beeld.querySelectorAll('[data-host]').forEach((el) => el.addEventListener('click', () => {
    hostDetail = el.dataset.host;
    laadHostDetail(hostDetail);
  }));
}

    + '<label class="veld"><span>Notitie (optioneel)</span><input name="notitie" placeholder="Waar is dit voor?" autocomplete="off"></label>'

        + '</div><span class="tijd">' + geleden(a.op) + '</span></div>').join('')
      + (d.alerts.length > 3 ? '<p class="hint" style="margin:2px 0 0">Nog ' + (d.alerts.length - 3) + ' storing' + (d.alerts.length - 3 === 1 ? '' : 'en') + ' — zie Alle meldingen.</p>' : '')

function koppelHosts() {
  koppelNetwerk();
  const form = $('#hostnieuw');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = form.querySelector('button[type=submit]');
    const f = new FormData(form);
    knop.classList.add('bezig');
    knop.textContent = 'Scannen…';
    try {
      const d = await api('/api/hosts', { method: 'POST', lichaam: {
        ip: String(f.get('ip') || '').trim(), naam: f.get('naam') || '', notitie: f.get('notitie') || '',
        interval_s: Number(f.get('interval_s')) || 300,
      } });
      toast('Toegevoegd: ' + d.host.ip + ' · ' + (d.host.poorten.length ? d.host.poorten.length + ' open poorten' : 'geen open poorten'));
      hostDetail = d.host.ip;
      laadHostDetail(d.host.ip);
    } catch (err) {
      toast(err.message, true);
      knop.classList.remove('bezig');
      knop.textContent = 'Toevoegen en meteen scannen';
    }
  });
  koppelHostKaarten();
  beeld.querySelectorAll('[data-ga]').forEach((el) => el.addEventListener('click', () => {
    huidigeTab = el.dataset.ga;
    siteDetail = null; ticketDetail = null;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === huidigeTab));
    laadHuidig();
  }));
  // Live filteren: alleen het raster verversen, zodat het zoekveld focus en cursor houdt.
  const veld = $('#hzoek');
  if (veld) veld.addEventListener('input', (e) => {
    hostZoek = e.target.value;
    const raster = $('#host-raster');
    if (raster) raster.innerHTML = hostRaster(hostsLaatst);
    const tel = $('#hzoek-tel');
    if (tel) tel.textContent = hostTelling(hostsLaatst);
    const kop = $('#host-teller');
    if (kop) kop.textContent = hostZoek ? hostTelling(hostsLaatst) : hostsCache.length + ' adressen';
    // Tijdens het zoeken gaat de storingen-kaart weg: dan wil je alleen de treffers zien.
    const stor = $('#storingen-kaart');
    if (stor) stor.style.display = String(hostZoek || '').trim() ? 'none' : '';
    koppelHostKaarten();
  });
}

function koppelNetwerk() {
  const knop = $('#netwerk-scan');
  if (knop) knop.addEventListener('click', scanNetwerk);
}

async function scanNetwerk() {
  const knop = $('#netwerk-scan');
  const uit = $('#netwerkuitslag');
  if (!uit) return;
  if (knop) { knop.disabled = true; knop.textContent = 'Bezig met scannen…'; }
  uit.innerHTML = '<p class="leeg">Het netwerk wordt afgelopen; dit duurt een paar seconden.</p>';
  try {
    const d = await api('/api/netwerk/scan', { method: 'POST', lichaam: {} });
    netwerkLaatst = d;
    renderNetwerk(d);
  } catch (e) {
    uit.innerHTML = '<p class="fout-tekst">' + esc(e.message) + '</p>';
  } finally {
    if (knop) { knop.disabled = false; knop.textContent = 'Opnieuw scannen'; }
  }
}

function renderNetwerk(d) {
  const uit = $('#netwerkuitslag');
  if (!uit) return;
  const g = d.gevonden || [];
  const nieuw = g.filter((x) => !x.bestaat_al);
  const kop = '<div class="netwerk-kop">'
    + '<b style="font-size:13.5px">' + g.length + ' adressen op ' + esc(d.subnet.cidr) + '</b>'
    + chip(nieuw.length + ' nog niet in de lijst', nieuw.length ? 'amber' : 'groen')
    + '<span class="rechts" style="margin-left:auto;display:flex;gap:8px">'
    + (nieuw.length ? '<button class="knop primair klein" type="button" id="netwerk-alles">Alle ' + nieuw.length + ' toevoegen</button>' : '')
    + '</span></div>';
  const rijen = g.map((x) => {
    const poorten = (x.poorten && x.poorten.length)
      ? x.poorten.slice(0, 6).map((p) => '<span class="port"><b>' + p + '</b></span>').join('')
      : '<span class="chip">geen open poort</span>';
    return '<label class="netrij' + (x.bestaat_al ? ' zal' : '') + '" style="cursor:' + (x.bestaat_al ? 'default' : 'pointer') + '">'
      + (x.bestaat_al ? '<span style="width:16px;min-width:16px"></span>' : '<input type="checkbox" name="kip" value="' + esc(x.ip) + '" checked>')
      + '<span class="kip">' + esc(x.ip) + '</span>'
      + '<span class="knaam">' + esc(x.naam || x.hostnaam || (x.eigen ? 'deze monitor' : '—')) + '</span>'
      + '<span class="kpoorten">' + poorten + '</span>'
      + (x.bestaat_al ? chip('staat er al', 'groen') : '')
      + '</label>';
  }).join('');
  uit.innerHTML = kop + '<div>' + (rijen || '<p class="leeg">Niets gevonden.</p>') + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop klein" type="button" id="netwerk-aanvinken">Alles selecteren</button>'
    + '<button class="knop primair klein" type="button" id="netwerk-voeg">Geselecteerde toevoegen</button></div>'
    + '<p class="hint">Alleen adressen die antwoorden komen in de lijst. Toevoegen zet ze in de monitor; de eerste scan per host start meteen.</p>';

  const voegToe = async (ips) => {
    if (!ips.length) { toast('Niets geselecteerd', true); return; }
    try {
      const r = await api('/api/netwerk/toevoegen', { method: 'POST', lichaam: { ips, interval_s: 1800 } });
      toast(r.aantal + ' adres' + (r.aantal === 1 ? '' : 'sen') + ' toegevoegd' + (r.overgeslagen.length ? ', ' + r.overgeslagen.length + ' stond er al' : ''));
      laadHosts();
    } catch (e) { toast(e.message, true); }
  };
  const alles = $('#netwerk-alles');
  if (alles) alles.addEventListener('click', () => voegToe(nieuw.map((x) => x.ip)));
  const aanvink = $('#netwerk-aanvinken');
  if (aanvink) aanvink.addEventListener('click', () => {
    uit.querySelectorAll('input[name=kip]').forEach((c) => { c.checked = true; });
  });
  const voeg = $('#netwerk-voeg');
  if (voeg) voeg.addEventListener('click', () => voegToe([...uit.querySelectorAll('input[name=kip]:checked')].map((c) => c.value)));
}

async function laadHostDetail(ip) {

  let d;
  try { d = await api('/api/hosts/' + encodeURIComponent(ip)); }
  catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p><button class="knop" data-terug>Terug</button></div></div>'; koppelTerug(); return; }

  const h = d.host;
  const st = hostStatus(h.status);
  const naam = h.naam || h.hostnaam || h.ip;
  const stats = [
    ['Status', st.tekst],
    ['Uptime 24 u', h.uptime24 === null || h.uptime24 === undefined ? '—' : nlGetal(h.uptime24) + '%'],

  const diensten = h.diensten && h.diensten.length ? '<div class="tabel-wrap"><table class="tabel"><thead><tr><th>Poort</th><th>Dienst</th><th>Titel</th><th>Antwoord</th></tr></thead><tbody>'
    + h.diensten.map((x) => '<tr><td class="mono">' + x.poort + '</td><td>' + esc(x.naam || '') + '</td><td>' + esc(x.titel || '—')

  const alerts = (h.alerts && h.alerts.length) ? '<div class="alerts">' + h.alerts.map((a) =>

    : '<p class="leeg">Geen open storingen voor dit adres.</p>';

      + (s.laatste ? chip(ss.tekst, ss.klasse === 'ok' ? 'groen' : ss.klasse === 'neer' ? 'rood' : 'amber') : '') + '</div></a>';

    + '<h2><span class="stip ' + st.klasse + '"></span>' + esc(naam) + (h.status === 'neer' ? chip('niet bereikbaar', 'rood') : '')

  koppelTerug();
  const scan = $('#hostscan');
  if (scan) scan.addEventListener('click', async () => {
    scan.classList.add('bezig');
    try {
      const r = await api('/api/hosts/' + encodeURIComponent(ip) + '/scan', { method: 'POST' });
      toast(r.scan.poorten.length + ' open poorten gevonden');
      laadHostDetail(ip);
    } catch (e) { toast(e.message, true); scan.classList.remove('bezig'); }
  });
  const maakTicket = () => {
    huidigeTab = 'tickets';
    ticketDetail = null;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === 'tickets'));
    laadTickets({ ip, titel: 'Onderzoek host ' + (h.hostnaam || ip), omschrijving: h.notitie || '' });
  };
  ['#hostticket', '#hostticket2'].forEach((sel) => { const b = $(sel); if (b) b.addEventListener('click', maakTicket); });
  const oh = $('#hostonderhoud');
  if (oh) oh.addEventListener('click', async () => {
    const tot = new Date(Date.now() + 2 * 3600e3);
    const antwoord = prompt('Tot wanneer in onderhoud? (bijv. ' + tot.toLocaleString('nl-NL') + ')', tot.toISOString().slice(0, 16));
    if (!antwoord) return;
    try {
      await api('/api/hosts/' + encodeURIComponent(ip) + '/onderhoud', { method: 'POST', lichaam: { tot: new Date(antwoord).toISOString(), reden: 'Handmatig ingesteld' } });
      toast('Onderhoud ingesteld'); laadHostDetail(ip);
    } catch (e) { toast(e.message, true); }
  });
  const weg = $('#hostweg');
  if (weg) weg.addEventListener('click', async () => {
    if (!confirm('IP-adres ' + ip + ' uit de lijst halen?')) return;
    try { await api('/api/hosts/' + encodeURIComponent(ip), { method: 'DELETE' }); hostDetail = null; toast('Verwijderd'); laadHosts(); }
    catch (e) { toast(e.message, true); }
  });
  beeld.querySelectorAll('[data-alert-opgelost]').forEach((b) => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    try { await api('/api/alerts/' + b.dataset.alertOpgelost + '/opgelost', { method: 'POST' }); laadHostDetail(ip); }
    catch (err) { toast(err.message, true); }
  }));
  beeld.querySelectorAll('[data-onderhoud-weg]').forEach((b) => b.addEventListener('click', async (e) => {
    e.stopPropagation();
    try { await api('/api/hosts/' + encodeURIComponent(ip) + '/onderhoud/' + b.dataset.onderhoudWeg, { method: 'DELETE' }); laadHostDetail(ip); }
    catch (err) { toast(err.message, true); }
  }));
}

// ── servers (hardware) ────────────────────────────────────────────────────────
let serversCache = [];

function serverStatus(st) {
  if (st === 'fout') return { klasse: 'neer', tekst: 'fout' };
  if (st === 'stil') return { klasse: 'wacht', tekst: 'stil' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'wacht op meting' };
  return { klasse: 'ok', tekst: 'online' };
}
function pctKlasse(p) {
  if (p === null || p === undefined) return '';
  return p >= 90 ? 'gevaar' : p >= 75 ? 'waarschuw' : '';
}
function meterRij(label, pct, extra = '') {
  const p = pct === null || pct === undefined ? null : Math.round(Number(pct));
  return '<div class="meter-rij"><span class="meter-label">' + esc(label) + '</span>'
    + '<div class="meter ' + pctKlasse(p) + '"><i style="width:' + (p === null ? 0 : p) + '%"></i></div>'
    + '<b>' + (p === null ? '—' : p + '%') + '</b>' + (extra ? '<span class="meter-extra">' + esc(extra) + '</span>' : '') + '</div>';
}
const gb = (n) => (n === null || n === undefined ? '—' : nlGetal(n) + ' GB');
const mb = (n) => (n === null || n === undefined ? '—' : nlGetal(n) + ' MB');
function uptimeTekst(s) {
  if (!s) return '—';
  const d = Math.floor(s / 86400), u = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return d + ' d ' + u + ' u';
  if (u) return u + ' u ' + m + ' m';
  return m + ' min';
}
function serverKaart(s) {
  const st = serverStatus(s.status);
  return '<a class="srv" data-server="' + s.id + '" href="#">'
    + '<div class="srv-top"><span class="srv-naam">' + esc(s.naam) + '</span>'
    + '<span class="chip ' + (st.klasse === 'ok' ? 'groen' : st.klasse === 'neer' ? 'rood' : 'amber') + '">' + st.tekst + '</span>'
    + (s.lokaal ? '<span class="chip">deze monitor</span>' : '') + '</div>'
    + '<div class="srv-host">' + esc(s.host || 'geen hostnaam') + '</div>'
    + '<div class="srv-meters">'
    + meterRij('CPU', s.cpu_pct, s.kernen ? s.kernen + ' kernen' : '')
    + meterRij('RAM', s.ram_pct, s.ram_totaal_mb ? mb(s.ram_totaal_mb) : '')
    + meterRij('Schijf', s.disk_pct, s.schijven ? s.schijven + ' schijven' : '')
    + meterRij('GPU', s.gpu_pct, s.gpus ? s.gpus + ' kaarten' : 'geen')
    + '</div>'
    + '<div class="srv-voet"><span>' + (s.temp_c !== null && s.temp_c !== undefined ? '🌡 ' + nlGetal(s.temp_c) + ' °C' : '') + '</span>'
    + '<span class="srv-tijd">' + (s.laatste ? 'gemeten ' + geleden(s.laatste) : 'nog niet gemeten') + '</span></div>'
    + '</a>';
}

// ── apparaten (homelab: UniFi, TrueNAS, generiek HTTP) ───────────────────────
const SOORT_LABEL = { unifi: 'UniFi-controller', truenas: 'TrueNAS', proxmox: 'Proxmox VE', generiek: 'HTTP/JSON' };
const SOORT_HINT = { unifi: 'URL van de controller (poort 443 of 8443)', truenas: 'URL van TrueNAS, bijvoorbeeld http://192.168.1.41', proxmox: 'URL met poort 8006, bijvoorbeeld https://192.168.1.12:8006. Gebruiker: root@pam!monitor met het token-secret (Datacenter → Permissions → API Tokens, Privilege Separation uit), óf root@pam met het wachtwoord (dan moet 2FA uit staan). Let op: staat Privilege Separation aan, geef de token dan de rol PVEAuditor op pad / met Propagate aan — anders zie je alleen nodenamen en geen cijfers.', generiek: 'Elke URL die JSON teruggeeft' };

function apparaatStatus(st) {
  if (st === 'fout') return { klasse: 'neer', tekst: 'fout' };
  if (st === 'stil') return { klasse: 'wacht', tekst: 'stil' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'nog niet gemeten' };
  return { klasse: 'ok', tekst: 'ok' };
}

function apparaatSamenvatting(a) {
  const d = a.data || {};
  if (a.soort === 'unifi') {
    if (!d.apparaten) return 'geen gegevens';
    const uit = [d.apparaten + ' apparaten'];
    if (d.online !== undefined) uit.push(d.online + ' online');
    if (d.clients !== undefined) uit.push(d.clients + ' clients');
    return uit.join(' · ');
  }
  if (a.soort === 'proxmox') {
    if (!d.nodes) return 'geen gegevens';
    const uit = [];
    uit.push((d.nodes_online ?? 0) + ' node' + ((d.nodes_online ?? 0) === 1 ? '' : 's') + ' online');
    if (d.nodes_offline) uit.push(d.nodes_offline + ' offline');
    if (d.vms) uit.push(d.vms.aan + '/' + d.vms.totaal + ' VM\'s aan');
    if (d.lxc) uit.push(d.lxc.aan + '/' + d.lxc.totaal + ' containers aan');
    if (d.versie) uit.push('versie ' + d.versie);
    return uit.join(' · ');
  }
  if (a.soort === 'truenas') {
    const pools = Array.isArray(d.pools) ? d.pools : [];
    const uit = [];
    if (pools.length) uit.push(pools.length + ' pool' + (pools.length > 1 ? 's' : ''));
    if (d.schijven && d.schijven.aantal) uit.push(d.schijven.aantal + ' schijven');
    if (d.meldingen !== undefined) uit.push(d.meldingen + ' meldingen');
    if (d.versie) uit.push('versie ' + d.versie);
    return uit.join(' · ') || 'geen gegevens';
  }
  if (d.code) return 'HTTP ' + d.code + (d.ms !== undefined ? ' · ' + d.ms + ' ms' : '');
  return 'geen gegevens';
}

function apparaatKaart(a) {
  const st = apparaatStatus(a.status);
  return '<a class="srv" data-apparaat="' + a.id + '" href="#">'
    + '<div class="srv-top"><span class="srv-naam">' + esc(a.naam) + '</span>'
    + '<span class="chip ' + (st.klasse === 'ok' ? 'groen' : st.klasse === 'neer' ? 'rood' : 'amber') + '">' + st.tekst + '</span>'
    + (a.in_onderhoud ? '<span class="chip blauw">onderhoud</span>' : '')
    + '<span class="chip">' + esc(SOORT_LABEL[a.soort] || a.soort) + '</span></div>'
    + '<div class="srv-host">' + esc(a.url.replace(/^https?:\/\//, '')) + '</div>'
    + '<div class="srv-stat" style="font-size:13px;color:var(--muted)">' + esc(apparaatSamenvatting(a)) + '</div>'
    + (a.fout ? '<div class="fout-tekst" style="font-size:12px;margin-top:8px">' + esc(a.fout).slice(0, 110) + '</div>' : '')
    + '<div class="srv-voet"><span>' + (a.laatste ? 'gemeten ' + geleden(a.laatste) : 'nog niet gemeten') + '</span></div></a>';
}

async function laadApparaten() {
  try {
    const d = await api('/api/apparaten');
    apparatenCache = d.apparaten || [];
    const fout = apparatenCache.filter((a) => a.status === 'fout').length;
    zetTeller('tab-apparaten', apparatenCache.length, fout > 0);
    beeld.innerHTML =
      '<div class="kaarten-kop"><div><h2>Apparaten</h2><p class="hint">Kastjes en diensten met een eigen API: de UniFi-controller, TrueNAS en elke HTTP-URL die JSON teruggeeft. De monitor leest ze rechtstreeks, zonder agent op het apparaat.</p></div>'
      + '<button class="knop primair" id="apparaat-toevoegen">' + ico.plus + ' Apparaat toevoegen</button></div>'
      + (fout ? '<p class="fout-tekst" style="margin-bottom:12px">' + fout + ' appara' + (fout === 1 ? 'at geeft' : 'ten geven') + ' een fout.</p>' : '')
      + (apparatenCache.length ? '<div class="srv-grid">' + apparatenCache.map(apparaatKaart).join('') + '</div>'
        : '<div class="kaart"><div class="kaart-body">' + leeg('Nog geen apparaten. Voeg je UniFi-controller, TrueNAS of Proxmox-host toe.') + '</div></div>');
    $('#apparaat-toevoegen').addEventListener('click', () => toonApparaatForm());
    document.querySelectorAll('[data-apparaat]').forEach((b) => b.addEventListener('click', () => {
      apparaatDetail = Number(b.dataset.apparaat);
      laadHuidig();
    }));
  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

function apparaatDetails(a) {
  const d = a.data || {};
  const rijen = [];
  const voeg = (k, v) => { if (v !== undefined && v !== null && v !== '') rijen.push('<tr><th>' + esc(k) + '</th><td>' + v + '</td></tr>'); };
  if (a.soort === 'unifi') {
    voeg('Site', esc(d.site || '—'));
    voeg('Versie', esc(d.versie || '—'));
    voeg('Apparaten', (d.apparaten ?? '—') + (d.online !== undefined ? ' · ' + d.online + ' online' : ''));
    const soorten = d.soorten || {};
    voeg('Soorten', Object.keys(soorten).map((k) => esc(k + ': ' + soorten[k])).join(' · ') || '—');
    voeg('Clients', d.clients ?? '—');
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    if (d.wan) voeg('WAN', esc([d.wan.status, d.wan.ip, d.wan.isp].filter(Boolean).join(' · ')) || '—');
    if (d.lan) voeg('LAN', esc([d.lan.status, d.lan.gebruikers !== null ? d.lan.gebruikers + ' gebruikers' : ''].filter(Boolean).join(' · ')) || '—');
    if (d.www) voeg('Controller', esc([d.www.status, d.www.latentie_ms !== null ? d.www.latentie_ms + ' ms' : ''].filter(Boolean).join(' · ')) || '—');
    const st = Array.isArray(d.storingen) ? d.storingen : [];
    voeg('Storingen', st.length ? st.map((x) => esc((x.onderdeel || '?') + ': ' + (x.status || '?'))).join(' · ') : 'geen');
  } else if (a.soort === 'proxmox') {
    voeg('Versie', esc([d.versie, d.release].filter(Boolean).join(' · ') || '—'));
    voeg('Nodes', (d.nodes_online ?? 0) + ' online' + (d.nodes_offline ? ' · <span class="chip rood">' + d.nodes_offline + ' offline</span>' : ''));
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    if (d.vms) voeg('Virtuele machines', d.vms.aan + ' aan · ' + d.vms.uit + ' uit · ' + d.vms.totaal + ' totaal');
    if (d.lxc) voeg('Containers', d.lxc.aan + ' aan · ' + d.lxc.uit + ' uit · ' + d.lxc.totaal + ' totaal');
    const st = Array.isArray(d.gestopt) ? d.gestopt : [];
    voeg('Gestopt', st.length ? st.map((x) => esc((x.naam || '?') + ' (' + x.soort + ', ' + x.node + ')')).join(' · ') : 'niets');
    voeg('Opslag', (Array.isArray(d.opslag) && d.opslag.length) ? (d.volle_opslag ? '<span class="chip rood">' + d.volle_opslag + ' bijna vol</span>' : 'gezond') : '—');
  } else if (a.soort === 'truenas') {
    voeg('Hostnaam', esc(d.hostnaam || '—'));
    voeg('Versie', esc(d.versie || '—'));
    voeg('Product', esc(d.product || '—'));
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    voeg('Geheugen', d.geheugen_gb ? gb(d.geheugen_gb * 1e9) : '—');
    voeg('Cores', d.cores ?? '—');
    if (d.schijven) voeg('Schijven', (d.schijven.aantal ?? 0) + ' · waarvan ' + (d.schijven.ssd ?? 0) + ' SSD');
    voeg('Meldingen', (d.meldingen ?? 0) + (d.kritiek ? ' · <span class="chip rood">' + d.kritiek + ' kritiek</span>' : ''));
  } else {
    voeg('HTTP-code', d.code ?? '—');
    voeg('Responstijd', d.ms !== undefined ? d.ms + ' ms' : '—');
    const w = d.waarden || {};
    const sleutels = Object.keys(w).slice(0, 12);
    if (sleutels.length) voeg('Waarden', sleutels.map((k) => esc(k + ': ' + w[k])).join('<br>'));
  }
  return rijen.length ? '<table class="srv-tabel"><tbody>' + rijen.join('') + '</tbody></table>' : '<p class="leeg">Nog geen gegevens.</p>';
}

// Uitslag van de rechten-test: per endpoint wat Proxmox teruggaf, plus de
// conclusie in gewone taal. Zo zie je meteen of het aan de token of de rechten ligt.
function rechtenKaart(r) {
  const kleur = (code) => (code >= 200 && code < 300 ? 'groen' : code === 0 ? 'amber' : 'rood');
  const tekst = (code) => (code >= 200 && code < 300 ? 'ok' : code === 401 ? 'token geweigerd' : code === 403 ? 'geen rechten' : code === 0 ? 'onbereikbaar' : 'HTTP ' + code);
  const goed = !!r.ok;
  return '<div class="kaart" style="margin-top:14px">'
    + '<div class="kaart-kop"><h2>Rechten testen</h2><span class="chip ' + (goed ? 'groen' : 'rood') + '">' + (goed ? 'in orde' : 'aandacht nodig') + '</span></div>'
    + '<div class="kaart-body">'
    + '<div class="alerts">' + (r.problemen || []).map((t) => '<div class="alert ' + (goed ? '' : 'rood') + '"><div class="tekst">' + esc(t) + '</div></div>').join('') + '</div>'
    + '<div style="overflow-x:auto"><table class="srv-tabel" style="margin-top:12px"><thead><tr><th>Endpoint</th><th>Uitkomst</th><th>Wat erin staat</th></tr></thead><tbody>'
    + (r.rijen || []).map((x) => '<tr><td class="mono">' + esc(x.pad) + '</td><td><span class="chip ' + kleur(x.code) + '">' + esc(tekst(x.code)) + '</span></td><td>' + esc(x.detail || x.uitleg || '—') + (x.ms ? ' <span class="mono">' + x.ms + ' ms</span>' : '') + '</td></tr>').join('')
    + '</tbody></table></div>'
    + ((r.rechten && r.rechten.length)
      ? '<p class="hint" style="margin-top:12px">Rechten die Proxmox voor deze token teruggeeft:</p>'
        + '<div class="alerts">' + r.rechten.map((x) => '<div class="alert"><div class="tekst"><b>' + esc(x.pad) + '</b> — ' + (x.rechten && x.rechten.length ? esc(x.rechten.join(', ')) : 'geen rechten') + '</div></div>').join('') + '</div>'
      : '')
    + '<p class="hint" style="margin-top:12px">Ingelogd met ' + esc(r.inloggen === 'token' ? 'API-token' : 'wachtwoord') + (r.gebruiker ? ' als ' + esc(r.gebruiker) : '') + ' op ' + esc(r.url || '') + '.</p>'
    + '</div></div>';
}

  const veldHint = SOORT_HINT[soort] || '';
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">' + (apparaat ? 'Apparaat wijzigen' : 'Apparaat toevoegen') + '</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">De monitor leest het apparaat via zijn eigen API. Bij UniFi de controller-URL en een beheerdersaccount; bij TrueNAS een API-key uit de webinterface (Instellingen → API-sleutels); bij Proxmox een API-token uit Datacenter → Permissions → API Tokens.</p>'
    + '<form id="appform">'
    + '<label class="veld"><span>Naam</span><input name="naam" value="' + esc(a.naam || '') + '" placeholder="bijv. unifi-thuis" required></label>'
    + '<label class="veld"><span>Soort</span><select name="soort" id="app-soort">' + opties + '</select></label>'
    + '<label class="veld"><span>URL</span><input name="url" value="' + esc(a.url || '') + '" placeholder="https://192.168.1.1" required></label>'
    + '<label class="veld"><span>Gebruiker of token</span><input name="gebruiker" value="' + esc(a.gebruiker || '') + '" placeholder="bijv. root@pam!monitor of een beheerder"></label>'
    + '<label class="veld"><span>Wachtwoord of API-key</span><input name="geheim" type="password" placeholder="' + (apparaat && a.heeft_geheim ? 'laat leeg om het bestaande te houden' : 'wachtwoord of API-key') + '"></label>'
    + '<p class="hint" id="app-hint">' + esc(veldHint) + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button type="button" class="knop" id="app-annuleer">Annuleren</button><button type="submit" class="knop primair">' + (apparaat ? 'Opslaan' : 'Toevoegen') + '</button></div></form>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');

    $('#app-hint').textContent = SOORT_HINT[e.target.value] || '';

  $('#appform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const lichaam = { naam: f.get('naam'), soort: f.get('soort'), url: f.get('url'), gebruiker: f.get('gebruiker'), geheim: f.get('geheim') };

      if (apparaat) await api('/api/apparaten/' + apparaat.id, { method: 'PATCH', lichaam });

      toast(apparaat ? 'Apparaat bijgewerkt' : 'Apparaat toegevoegd');
      if (apparaat) laadApparaatDetail(apparaat.id); else { apparaatDetail = null; laadHuidig(); }
    } catch (err) { toast(err.message, true); }
  });
}

function toonTokenModal(server, token) {
  const m = $('#modal');
  const t = token || '••••••••';
  const commando = 'BASE_URL=' + location.origin + ' TOKEN=' + t + ' node werdens-agent.js';
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">Agent-token voor ' + esc(server.naam) + '</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Zet dit token in de omgeving van de agent op die server. Het token is alleen nu zichtbaar; later kun je het via de serverpagina vernieuwen.</p>'
    + '<div class="tokenvak" id="tokenwaarde">' + esc(t) + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="knop" id="token-kopieer">Token kopiëren</button><button class="knop" id="commando-kopieer">Commando kopiëren</button></div>'
    + '<div class="tokenvak" style="font-size:11.5px">' + esc(commando) + '</div>'
    + '<p class="hint">Download het agent-script uit de repo: <code>scripts/werdens-agent.js</code>. Zet daar <code>BASE_URL</code> en <code>TOKEN</code> in de omgeving en laat het via cron elke minuut draaien.</p>'
    + '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="knop primair" id="token-sluit">Sluiten</button></div>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#token-sluit').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#token-kopieer').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(t); toast('Token gekopieerd'); } catch { toast('Kopiëren lukte niet', true); }
  });
  $('#commando-kopieer').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(commando); toast('Commando gekopieerd'); } catch { toast('Kopiëren lukte niet', true); }
  });
}

// ── instellingen ─────────────────────────────────────────────────────────────
async function laadInstellingen() {
  try {
    const d = await api('/api/instellingen');
    const curl = 'curl -H "Authorization: Bearer ' + d.agent_token + '" http://<dit-adres>/api/agent/tickets';
    beeld.innerHTML =
      '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>ICT-agent koppelen</h2></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">De agent leest en schrijft alleen tickets, met dit token. Geef het aan je ICT-agent en laat hem de opdracht hieronder uitvoeren.</p>'
      + '<label class="veld"><span>Agent-token</span><div style="display:flex;gap:8px"><input id="token" value="' + esc(d.agent_token) + '" readonly style="font-family:var(--mono);font-size:12.5px">'
      + '<button class="knop" id="kopieer">Kopiëren</button><button class="knop gevaar" id="nieuw-token">Vernieuwen</button></div></label>'
      + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;overflow-x:auto">'
      + esc('GET  /api/agent/tickets                 open tickets\nGET  /api/agent/tickets/:id             ticket + context\nPOST /api/agent/tickets/:id/berichten     bevinding terug\nPATCH /api/agent/tickets/:id            status zetten\nGET  /api/agent/sites                   site-status\nPOST /api/agent/scan { "ip": "..." }    host aftasten') + '</div>'
      + '<p class="hint">Voorbeeld: <code>' + esc(curl) + '</code></p>'
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Slack-meldingen</h2><span class="chip ' + (d.slack_aan && d.slack_webhook ? 'groen' : '') + '">' + (d.slack_aan && d.slack_webhook ? 'aan' : 'uit') + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Storingen worden als bericht naar een Slack-kanaal gestuurd. Maak in Slack een <b>Incoming Webhook</b> (App-directory → Incoming Webhooks → Add to Slack), kies het kanaal en plak de URL hier. Eén storing wordt één keer gemeld; blijft hij open, dan niet elke meetronde opnieuw.</p>'
      + '<form id="slackform"><label class="veld"><span>Webhook-URL</span><input name="slack_webhook" value="' + esc(d.slack_webhook || '') + '" placeholder="https://hooks.slack.com/services/..." autocomplete="off" spellcheck="false"></label>'
      + '<label class="veld"><span>Publiek adres — hier wijst de link in het bericht naar</span><input name="publieke_url" value="' + esc(d.publieke_url || '') + '" placeholder="https://dashboard.werdensmedia.net" autocomplete="off" spellcheck="false"></label>'
      + '<p class="hint" style="margin:-4px 0 12px">Nu gebruikt: <b>' + esc(d.publieke_url_actief || '') + '</b>' + (d.laatste_adres && d.laatste_adres !== d.publieke_url_actief ? ' · laatst geopend via ' + esc(d.laatste_adres) : '') + '. Laat leeg om het adres te gebruiken waarmee je het dashboard opent.</p>'
      + '<div style="display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 14px"><label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" name="slack_aan"' + (d.slack_aan ? ' checked' : '') + '> Meldingen versturen</label>'
      + '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" name="slack_herstel"' + (d.slack_herstel ? ' checked' : '') + '> Ook herstel melden</label></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="knop primair" type="submit">Opslaan</button><button class="knop" type="button" id="slack-test">Testbericht</button></div></form>'
      + (d.slack_laatst ? '<p class="hint">Laatst verzonden: ' + esc(geleden(d.slack_laatst)) + '</p>' : '')
      + (d.slack_laatst_fout ? '<p class="hint" style="color:var(--red)">Laatste fout: ' + esc(d.slack_laatst_fout) + '</p>' : '')
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Beheerder</h2></div><div class="kaart-body">'
      + '<form id="wwform" class="form-rij">'
      + '<label class="veld"><span>Naam</span><input name="admin_naam" value="' + esc(d.admin_naam) + '"></label>'
      + '<div class="form-rij twee"><label class="veld"><span>Huidig wachtwoord</span><input name="huidig_wachtwoord" type="password" autocomplete="current-password"></label>'
      + '<label class="veld"><span>Nieuw wachtwoord</span><input name="wachtwoord" type="password" autocomplete="new-password" minlength="8" placeholder="min. 8 tekens"></label></div>'
      + '<button class="knop primair" type="submit">Opslaan</button></form></div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>GitHub-token</h2><span class="chip ' + (d.github_token === 'ingesteld' ? 'groen' : '') + '">' + esc(d.github_token) + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Nodig voor de Projecten-tab (ook besloten repo&#39;s) en voor het bijwerken. Maak een token op GitHub → Settings → Developer settings → Personal access tokens met <b>repo</b> (en <b>read:user</b>). Het token wordt in de database bewaard en nooit teruggetoond.</p>'
      + '<form id="ghform"><label class="veld"><span>Token' + (d.github_login ? ' (nu: ' + esc(d.github_login) + (d.github_scopes ? ' · ' + esc(d.github_scopes) : '') + ')' : '') + '</span>'
      + '<input name="github_token" type="password" placeholder="' + (d.github_token === 'ingesteld' ? 'laat leeg om te behouden' : 'ghp_... of github_pat_...') + '" autocomplete="off" spellcheck="false"></label>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop primair" type="submit">Opslaan en testen</button>'
      + (d.github_token === 'ingesteld' ? '<button class="knop gevaar" type="button" id="gh-weg">Token verwijderen</button>' : '') + '</div></form>'
      + (d.github_token_bron ? '<p class="hint">Bron: ' + esc({ dashboard: 'ingesteld in dit dashboard', omgeving: 'omgevingsvariabele GITHUB_TOKEN', 'gh-config': 'de gh-CLI op deze machine' }[d.github_token_bron] || d.github_token_bron) + '</p>' : '')
      + (d.projecten_fout ? '<p class="hint" style="color:var(--red)">' + esc(d.projecten_fout) + '</p>' : '')
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Bijwerken</h2><span class="chip" id="upd-chip">' + esc(d.update_versie || d.versie) + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Haalt de nieuwste versie van GitHub en vervangt de programmabestanden; je gegevens blijven staan. Daarna start de dienst zichzelf opnieuw.</p>'
      + '<div id="upd-uitslag"><p class="hint" style="margin:0">Nu: versie <b>' + esc(d.update_versie || d.versie) + '</b>' + (d.update_sha ? ' · ' + esc(String(d.update_sha).slice(0, 7)) : '') + '</p></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop" type="button" id="upd-check">Controleer op updates</button>'
      + '<button class="knop primair" type="button" id="upd-doe" disabled>Nu bijwerken</button></div>'
      + '</div></div>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Systeem</h2></div><div class="kaart-body">'
      + '<div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)">'
      + '<div>Versie <b style="color:var(--txt)">' + esc(d.versie) + '</b></div>'
      + '<div>GitHub-token <b style="color:var(--txt)">' + esc(d.github_token) + '</b></div>'
      + '<div>Projecten opgehaald <b style="color:var(--txt)">' + geleden(d.projecten_op) + '</b></div>'
      + (d.projecten_fout ? '<div style="color:var(--red)">' + esc(d.projecten_fout) + '</div>' : '')
      + '</div></div></div>';
    $('#kopieer').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(d.agent_token); toast('Token gekopieerd'); }
      catch { toast('Kopiëren lukte niet', true); }
    });
    $('#nieuw-token').addEventListener('click', async () => {
      try { await api('/api/instellingen', { method: 'PATCH', lichaam: { agent_token: 'nieuw' } }); toast('Nieuw token aangemaakt'); laadInstellingen(); }
      catch (e) { toast(e.message, true); }
    });
    $('#slackform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api('/api/instellingen', { method: 'PATCH', lichaam: {
          slack_webhook: f.get('slack_webhook') || '',
          publieke_url: f.get('publieke_url') || '',
          slack_aan: !!f.get('slack_aan'),
          slack_herstel: !!f.get('slack_herstel'),
        } });
        toast('Slack-instellingen opgeslagen'); laadInstellingen();
      } catch (err) { toast(err.message, true); }
    });
    $('#slack-test').addEventListener('click', async () => {
      const knop = $('#slack-test');
      knop.disabled = true; knop.textContent = 'Versturen…';
      try { await api('/api/slack/test', { method: 'POST' }); toast('Testbericht verstuurd'); }
      catch (err) { toast(err.message, true); }
      finally { knop.disabled = false; knop.textContent = 'Testbericht'; }
    });
    $('#ghform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const knop = e.target.querySelector('button[type=submit]');
      knop.disabled = true; knop.textContent = 'Controleren…';
      try {
        const r = await api('/api/instellingen', { method: 'PATCH', lichaam: { github_token: f.get('github_token') || '' } });
        toast('Token opgeslagen' + (r.github_login ? ' als ' + r.github_login : ''));
        laadInstellingen();
      } catch (err) { toast(err.message, true); knop.disabled = false; knop.textContent = 'Opslaan en testen'; }
    });
    const ghWeg = $('#gh-weg');
    if (ghWeg) ghWeg.addEventListener('click', async () => {
      try { await api('/api/instellingen', { method: 'PATCH', lichaam: { github_token: '' } }); toast('Token verwijderd'); laadInstellingen(); }
      catch (err) { toast(err.message, true); }
    });
    $('#upd-check').addEventListener('click', async () => {
      const knop = $('#upd-check');
      knop.disabled = true; knop.textContent = 'Kijken…';
      try {
        const r = await api('/api/update/controleer', { method: 'POST' });
        $('#upd-uitslag').innerHTML = r.nieuw
          ? '<p style="margin:0;font-size:13.5px">Nieuw op GitHub: <b>' + esc(String(r.laatste.kort || '')) + '</b> — ' + esc(r.laatste.bericht || '') + (r.laatste.datum ? '<br><span class="hint" style="margin:0">' + geleden(r.laatste.datum) + '</span>' : '') + '</p>'
          : '<p style="margin:0;font-size:13.5px;color:var(--green)">Je draait al de nieuwste versie.</p>';
        $('#upd-doe').disabled = !r.nieuw;
      } catch (err) { toast(err.message, true); }
      finally { knop.disabled = false; knop.textContent = 'Controleer op updates'; }
    });
    $('#upd-doe').addEventListener('click', async () => {
      if (!confirm('Nu bijwerken? De dienst herstart daarna vanzelf.')) return;
      const knop = $('#upd-doe');
      knop.disabled = true; knop.textContent = 'Bijwerken…';
      try {
        const r = await api('/api/update/uitvoeren', { method: 'POST' });
        toast(r.al_actueel ? 'Al de nieuwste versie' : 'Bijgewerkt; de dienst herstart…');
        $('#upd-uitslag').innerHTML = '<p style="margin:0;font-size:13.5px">Bijgewerkt naar <b>' + esc(String(r.sha || '').slice(0, 7)) + '</b>. De pagina ververst over een paar seconden.</p>';
        setTimeout(() => location.reload(), 6000);
      } catch (err) { toast(err.message, true); knop.disabled = false; knop.textContent = 'Nu bijwerken'; }
    });
    $('#wwform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const lichaam = Object.fromEntries(new FormData(e.target).entries());
      try {
        const r = await api('/api/instellingen', { method: 'PATCH', lichaam });
        toast('Opgeslagen');
        if (r.opnieuw_inloggen) { toonLogin(); }
      } catch (err) { toast(err.message, true); }
    });
  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

// ── start ────────────────────────────────────────────────────────────────────
start();
setInterval(() => { if (huidigeTab === 'overzicht') laadOverzicht(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
