<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Werdens Monitor</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="mask-icon" href="/favicon.svg" color="#1d4ed8">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="version" content="1.6.0">
<style>
:root{
  --bg:#070b10; --pane:#0e151d; --pane2:#111b25; --pane3:#16222e;
  --line:#1c2a37; --line2:#273848;
  --txt:#e8f0f8; --muted:#8aa0b6; --muted2:#63809a;
  --accent:#2ee6a8; --accent-d:#0f8f68; --accent-soft:rgba(46,230,168,.12);
  --amber:#f5b544; --amber-soft:rgba(245,181,68,.13);
  --red:#ff5f6f; --red-soft:rgba(255,95,111,.13);
  --blue:#63a9ff; --blue-soft:rgba(99,169,255,.12);
  --paars:#b18cff;
  --r:14px; --r-klein:9px; --hoogte:40px; --hoogte-klein:32px;
  --schaduw:0 1px 0 rgba(255,255,255,.03), 0 18px 40px -24px rgba(0,0,0,.9);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 82% -10%, rgba(46,230,168,.09), transparent 62%),
    radial-gradient(800px 380px at 4% 0%, rgba(99,169,255,.07), transparent 58%),
    var(--bg);
  color:var(--txt); font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
body.uit{display:grid;place-items:center}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt)}
button{cursor:pointer}
::selection{background:rgba(46,230,168,.28)}

/* ── login ── */
#login{width:100%;max-width:392px;padding:24px}
#login .merk{margin-bottom:22px}
#login .kaart{padding:26px 24px}
#login h1{font-size:20px;margin:0 0 4px}
#login p.uitleg{color:var(--muted);margin:0 0 20px;font-size:14px}
#login label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:7px;font-weight:600}
#login input{width:100%;height:var(--hoogte)}
#login .knop{width:100%;justify-content:center;margin-top:16px;height:44px}
#login .fout{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
.login-voet{color:var(--muted2);font-size:12px;margin-top:16px;text-align:center}

/* ── shell ── */
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 64px}
#app.aan{display:block}
header.kop{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:16px 0 14px;background:linear-gradient(to bottom,var(--bg) 62%,rgba(7,11,16,.72) 100%);
  backdrop-filter:blur(6px);
}
.merk{display:flex;align-items:center;gap:11px;min-width:0}
.merk .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,#123c30,#0e151d 70%);border:1px solid #1d4b3c;box-shadow:inset 0 1px 0 rgba(46,230,168,.25)}
.merk .logo svg{width:20px;height:20px}
.merk .naam{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.merk .sub{font-size:11.5px;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
header.kop .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.meting-tijd{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap}

nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:20px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--muted);
  padding:11px 14px 13px;font-size:14px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;
}
nav.tabs button svg{width:17px;height:17px;flex:none}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button.actief{color:var(--accent);border-bottom-color:var(--accent);background:linear-gradient(to top,rgba(46,230,168,.08),transparent)}
nav.tabs .teller{font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--pane3);color:var(--muted);border:1px solid var(--line2)}
nav.tabs .teller.alarm{background:var(--red-soft);color:var(--red);border-color:rgba(255,95,111,.3)}

/* ── cards & typography ── */
.kaart{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 40%),var(--pane);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--schaduw)}
.kaart + .kaart{margin-top:14px}
.kaart-kop{display:flex;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.kaart-kop h2{font-size:12px;margin:0;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kaart-kop .rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
.kaart-body{padding:16px 18px}
h3{font-size:15px;margin:0}
p.leeg{color:var(--muted2);font-size:13.5px;margin:0}
.raster{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.raster>*{min-width:0}
@media(min-width:820px){.raster.twee{grid-template-columns:1.35fr 1fr}.raster.drie{grid-template-columns:repeat(3,1fr)}}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}}
.kpi{background:var(--pane);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line2)}
.kpi.goed:before{background:var(--accent)}.kpi.waarschuwing:before{background:var(--amber)}.kpi.fout:before{background:var(--red)}.kpi.info:before{background:var(--blue)}
.kpi .label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:700;display:flex;gap:6px;align-items:center}
.kpi .waarde{font-size:27px;font-weight:700;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .klein{font-size:12px;color:var(--muted);margin-top:2px}

/* ── status ── */
.stip{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--muted2);box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.stip.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stip.neer{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.stip.wacht{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.stip.puls{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--pane3);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.groen{background:var(--accent-soft);color:var(--accent);border-color:rgba(46,230,168,.28)}
.chip.rood{background:var(--red-soft);color:var(--red);border-color:rgba(255,95,111,.3)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(245,181,68,.3)}
.chip.blauw{background:var(--blue-soft);color:var(--blue);border-color:rgba(99,169,255,.3)}
.chip.mono{font-family:var(--mono);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.chip.groot{font-size:13px;padding:3px 10px}

/* ── lijsten ── */
.rijen{display:flex;flex-direction:column}
.rij{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:inherit}
.rij:first-child{border-top:0}
.rij:hover{background:rgba(255,255,255,.022);text-decoration:none}
.rij .groot{flex:1;min-width:0}
.rij .naam{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.rij .naam .tekst{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rij .onder{font-size:12.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rij .rechts{display:flex;align-items:center;gap:10px;flex:none;min-width:0;max-width:100%;font-variant-numeric:tabular-nums}

/* ── sparkline ── */
.spark{display:flex;gap:2px;align-items:flex-end;height:22px;flex:none}
.spark i{width:3px;border-radius:1px;background:var(--accent);opacity:.85;display:block}
.spark i.neer{background:var(--red);height:22px!important;opacity:1}
.spark i.leeg{background:var(--line2);height:6px!important}

/* ── knoppen ── */
.knop{display:inline-flex;align-items:center;gap:7px;height:var(--hoogte);padding:0 14px;border-radius:10px;
  border:1px solid var(--line2);background:var(--pane2);color:var(--txt);font-weight:600;font-size:13.5px;
  white-space:nowrap;flex:none;transition:background .12s,border-color .12s,transform .06s}
.knop:hover{background:var(--pane3);border-color:#39506a;text-decoration:none}
.knop:active{transform:translateY(1px)}
.knop svg{width:15px;height:15px}
.knop.primair{background:linear-gradient(180deg,#25c895,#14a578);border-color:#2ee6a8;color:#04211a;font-weight:700}
.knop.primair:hover{background:linear-gradient(180deg,#2ee6a8,#17b183)}
.knop.stil{background:transparent;border-color:transparent;color:var(--muted)}
.knop.stil:hover{background:var(--pane2);color:var(--txt)}
.knop.gevaar{color:var(--red);border-color:rgba(255,95,111,.35);background:var(--red-soft)}
.knop.klein{height:var(--hoogte-klein);font-size:12.5px;padding:0 10px;border-radius:8px}
.knop[disabled]{opacity:.5;cursor:not-allowed}
.knop.bezig{opacity:.75;pointer-events:none}

/* ── formulieren ── */
label.veld{display:block;margin-bottom:12px}
label.veld span{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--pane2);border:1px solid var(--line2);border-radius:9px;padding:0 12px;height:var(--hoogte);outline:none}
textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5;flex:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238aa0b6' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}
.form-rij{display:grid;gap:12px}
@media(min-width:700px){.form-rij.twee{grid-template-columns:1fr 1fr}.form-rij.drie{grid-template-columns:1fr 1fr 1fr}}
.hint{font-size:12px;color:var(--muted2);margin:6px 0 0}
.fout-tekst{color:var(--red);font-size:13px;margin-top:8px}

/* ── details/uitklap ── */
details.uitklap{border:1px solid var(--line);border-radius:var(--r);background:var(--pane);margin-bottom:16px}
details.uitklap>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
details.uitklap>summary svg{width:17px;height:17px;flex:none}
details.uitklap>summary::-webkit-details-marker{display:none}
details.uitklap>summary:hover{color:var(--txt)}
details.uitklap>summary .plus{margin-left:auto;color:var(--muted2);font-size:18px;line-height:1}
details.uitklap[open]>summary{border-bottom:1px solid var(--line);color:var(--txt)}
details.uitklap .binnen{padding:16px}
/* Netwerkrijen: eigen opmaak, want de globale input-regel zet elk veld op 100% breed. */
.netrij{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.netrij input[type=checkbox]{width:16px;height:16px;min-width:16px;flex:none;padding:0;margin:0;accent-color:var(--accent);cursor:pointer}
.netrij .kip{font-family:var(--mono);font-size:12.5px;min-width:112px}
.netrij .knaam{flex:0 1 340px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.netrij .kpoorten{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
@media (max-width:700px){
  .netrij{flex-wrap:wrap;row-gap:6px}
  .netrij .knaam{flex:1 1 auto}
  .netrij .kpoorten{flex:1 1 100%;justify-content:flex-start}
}
.netrij.zal{opacity:.72}
.netwerk-kop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

/* ── projecten ── */
.project-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.project-grid{grid-template-columns:1fr 1fr}}
.proj{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.proj .top{display:flex;align-items:center;gap:8px;min-width:0}
.proj .top .naam{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .top .rechts{margin-left:auto;display:flex;gap:6px;flex:none}
.proj .beschr{font-size:12.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.proj .voet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted2);border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.proj .voet .sha{font-family:var(--mono);font-size:11px;color:var(--muted)}
.proj .voet .spacer{margin-left:auto}
.zoek{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.zoek input{flex:1}
@media(min-width:760px){.zoek input{max-width:340px}}

/* ── tickets ── */
.ticket-rij{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.ticket-rij:first-child{border-top:0}
.ticket-rij:hover{background:rgba(255,255,255,.022)}
.ticket-rij .prio{width:3px;align-self:stretch;border-radius:2px;background:var(--muted2);flex:none}
.ticket-rij .prio.kritiek{background:var(--red)}.ticket-rij .prio.hoog{background:var(--amber)}.ticket-rij .prio.normaal{background:var(--blue)}.ticket-rij .prio.laag{background:var(--line2)}
.ticket-rij .midden{flex:1;min-width:0}
.ticket-rij .titel{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-rij .meta{font-size:12px;color:var(--muted2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ticket-rij .meta .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ticket-kop{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ticket-kop h2{font-size:19px;margin:0;letter-spacing:-.01em}
.ticket-kop .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted2)}
.berichten{display:flex;flex-direction:column;gap:10px;margin:4px 0 16px}
.bericht{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--pane2);max-width:min(680px,94%)}
.bericht.agent{border-color:rgba(99,169,255,.28);background:var(--blue-soft);margin-left:auto}
.bericht .kop{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted2);margin-bottom:5px}
.bericht .kop b{color:var(--txt);font-size:12px}
.bericht .tekst{white-space:pre-wrap;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.context-blok{background:var(--pane2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px}
.context-blok h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}
.context-blok ul{margin:0;padding-left:16px;color:var(--muted)}
.context-blok li{margin:3px 0}
.poorten{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;background:#0d241d;border:1px solid rgba(46,230,168,.4);
  color:var(--accent);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.aan{opacity:1;transform:translate(-50%,0)}
#toast.fout{background:#2a1015;border-color:rgba(255,95,111,.45);color:var(--red)}

/* ── modal ── */
#modal{position:fixed;inset:0;background:rgba(3,6,9,.72);backdrop-filter:blur(3px);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
#modal.aan{display:flex}
#modal .kaart{max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:20px}

/* ── tabel ── */
.tabel{width:100%;border-collapse:collapse;font-size:12.5px}
.tabel th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
.tabel td{padding:7px 8px;border-bottom:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.tabel tr:last-child td{border-bottom:0}
.tabel td.ok{color:var(--accent)}.tabel td.neer{color:var(--red)}

/* ── details stats ── */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--pane2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}
.stat .v.klein{font-size:14px}

/* ── mobiel ── */
@media(max-width:760px){
  #app{padding:0 12px 80px}
  header.kop{padding:12px 0 10px;gap:10px}
  .merk .sub{display:none}
  .merk .naam{font-size:15px}
  .meting-tijd{display:none}
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(6,1fr);gap:0;
    background:rgba(9,14,20,.97);backdrop-filter:blur(10px);border-top:1px solid var(--line);border-bottom:0;
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));margin:0}
  nav.tabs button{flex-direction:column;gap:3px;padding:6px 2px 4px;font-size:10.5px;min-height:46px;border-bottom:0;border-radius:9px;justify-content:center;overflow:hidden}
  nav.tabs button svg{width:19px;height:19px}
  nav.tabs button.actief{background:var(--accent-soft)}
  nav.tabs .navfull{display:none}
  .rij{padding:11px 14px;flex-wrap:wrap;row-gap:3px}
  .rij .groot{flex:1 1 calc(100% - 26px)}
  .rij .rechts{gap:7px;flex:1 1 100%;justify-content:flex-start;padding-left:26px;flex-wrap:wrap}
  .rij .onder{white-space:normal;overflow:visible}
  .kaart-body{padding:14px}
  .kaart-kop{padding:13px 14px 11px}
  .knop{height:38px;font-size:13px}
  .spark{display:none}
  .project-grid{grid-template-columns:1fr}
}
@media(min-width:761px){nav.tabs .navkort{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ══════════════════════════════════════════════════════════════════════════
   Huisstijl Werdens Media — licht, blauw en cyaan uit het logo.
   Eén override-laag: hieronder gelden de merkkleuren, kaarten, knoppen,
   statussen en het nieuwe IP-adressenscherm. Latere regels winnen.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --bg:#f4f7fb; --pane:#ffffff; --pane2:#f7fafd; --pane3:#eef3fa;
  --line:#e3eaf4; --line2:#cfdaeb;
  --txt:#0f172a; --muted:#55657f; --muted2:#8296ae;
  --accent:#2ea3f2; --accent-d:#1e73be; --accent-soft:#e8f4fd;
  --accent-2:#0ea5b7;
  --ok:#059669; --ok-soft:#e6f6ef;
  --amber:#b45309; --amber-soft:#fdf1e2;
  --red:#dc2626; --red-soft:#fdeaea;
  --blue:#1e73be; --blue-soft:#e8f4fd;
  --paars:#7c3aed;
  --merk:linear-gradient(118deg,#5ff0e8 0%,#2ea3f2 55%,#1e73be 100%);
  --r:16px; --r-klein:10px; --hoogte:40px; --hoogte-klein:32px;
  --schaduw:0 1px 2px rgba(15,23,42,.05),0 12px 28px -20px rgba(15,23,42,.3);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body{
  color:var(--txt);
  background:radial-gradient(1100px 520px at 90% -10%,rgba(95,240,232,.12),transparent 62%),
             radial-gradient(900px 480px at -8% -4%,rgba(74,76,248,.08),transparent 58%),
             var(--bg);
  background-attachment:fixed;
}
a{color:var(--accent)}
body.uit{background:radial-gradient(900px 520px at 20% 0%,rgba(95,240,232,.16),transparent 55%),
                    radial-gradient(900px 520px at 85% 10%,rgba(74,76,248,.14),transparent 55%),#f4f7fb}

header.kop{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.88);
  backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:11px 0}
.merk .logo{width:44px;height:44px;border-radius:0;background:transparent;border:0;box-shadow:none}
.merk .logo img{width:100%;height:100%;object-fit:contain;display:block}
.merk .naam{font-size:17px;letter-spacing:-.025em;color:var(--txt)}
.merk .sub{color:var(--muted2);letter-spacing:.08em}

nav.tabs{gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs button{color:var(--muted);border-bottom:2px solid transparent;border-radius:0;padding:11px 13px;font-weight:600}
nav.tabs button:hover{color:var(--accent)}
nav.tabs button.actief{color:var(--accent);border-bottom-color:var(--accent);
  background:linear-gradient(to top,var(--accent-soft),transparent 78%)}
nav.tabs button.actief svg{color:var(--accent)}
nav.tabs .teller{background:var(--pane3);color:var(--muted);border-color:var(--line)}
nav.tabs .teller.alarm{background:var(--red-soft);color:var(--red);border-color:#f3cccc}

.kaart{background:var(--pane);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--schaduw)}
.kaart-kop{background:var(--pane2);border-bottom:1px solid var(--line);border-radius:var(--r) var(--r) 0 0;padding:14px 18px 12px}
.kaart-kop h2{color:var(--muted);letter-spacing:.12em}
h3{color:var(--txt)}
p.leeg{color:var(--muted2)}

.kpis{gap:12px}
.kpi{background:var(--pane);border:1px solid var(--line);box-shadow:var(--schaduw)}
.kpi:before{background:var(--line2);width:3px}
.kpi.goed:before{background:var(--ok)}
.kpi.waarschuwing:before{background:var(--amber)}
.kpi.fout:before{background:var(--red)}
.kpi.info:before{background:var(--accent)}
.kpi .label{color:var(--muted2)}
.kpi .waarde{color:var(--txt)}
.kpi .klein{color:var(--muted)}

.stip{background:var(--muted2);box-shadow:0 0 0 3px rgba(15,23,42,.05)}
.stip.ok{background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.stip.neer{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.stip.wacht{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.stip.onderhoud{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.chip{background:var(--pane3);border:1px solid var(--line);color:var(--muted)}
.chip.groen{background:var(--ok-soft);color:var(--ok);border-color:#bfe9d7}
.chip.rood{background:var(--red-soft);color:var(--red);border-color:#f6cccc}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:#f0d8b4}
.chip.blauw{background:var(--blue-soft);color:var(--accent);border-color:#c9d8fb}
.chip.merk{background:var(--accent-soft);color:var(--accent);border-color:#c9d8fb}

.rij,.ticket-rij{border-color:var(--line)}
.rij:hover,.ticket-rij:hover{background:var(--pane2)}
.rij .onder,.ticket-rij .meta{color:var(--muted2)}

.spark i{background:var(--ok);opacity:.75}
.spark i.neer{background:var(--red)}

.knop{background:var(--pane);border:1px solid var(--line2);color:var(--txt)}
.knop:hover{background:var(--pane2);border-color:#b6c7dd}
.knop.primair{background:var(--merk);border-color:transparent;color:#fff;font-weight:700;
  box-shadow:0 10px 20px -14px rgba(74,76,248,.95)}
.knop.primair:hover{background:linear-gradient(118deg,#4fe6dd 0%,#2b98e6 55%,#1b6cb4 100%);filter:brightness(1.02)}
.knop.stil{background:transparent;border-color:transparent;color:var(--muted)}
.knop.stil:hover{background:var(--pane3);color:var(--txt)}
.knop.gevaar{background:var(--red-soft);border-color:#f3c9c9;color:var(--red)}
.knop.gevaar:hover{background:#fbdcdc}

input,select,textarea{background:var(--pane);border:1px solid var(--line2);color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238296ae' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>")}

details.uitklap{background:var(--pane);border-color:var(--line)}
details.uitklap[open]>summary{border-color:var(--line)}
.bericht{background:var(--pane2);border-color:var(--line)}
.bericht.agent{background:var(--blue-soft);border-color:#c9d8fb}
.context-blok{background:var(--pane2);border-color:var(--line)}
.tabel th,.tabel td{border-color:var(--line)}
.tabel td.ok{color:var(--ok)}
.stat{background:var(--pane2);border-color:var(--line)}

#toast{background:#0f172a;border-color:#0f172a;color:#fff;box-shadow:0 18px 40px -20px rgba(15,23,42,.7)}
#toast.fout{background:var(--red);border-color:var(--red);color:#fff}
#modal{background:rgba(15,23,42,.42)}
#modal .kaart{box-shadow:0 30px 70px -30px rgba(15,23,42,.55)}

/* ── IP-adressen ── */
.host-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:780px){.host-grid{grid-template-columns:1fr 1fr}}
.host{background:var(--pane);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
  display:flex;flex-direction:column;gap:9px;cursor:pointer;box-shadow:var(--schaduw);transition:border-color .12s,transform .06s}
.host:hover{border-color:#b6c7dd;transform:translateY(-1px)}
.host.neer{border-left:3px solid var(--red)}
.host.ok{border-left:3px solid var(--ok)}
.host.onderhoud{border-left:3px solid var(--accent)}
.host.onbekend{border-left:3px solid var(--line2)}
.host .top{display:flex;align-items:center;gap:9px;min-width:0}
.host .naam{font-weight:650;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host .ip{font-family:var(--mono);font-size:12.5px;color:var(--accent);font-weight:600}
.host .rechts{margin-left:auto;display:flex;gap:6px;flex:none}
.host .onder{font-size:12.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.host .voet{display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:9px;font-size:12px;color:var(--muted2)}
.port-chips{display:flex;flex-wrap:wrap;gap:5px}
.port{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:11.5px;font-weight:600;
  padding:2px 7px;border-radius:7px;background:var(--pane3);border:1px solid var(--line);color:var(--muted)}
.port b{color:var(--accent);font-weight:700}
.alerts{display:flex;flex-direction:column;gap:8px}
/* Meldingen: één rij per open storing, met ernst, tekst en acties. */
.melding-rij{padding:14px 16px;border-bottom:1px solid var(--lijn,#e5ecf4)}
.melding-rij:last-child{border-bottom:0}
.melding-kop{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.melding-kop .tijd{margin-left:auto;color:var(--muted);font-size:12.5px}
.melding-tekst{margin:6px 0 8px;font-size:13.5px;line-height:1.45}
.melding-voet{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.melding-acties{display:flex;gap:6px;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 13px;border-radius:11px;
  border:1px solid var(--line);background:var(--pane2);font-size:13px}
.alert.rood{border-color:#f6cccc;background:var(--red-soft)}
.alert.amber{border-color:#f0d8b4;background:var(--amber-soft)}
.alert .tekst{flex:1;min-width:0}
.alert .tijd{font-size:11.5px;color:var(--muted2);white-space:nowrap}
.host-kop{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.host-kop .merkblok{flex:1;min-width:0}
.host-kop h2{font-size:22px;margin:0 0 2px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.host-kop .ipgroot{font-family:var(--mono);font-size:13.5px;color:var(--accent);font-weight:600}
.host-kop .acties{display:flex;gap:8px;flex-wrap:wrap}
.merkstreep{height:3px;border-radius:3px;background:var(--merk);width:56px;margin:0 0 14px}
@media(max-width:760px){
  header.kop{padding:10px 0}
  .merk .logo{width:38px;height:38px}
  nav.tabs{grid-template-columns:repeat(6,1fr);background:rgba(255,255,255,.97)}
  nav.tabs button.actief{background:var(--accent-soft)}
  .host-kop h2{font-size:19px}
}

/* servers */
.kaarten-kop{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.kaarten-kop h2{font-size:21px;margin:0 0 4px;letter-spacing:-.02em}
.kaarten-kop .knop{margin-left:auto}
.srv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px}
.srv{display:block;background:var(--pane);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;
  text-decoration:none;color:var(--txt);transition:border-color .15s,box-shadow .15s}
.srv:hover{border-color:#bcd8ee;box-shadow:0 6px 20px -14px rgba(15,23,42,.35)}
.srv-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:3px}
.srv-naam{font-weight:700;font-size:15px}
.srv-host{font-size:12px;color:var(--muted2);font-family:var(--mono);margin-bottom:12px}
.srv-meters{display:flex;flex-direction:column;gap:7px}
.srv-voet{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:9px;margin-top:12px;
  font-size:11.5px;color:var(--muted2)}
.srv-tijd{white-space:nowrap}
.meter-rij{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.meter-label{width:48px;flex:none;font-weight:600;color:var(--muted2)}
.meter{flex:1;height:7px;border-radius:99px;background:var(--pane3);overflow:hidden;min-width:40px}
.meter>i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .4s}
.meter.waarschuw>i{background:var(--amber)} .meter.gevaar>i{background:var(--red)}
.meter-rij b{min-width:36px;text-align:right;font-size:12px;color:var(--txt)}
.meter-extra{font-size:11px;color:var(--muted2);white-space:nowrap}
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.meters .kaart{margin:0}
.meter-titel{font-size:11.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);margin-bottom:10px}
.meter-detail{font-size:12px;color:var(--muted2);margin-top:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srv-kop{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.srv-kop .merkblok{flex:1;min-width:0}
.srv-kop h2{font-size:22px;margin:0 0 3px;letter-spacing:-.02em;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.srv-kop .srv-sub{font-family:var(--mono);font-size:12.5px;color:var(--muted2)}
.srv-kop .acties{display:flex;gap:8px;flex-wrap:wrap}
.srv-tabel{width:100%;border-collapse:collapse;font-size:13px}
.srv-tabel th,.srv-tabel td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.srv-tabel thead th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted2);background:var(--pane2)}
.srv-tabel tbody th{font-weight:600;color:var(--muted);width:120px;white-space:nowrap}
.srv-tabel tr:last-child td,.srv-tabel tr:last-child th{border-bottom:0}
.srv-tabel .rechts{text-align:right;color:var(--muted2);white-space:nowrap}
.srv-tabel .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted2)}
.grafiek{display:flex;align-items:flex-end;gap:3px;height:44px}
.grafiek i{flex:1;min-width:2px;border-radius:3px 3px 0 0;background:var(--accent);opacity:.75}
.grafiek i.waarschuw{background:var(--amber)} .grafiek i.gevaar{background:var(--red)}
.tokenvak{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-family:var(--mono);
  font-size:12px;color:var(--txt);word-break:break-all}
@media(max-width:760px){.srv-grid{grid-template-columns:minmax(0,1fr)}.srv-tabel{font-size:12px}.srv-tabel th,.srv-tabel td{padding:8px 9px}.meters{grid-template-columns:minmax(0,1fr)}}
</style>
</head>

<div id="app">

        <div class="naam">Werdens Monitor</div>
        <div class="sub">Werdens Media · infrastructuur</div>

      <button class="knop stil klein" id="vernieuw" title="Alles verversen">Verversen</button>
      <button class="knop stil klein" id="uitloggen" title="Uitloggen">Uit</button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>

    </button>
    <button data-tab="servers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="7" rx="2"/><rect x="3" y="14" width="18" height="7" rx="2"/><path d="M7 6.5h.01M7 17.5h.01M12 6.5h5M12 17.5h5"/></svg>
      <span class="navfull">Servers</span><span class="navkort">Servers</span><span class="teller" id="tab-servers"></span>
    </button>
    <button data-tab="apparaten">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9L12 3z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8a2 2 0 012-2h12a2 2 0 012 2v2a2 2 0 000 4v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2a2 2 0 000-4z"/><path d="M12 6v2M12 11v2M12 16v2"/></svg>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/></svg>
      <span class="navfull">Instellingen</span><span class="navkort">Beheer</span>

  </nav>

  <main id="beeld"></main>
</div>

<script>
'use strict';
// ── helpers ──────────────────────────────────────────────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const beeld = $('#beeld');
const nlGetal = (w) => Number.isFinite(Number(w)) ? String(Number(w)).replace('.', ',') : String(w ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// "2.4.0" wordt "v2.4.0"; "commit abc123" blijft zoals het is.
const versieLabel = (v) => { const t = String(v || '').trim(); if (!t) return ''; return /^\d/.test(t) ? 'v' + t : t; };

function datum(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('nl-NL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function geleden(iso) {
  if (!iso) return 'nooit';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (!Number.isFinite(s)) return '—';
  if (s < 45) return 'net nu';
  if (s < 3600) return Math.round(s / 60) + ' min geleden';
  if (s < 86400) return Math.round(s / 3600) + ' uur geleden';
  return Math.round(s / 86400) + ' dagen geleden';
}
function toast(tekst, isFout = false) {
  const t = $('#toast');
  t.textContent = tekst;

async function api(pad, opties = {}) {
  const o = { headers: { 'content-type': 'application/json' }, ...opties };
  if (o.lichaam !== undefined) { o.body = JSON.stringify(o.lichaam); delete o.lichaam; }
  const res = await fetch(pad, o);
  if (res.status === 401 && pad !== '/api/login') { toonLogin(); throw new Error('Niet ingelogd'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.fout || ('Fout ' + res.status));
  return data;
}

function leeg(tekst) { return '<p class="leeg" style="padding:18px">' + esc(tekst) + '</p>'; }
function chip(tekst, kleur = '') { return '<span class="chip ' + kleur + '">' + esc(tekst) + '</span>'; }

function spark(historie) {
  if (!historie || !historie.length) return '<div class="spark"><i class="leeg"></i></div>';
  const laatste = historie.slice(-26);
  return '<div class="spark" title="Laatste metingen">' + laatste.map((c) => {
    const h = c.ok ? Math.max(5, Math.min(22, Math.round(22 - Math.min(2000, c.ms || 100) / 130))) : 22;
    return '<i class="' + (c.ok ? '' : 'neer') + '" style="height:' + h + 'px"></i>';
  }).join('') + '</div>';
}
function statusVan(site) {

  if (!site.laatste) return { klasse: 'wacht', tekst: 'wacht op meting' };
  return site.laatste.ok ? { klasse: 'ok', tekst: 'online' } : { klasse: 'neer', tekst: 'storing' };

// ── meldingen (ernst, bevestigen, escalatie, onderhoud, SLA) ──────────────────
let meldingFilter = 'alle';

const ERNST_KLEUR = { kritiek: 'rood', hoog: 'amber', gemiddeld: 'amber', waarschuwing: '', info: 'groen' };
const ERNST_ICOON = { kritiek: '●', hoog: '●', gemiddeld: '●', waarschuwing: '●', info: '●' };

function meldingRij(a) {
  const k = ERNST_KLEUR[a.ernst] || '';
  const ack = a.bevestigd ? '<span class="chip groen" title="' + esc(a.bevestigd_door || '') + '">bevestigd</span>' : '';
  const ond = a.in_onderhoud ? '<span class="chip">onderhoud</span>' : '';
  return '<div class="melding-rij" data-melding="' + a.id + '">'
    + '<div class="melding-kop"><span class="chip ' + k + '">' + esc(a.ernst || '') + '</span>'
    + '<b>' + esc(a.naam || a.ip || '') + '</b>' + ack + ond
    + '<span class="tijd">' + geleden(a.op) + '</span></div>'
    + '<div class="melding-tekst">' + esc(a.bericht || '') + '</div>'
    + '<div class="melding-voet">'
    + '<span class="hint">' + esc(a.soort || '') + (a.meldingen > 1 ? ' · ' + a.meldingen + '× gemeld' : '')
    + (a.uptime24 !== null && a.uptime24 !== undefined ? ' · uptime 24u ' + nlGetal(a.uptime24) + '%' : '') + '</span>'
    + '<span class="melding-acties">'
    + (a.bevestigd ? '<button class="knop stil klein" data-terugzetten="' + a.id + '">Bevestiging intrekken</button>'
        : '<button class="knop klein" data-bevestig="' + a.id + '">Bevestigen</button>')
    + '<button class="knop klein" data-oplossen="' + a.id + '">Oplossen</button>'
    + '</span></div>'
    + (a.notitie ? '<div class="hint" style="margin-top:4px">Notitie: ' + esc(a.notitie) + '</div>' : '')
    + '</div>';
}

async function laadMeldingen() {
  const d = await api('/api/problemen').catch(() => ({ problemen: [], tellingen: {}, ernst: {} }));
  const open = d.problemen || [];
  const tellingen = d.tellingen || {};
  const ernstLabels = d.ernst || {};
  zetTeller('tab-meldingen', open.length, open.some((a) => a.ernst === 'kritiek' || a.ernst === 'hoog'));
  const zichtbaar = meldingFilter === 'alle' ? open : open.filter((a) => a.ernst === meldingFilter);
  const chips = [['alle', open.length], ...Object.keys(ernstLabels).map((k) => [k, tellingen[k] || 0])];
  const knoppen = chips.map(([k, n]) =>
    '<button class="knop klein' + (meldingFilter === k ? ' primair' : '') + '" data-ernst="' + k + '">' + esc(k === 'alle' ? 'Alle' : ernstLabels[k]) + ' <span class="mono">' + n + '</span></button>').join(' ');

  let sla = '';
  try {
    const s = await api('/api/sla');
    const rijen = (s.hosts || []).filter((h) => h.uptime24 !== null || h.open);
    if (rijen.length) {
      sla = '<div class="kaart" style="margin-top:16px"><div class="kaart-kop"><h2>SLA per host</h2><span class="chip">24 uur · 7 dagen</span></div><div class="kaart-body" style="padding:0">'
        + '<table class="srv-tabel"><thead><tr><th>Host</th><th>Uptime 24 uur</th><th>Uptime 7 dagen</th><th>Open meldingen</th></tr></thead><tbody>'
        + rijen.map((h) => '<tr><td><b>' + esc(h.naam) + '</b><div class="mono">' + esc(h.ip) + '</div></td>'
          + '<td>' + (h.uptime24 === null || h.uptime24 === undefined ? '—' : '<span class="chip ' + (h.uptime24 < 99 ? 'rood' : h.uptime24 < 99.9 ? 'amber' : 'groen') + '">' + nlGetal(h.uptime24) + '%</span>') + '</td>'
          + '<td>' + (h.uptime168 === null || h.uptime168 === undefined ? '—' : nlGetal(h.uptime168) + '%') + '</td>'
          + '<td>' + (h.open || 0) + '</td></tr>').join('')
        + '</tbody></table></div></div>';
    }
  } catch { /* SLA is bijzaak */ }

  beeld.innerHTML =
    '<div class="kaarten-kop"><div><h2>Meldingen</h2><p class="hint">Open storingen met hun ernst. Bevestig een melding als je hem hebt gezien; hij blijft dan open, maar gaat niet opnieuw naar Slack. Kritieke en hoge meldingen worden na een uur opnieuw gemeld als ze niet bevestigd zijn. Tijdens een onderhoudsvenster gaat er niets naar buiten.</p></div>'
    + '<button class="knop primair" id="ond-plannen">Onderhoud inplannen</button></div>'
    + '<div class="kaart"><div class="kaart-body" style="display:flex;gap:8px;flex-wrap:wrap">' + knoppen + '</div></div>'
    + (open.length ? '<div class="kaart" style="margin-top:14px"><div class="kaart-body" style="padding:0">'
        + (zichtbaar.length ? zichtbaar.map(meldingRij).join('') : '<p class="leeg" style="padding:16px">Geen meldingen met deze ernst.</p>')
        + '</div></div>'
      : '<div class="kaart" style="margin-top:14px"><div class="kaart-body">' + leeg('Geen open meldingen. Alles is rustig.') + '</div></div>')
    + sla;

  document.querySelectorAll('[data-ernst]').forEach((b) => b.addEventListener('click', () => {
    meldingFilter = b.dataset.ernst;
    laadMeldingen();
  }));
  document.querySelectorAll('[data-bevestig]').forEach((b) => b.addEventListener('click', () => bevestigMelding(Number(b.dataset.bevestig))));
  document.querySelectorAll('[data-terugzetten]').forEach((b) => b.addEventListener('click', () => bevestigMelding(Number(b.dataset.terugzetten), true)));
  document.querySelectorAll('[data-oplossen]').forEach((b) => b.addEventListener('click', () => oplossenMelding(Number(b.dataset.oplossen))));
  const plan = $('#ond-plannen');
  if (plan) plan.addEventListener('click', toonOnderhoudForm);
}

async function bevestigMelding(id, terug = false) {
  try {
    if (terug) {
      await api('/api/problemen/' + id + '/terugzetten', { method: 'POST', lichaam: {} });
      toast('Bevestiging ingetrokken');
    } else {
      const notitie = prompt('Notitie (optioneel):', '') || '';
      await api('/api/problemen/' + id + '/bevestigen', { method: 'POST', lichaam: { notitie } });
      toast('Melding bevestigd');
    }
    laadMeldingen();
  } catch (e) { toast(e.message, true); }
}

async function oplossenMelding(id) {
  try {
    await api('/api/problemen/' + id + '/oplossen', { method: 'POST', lichaam: {} });
    toast('Melding opgelost');
    laadMeldingen();
  } catch (e) { toast(e.message, true); }
}

async function toonOnderhoudForm() {
  const m = $('#modal');
  let hosts = [];
  try { hosts = (await api('/api/hosts')).hosts || []; } catch { hosts = []; }
  const nuLokaal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const later = new Date(Date.now() + 3600e3 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const opties = '<option value="*">Alle hosts en sites</option>' + hosts.map((h) => '<option value="' + esc(h.ip) + '">' + esc((h.naam || '') + ' ' + h.ip) + '</option>').join('');
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">Onderhoud inplannen</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">Tijdens het venster gaat er geen melding naar Slack en worden hosts niet gescand. Bestaande meldingen blijven staan.</p>'
    + '<form id="ondform">'
    + '<label class="veld"><span>Voor</span><select name="ip">' + opties + '</select></label>'
    + '<label class="veld"><span>Van</span><input name="van" type="datetime-local" value="' + nuLokaal + '"></label>'
    + '<label class="veld"><span>Tot</span><input name="tot" type="datetime-local" value="' + later + '" required></label>'
    + '<label class="veld"><span>Reden</span><input name="reden" placeholder="bijv. firmware-update switch"></label>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button type="button" class="knop" id="ond-annuleer">Annuleren</button><button type="submit" class="knop primair">Inplannen</button></div></form>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#ond-annuleer').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#ondform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api('/api/onderhoud', { method: 'POST', lichaam: {
        ip: f.get('ip'), van: new Date(f.get('van')).toISOString(), tot: new Date(f.get('tot')).toISOString(), reden: f.get('reden'),
      } });
      sluit();
      toast('Onderhoud ingepland');
      laadMeldingen();
    } catch (err) { toast(err.message, true); }
  });
}

      + '<label class="veld"><span>Wat moet de agent uitzoeken?</span><textarea name="omschrijving" placeholder="Beschrijf het probleem, wat je al geprobeerd hebt en wat je verwacht."></textarea></label>'

      + '<button class="knop primair" type="submit">Ticket aanmaken</button></form></div></details>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Alle tickets</h2><div class="rechts"><span style="font-size:12px;color:var(--muted2)">' + ticketCache.length + ' totaal</span></div></div>'

      + (host.diensten && host.diensten.length ? '<ul>' + host.diensten.map((x) => '<li>poort ' + x.poort + ' — ' + esc(x.titel || x.server || x.fout || '') + ' (' + (x.code || '—') + ')</li>').join('') + '</ul>' : '')

      + '<div class="sub">' + (t.ip ? '<span class="mono">' + esc(t.ip) + '</span>' : '') + chip(t.status, t.status === 'open' ? 'amber' : t.status === 'opgelost' ? 'groen' : 'blauw')

function bevestig(titel, tekst, ja) {
  const m = $('#modal');
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:8px">' + esc(titel) + '</h3><p style="color:var(--muted);font-size:13.5px;margin:0 0 18px">' + esc(tekst) + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="knop" id="nee">Annuleren</button><button class="knop gevaar" id="ja">Verwijderen</button></div>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#nee').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#ja').addEventListener('click', async () => { try { await ja(); } catch (err) { toast(err.message, true); } sluit(); }, { once: true });
}

// ── IP-adressen ───────────────────────────────────────────────────────────────
let hostsCache = [];
let hostDetail = null;
let serverDetail = null;
let apparatenCache = [];
let apparaatDetail = null;
let netwerkLaatst = null;      // laatste netwerkscan in de UI
let netwerkBezig = false;

function hostStatus(st) {
  if (st === 'neer') return { klasse: 'neer', tekst: 'niet bereikbaar' };
  if (st === 'onderhoud') return { klasse: 'onderhoud', tekst: 'in onderhoud' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'nog niet gescand' };
  return { klasse: 'ok', tekst: 'bereikbaar' };
}
function poortChips(poorten, max = 12) {
  if (!poorten || !poorten.length) return '<span class="chip">geen open poorten</span>';
  const zichtbaar = poorten.slice(0, max);
  return '<div class="port-chips">' + zichtbaar.map((p) => '<span class="port"><b>' + p + '</b></span>').join('')
    + (poorten.length > max ? '<span class="port">+' + (poorten.length - max) + '</span>' : '') + '</div>';
}
function tlsChip(host) {
  if (host.tls_dagen === null || host.tls_dagen === undefined) return '';
  const d = Number(host.tls_dagen);
  if (d < 0) return chip('certificaat verlopen', 'rood');
  if (d < 14) return chip('certificaat ' + d + ' d', 'rood');
  if (d < 30) return chip('certificaat ' + d + ' d', 'amber');
  return chip('certificaat ' + d + ' d', 'groen');
}

async function laadHosts() {
  beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="leeg">IP-adressen laden…</p></div></div>';
  try {
    const d = await api('/api/hosts');
    hostsCache = d.hosts;
    zetTeller('tab-hosts', hostsCache.length);
    renderHosts(d);
  } catch (e) {
    beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>';
  }
}

function renderHosts(d) {
  const netwerkKaart = '<details class="uitklap" id="netwerkform"><summary>' + ico.netwerk
    + ' Netwerk scannen<span class="plus">+</span></summary>'

    + 'Per adres worden een paar veelgebruikte poorten geprobeerd; wat antwoordt komt in de lijst.</p>'
    + '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="knop primair" type="button" id="netwerk-scan">Netwerk scannen</button>'
    + '<span class="hint" style="margin:0">Duurt een paar seconden; niets wordt vanzelf toegevoegd.</span></div>'
    + '<div id="netwerkuitslag" style="margin-top:14px"><p class="leeg">Nog niet gescand.</p></div>'
    + '</div></details>';

  const nieuw = '<details class="uitklap" id="hostform"><summary>' + ico.plus + ' IP-adres toevoegen<span class="plus">+</span></summary>'

    + '<div class="form-rij twee">'
    + '<label class="veld"><span>IP-adres</span><input name="ip" placeholder="192.168.1.16" required autocomplete="off"></label>'
    + '<label class="veld"><span>Naam (optioneel)</span><input name="naam" placeholder="Proxmox-host" autocomplete="off"></label>'
    + '</div>'
    + '<div class="form-rij twee">'
    + '<label class="veld"><span>Notitie (optioneel)</span><input name="notitie" placeholder="Waar is dit voor?" autocomplete="off"></label>'
    + '<label class="veld"><span>Elke</span><select name="interval_s">'
    + [['60','1 minuut'],['300','5 minuten'],['600','10 minuten'],['1800','30 minuten'],['3600','1 uur'],['21600','6 uur']]
        .map(([w,t]) => '<option value="' + w + '"' + (w === '300' ? ' selected' : '') + '>' + t + '</option>').join('')
    + '</select></label>'
    + '</div>'
    + '<button class="knop primair" type="submit">Toevoegen en meteen scannen</button>'
    + '<p class="hint">Het dashboard haalt naam (reverse DNS), open poorten, diensten met titel, pingtijd en het TLS-certificaat op. Scannen duurt een paar seconden.</p>'
    + '</form></div></details>';

  const alerts = (d.alerts && d.alerts.length)
    ? '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Storingen</h2><div class="rechts"><button class="knop klein" data-ga="hosts">Naar IP-adressen</button></div></div>'
      + '<div class="kaart-body alerts">' + d.alerts.slice(0, 6).map((a) =>
        '<div class="alert ' + (a.soort === 'host neer' ? 'rood' : 'amber') + '"><div class="tekst"><b>' + esc(a.ip) + '</b> — ' + esc(a.bericht)
        + '</div><span class="tijd">' + geleden(a.op) + '</span></div>').join('') + '</div></div>'
    : '';

  const kaarten = (d.hosts && d.hosts.length) ? d.hosts.map((h) => {
    const st = hostStatus(h.status);
    const naam = h.naam || h.hostnaam || h.ip;
    const onder = [h.hostnaam && h.hostnaam !== naam ? h.hostnaam : '', h.laatste_scan ? 'gescand ' + geleden(h.laatste_scan) : 'nog niet gescand',
      h.ping_ms !== null && h.ping_ms !== undefined ? nlGetal(h.ping_ms) + ' ms' : ''].filter(Boolean).join(' · ');
    return '<div class="host ' + st.klasse + '" data-host="' + esc(h.ip) + '">'
      + '<div class="top"><span class="stip ' + st.klasse + (st.klasse === 'neer' ? ' puls' : '') + '"></span>'
      + '<span class="naam">' + esc(naam) + '</span><span class="ip">' + esc(h.ip) + '</span>'
      + '<span class="rechts">' + (h.tickets_open ? chip(h.tickets_open + ' ticket' + (h.tickets_open === 1 ? '' : 's'), 'amber') : '')

      + '<div class="onder">' + esc(onder) + '</div>'
      + poortChips(h.poorten)
      + '<div class="voet"><span>' + st.tekst + '</span>'
      + (h.uptime24 !== null && h.uptime24 !== undefined ? '<span>· ' + nlGetal(h.uptime24) + '% up (24 u)</span>' : '')
      + (h.sites && h.sites.length ? '<span>· ' + h.sites.length + ' site' + (h.sites.length === 1 ? '' : 's') + '</span>' : '')
      + '<span class="rechts" style="margin-left:auto">' + tlsChip(h) + '</span></div>'
      + '</div>';
  }).join('') : '<div class="kaart"><div class="kaart-body"><p class="leeg">Nog geen IP-adressen. Voeg er hierboven één toe; de eerste scan start meteen.</p></div></div>';

  beeld.innerHTML = nieuw + netwerkKaart + alerts

    + '<span class="meting-tijd">' + hostsCache.length + ' adressen</span></div></div><div class="kaart-body">'
    + '<div class="host-grid">' + kaarten + '</div></div></div>';
  koppelHosts();

function koppelHosts() {
  koppelNetwerk();
  const form = $('#hostnieuw');
  if (form) form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const knop = form.querySelector('button[type=submit]');
    const f = new FormData(form);
    knop.classList.add('bezig');
    knop.textContent = 'Scannen…';
    try {
      const d = await api('/api/hosts', { method: 'POST', lichaam: {
        ip: String(f.get('ip') || '').trim(), naam: f.get('naam') || '', notitie: f.get('notitie') || '',
        interval_s: Number(f.get('interval_s')) || 300,
      } });
      toast('Toegevoegd: ' + d.host.ip + ' · ' + (d.host.poorten.length ? d.host.poorten.length + ' open poorten' : 'geen open poorten'));
      hostDetail = d.host.ip;
      laadHostDetail(d.host.ip);
    } catch (err) {
      toast(err.message, true);
      knop.classList.remove('bezig');
      knop.textContent = 'Toevoegen en meteen scannen';
    }
  });
  beeld.querySelectorAll('[data-host]').forEach((el) => el.addEventListener('click', () => {
    hostDetail = el.dataset.host;
    laadHostDetail(hostDetail);
  }));
}

function koppelNetwerk() {
  const knop = $('#netwerk-scan');
  if (knop) knop.addEventListener('click', scanNetwerk);
}

async function scanNetwerk() {
  const knop = $('#netwerk-scan');
  const uit = $('#netwerkuitslag');
  if (!uit) return;
  if (knop) { knop.disabled = true; knop.textContent = 'Bezig met scannen…'; }
  uit.innerHTML = '<p class="leeg">Het netwerk wordt afgelopen; dit duurt een paar seconden.</p>';
  try {
    const d = await api('/api/netwerk/scan', { method: 'POST', lichaam: {} });
    netwerkLaatst = d;
    renderNetwerk(d);
  } catch (e) {
    uit.innerHTML = '<p class="fout-tekst">' + esc(e.message) + '</p>';
  } finally {
    if (knop) { knop.disabled = false; knop.textContent = 'Opnieuw scannen'; }
  }
}

function renderNetwerk(d) {
  const uit = $('#netwerkuitslag');
  if (!uit) return;
  const g = d.gevonden || [];
  const nieuw = g.filter((x) => !x.bestaat_al);
  const kop = '<div class="netwerk-kop">'
    + '<b style="font-size:13.5px">' + g.length + ' adressen op ' + esc(d.subnet.cidr) + '</b>'
    + chip(nieuw.length + ' nog niet in de lijst', nieuw.length ? 'amber' : 'groen')
    + '<span class="rechts" style="margin-left:auto;display:flex;gap:8px">'
    + (nieuw.length ? '<button class="knop primair klein" type="button" id="netwerk-alles">Alle ' + nieuw.length + ' toevoegen</button>' : '')
    + '</span></div>';
  const rijen = g.map((x) => {
    const poorten = (x.poorten && x.poorten.length)
      ? x.poorten.slice(0, 6).map((p) => '<span class="port"><b>' + p + '</b></span>').join('')
      : '<span class="chip">geen open poort</span>';
    return '<label class="netrij' + (x.bestaat_al ? ' zal' : '') + '" style="cursor:' + (x.bestaat_al ? 'default' : 'pointer') + '">'
      + (x.bestaat_al ? '<span style="width:16px;min-width:16px"></span>' : '<input type="checkbox" name="kip" value="' + esc(x.ip) + '" checked>')
      + '<span class="kip">' + esc(x.ip) + '</span>'
      + '<span class="knaam">' + esc(x.naam || x.hostnaam || (x.eigen ? 'deze monitor' : '—')) + '</span>'
      + '<span class="kpoorten">' + poorten + '</span>'
      + (x.bestaat_al ? chip('staat er al', 'groen') : '')
      + '</label>';
  }).join('');
  uit.innerHTML = kop + '<div>' + (rijen || '<p class="leeg">Niets gevonden.</p>') + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop klein" type="button" id="netwerk-aanvinken">Alles selecteren</button>'

// ── servers (hardware) ────────────────────────────────────────────────────────
let serversCache = [];

function serverStatus(st) {
  if (st === 'fout') return { klasse: 'neer', tekst: 'fout' };
  if (st === 'stil') return { klasse: 'wacht', tekst: 'stil' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'wacht op meting' };
  return { klasse: 'ok', tekst: 'online' };
}
function pctKlasse(p) {
  if (p === null || p === undefined) return '';
  return p >= 90 ? 'gevaar' : p >= 75 ? 'waarschuw' : '';
}
function meterRij(label, pct, extra = '') {
  const p = pct === null || pct === undefined ? null : Math.round(Number(pct));
  return '<div class="meter-rij"><span class="meter-label">' + esc(label) + '</span>'
    + '<div class="meter ' + pctKlasse(p) + '"><i style="width:' + (p === null ? 0 : p) + '%"></i></div>'
    + '<b>' + (p === null ? '—' : p + '%') + '</b>' + (extra ? '<span class="meter-extra">' + esc(extra) + '</span>' : '') + '</div>';
}
const gb = (n) => (n === null || n === undefined ? '—' : nlGetal(n) + ' GB');
const mb = (n) => (n === null || n === undefined ? '—' : nlGetal(n) + ' MB');
function uptimeTekst(s) {
  if (!s) return '—';
  const d = Math.floor(s / 86400), u = Math.floor((s % 86400) / 3600), m = Math.floor((s % 3600) / 60);
  if (d) return d + ' d ' + u + ' u';
  if (u) return u + ' u ' + m + ' m';
  return m + ' min';
}
function serverKaart(s) {
  const st = serverStatus(s.status);
  return '<a class="srv" data-server="' + s.id + '" href="#">'
    + '<div class="srv-top"><span class="srv-naam">' + esc(s.naam) + '</span>'
    + '<span class="chip ' + (st.klasse === 'ok' ? 'groen' : st.klasse === 'neer' ? 'rood' : 'amber') + '">' + st.tekst + '</span>'
    + (s.lokaal ? '<span class="chip">deze monitor</span>' : '') + '</div>'
    + '<div class="srv-host">' + esc(s.host || 'geen hostnaam') + '</div>'
    + '<div class="srv-meters">'
    + meterRij('CPU', s.cpu_pct, s.kernen ? s.kernen + ' kernen' : '')
    + meterRij('RAM', s.ram_pct, s.ram_totaal_mb ? mb(s.ram_totaal_mb) : '')
    + meterRij('Schijf', s.disk_pct, s.schijven ? s.schijven + ' schijven' : '')
    + meterRij('GPU', s.gpu_pct, s.gpus ? s.gpus + ' kaarten' : 'geen')
    + '</div>'
    + '<div class="srv-voet"><span>' + (s.temp_c !== null && s.temp_c !== undefined ? '🌡 ' + nlGetal(s.temp_c) + ' °C' : '') + '</span>'
    + '<span class="srv-tijd">' + (s.laatste ? 'gemeten ' + geleden(s.laatste) : 'nog niet gemeten') + '</span></div>'
    + '</a>';
}

async function laadServers() {

      + (serversCache.length ? '<div class="srv-grid">' + serversCache.map(serverKaart).join('') + '</div>'

        + '</tbody></table></div></div>' : '')
      + (gpus.length ? '<div class="kaart" style="margin-top:14px"><div class="kaart-kop"><h2>GPU</h2></div><div class="kaart-body" style="padding:0">'

        + '</tbody></table></div></div>' : '')

      + (spark.length ? '<div class="grafiek">' + spark.map((m) => {

        const k = pctKlasse(m.cpu_pct);

    document.querySelector('[data-terug]').addEventListener('click', () => { serverDetail = null; laadHuidig(); });

    if (ververs) ververs.addEventListener('click', async () => {
      try { await api('/api/servers/' + id + '/verversen', { method: 'POST' }); toast('Server bijgewerkt'); laadServerDetail(id); }
      catch (e) { toast(e.message, true); }
    });
    $('#srv-token').addEventListener('click', () => toonTokenModal(s, null));
    const weg = $('#srv-weg');
    if (weg) weg.addEventListener('click', () => {
      bevestig('Server verwijderen', 'Weet je zeker dat je ' + s.naam + ' en alle metingen wilt verwijderen? De agent op die machine stopt dan met posten.', async () => {
        await api('/api/servers/' + id, { method: 'DELETE' });
        toast('Server verwijderd');
        serverDetail = null;
        laadServers();
      });

  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

// ── apparaten (homelab: UniFi, TrueNAS, generiek HTTP) ───────────────────────
const SOORT_LABEL = { unifi: 'UniFi-controller', truenas: 'TrueNAS', proxmox: 'Proxmox VE', generiek: 'HTTP/JSON' };
const SOORT_HINT = { unifi: 'URL van de controller (poort 443 of 8443)', truenas: 'URL van TrueNAS, bijvoorbeeld http://192.168.1.41', proxmox: 'URL van de Proxmox-host met poort 8006, bijvoorbeeld https://192.168.1.10:8006. Gebruiker: root@pam!monitor, sleutel: het token-secret.', generiek: 'Elke URL die JSON teruggeeft' };

function apparaatStatus(st) {
  if (st === 'fout') return { klasse: 'neer', tekst: 'fout' };
  if (st === 'stil') return { klasse: 'wacht', tekst: 'stil' };
  if (st === 'onbekend') return { klasse: 'wacht', tekst: 'nog niet gemeten' };
  return { klasse: 'ok', tekst: 'ok' };
}

function apparaatSamenvatting(a) {
  const d = a.data || {};
  if (a.soort === 'unifi') {
    if (!d.apparaten) return 'geen gegevens';
    const uit = [d.apparaten + ' apparaten'];
    if (d.online !== undefined) uit.push(d.online + ' online');
    if (d.clients !== undefined) uit.push(d.clients + ' clients');
    return uit.join(' · ');
  }
  if (a.soort === 'proxmox') {
    if (!d.nodes) return 'geen gegevens';
    const uit = [];
    uit.push((d.nodes_online ?? 0) + ' node' + ((d.nodes_online ?? 0) === 1 ? '' : 's') + ' online');
    if (d.nodes_offline) uit.push(d.nodes_offline + ' offline');
    if (d.vms) uit.push(d.vms.aan + '/' + d.vms.totaal + ' VM\'s aan');
    if (d.lxc) uit.push(d.lxc.aan + '/' + d.lxc.totaal + ' containers aan');
    if (d.versie) uit.push('versie ' + d.versie);
    return uit.join(' · ');
  }
  if (a.soort === 'truenas') {
    const pools = Array.isArray(d.pools) ? d.pools : [];
    const uit = [];
    if (pools.length) uit.push(pools.length + ' pool' + (pools.length > 1 ? 's' : ''));
    if (d.schijven && d.schijven.aantal) uit.push(d.schijven.aantal + ' schijven');
    if (d.meldingen !== undefined) uit.push(d.meldingen + ' meldingen');
    if (d.versie) uit.push('versie ' + d.versie);
    return uit.join(' · ') || 'geen gegevens';
  }
  if (d.code) return 'HTTP ' + d.code + (d.ms !== undefined ? ' · ' + d.ms + ' ms' : '');
  return 'geen gegevens';
}

function apparaatKaart(a) {
  const st = apparaatStatus(a.status);
  return '<a class="srv" data-apparaat="' + a.id + '" href="#">'
    + '<div class="srv-top"><span class="srv-naam">' + esc(a.naam) + '</span>'
    + '<span class="chip ' + (st.klasse === 'ok' ? 'groen' : st.klasse === 'neer' ? 'rood' : 'amber') + '">' + st.tekst + '</span>'
    + '<span class="chip">' + esc(SOORT_LABEL[a.soort] || a.soort) + '</span></div>'
    + '<div class="srv-host">' + esc(a.url.replace(/^https?:\/\//, '')) + '</div>'
    + '<div class="srv-stat" style="font-size:13px;color:var(--muted)">' + esc(apparaatSamenvatting(a)) + '</div>'
    + (a.fout ? '<div class="fout-tekst" style="font-size:12px;margin-top:8px">' + esc(a.fout).slice(0, 110) + '</div>' : '')
    + '<div class="srv-voet"><span>' + (a.laatste ? 'gemeten ' + geleden(a.laatste) : 'nog niet gemeten') + '</span></div></a>';
}

async function laadApparaten() {
  try {
    const d = await api('/api/apparaten');
    apparatenCache = d.apparaten || [];
    const fout = apparatenCache.filter((a) => a.status === 'fout').length;
    zetTeller('tab-apparaten', apparatenCache.length, fout > 0);
    beeld.innerHTML =
      '<div class="kaarten-kop"><div><h2>Apparaten</h2><p class="hint">Kastjes en diensten met een eigen API: de UniFi-controller, TrueNAS en elke HTTP-URL die JSON teruggeeft. De monitor leest ze rechtstreeks, zonder agent op het apparaat.</p></div>'
      + '<button class="knop primair" id="apparaat-toevoegen">' + ico.plus + ' Apparaat toevoegen</button></div>'
      + (fout ? '<p class="fout-tekst" style="margin-bottom:12px">' + fout + ' appara' + (fout === 1 ? 'at geeft' : 'ten geven') + ' een fout.</p>' : '')
      + (apparatenCache.length ? '<div class="srv-grid">' + apparatenCache.map(apparaatKaart).join('') + '</div>'
        : '<div class="kaart"><div class="kaart-body">' + leeg('Nog geen apparaten. Voeg je UniFi-controller, TrueNAS of Proxmox-host toe.') + '</div></div>');
    $('#apparaat-toevoegen').addEventListener('click', () => toonApparaatForm());
    document.querySelectorAll('[data-apparaat]').forEach((b) => b.addEventListener('click', () => {
      apparaatDetail = Number(b.dataset.apparaat);
      laadHuidig();
    }));
  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

function apparaatDetails(a) {
  const d = a.data || {};
  const rijen = [];
  const voeg = (k, v) => { if (v !== undefined && v !== null && v !== '') rijen.push('<tr><th>' + esc(k) + '</th><td>' + v + '</td></tr>'); };
  if (a.soort === 'unifi') {
    voeg('Site', esc(d.site || '—'));
    voeg('Versie', esc(d.versie || '—'));
    voeg('Apparaten', (d.apparaten ?? '—') + (d.online !== undefined ? ' · ' + d.online + ' online' : ''));
    const soorten = d.soorten || {};
    voeg('Soorten', Object.keys(soorten).map((k) => esc(k + ': ' + soorten[k])).join(' · ') || '—');
    voeg('Clients', d.clients ?? '—');
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    if (d.wan) voeg('WAN', esc([d.wan.status, d.wan.ip, d.wan.isp].filter(Boolean).join(' · ')) || '—');
    if (d.lan) voeg('LAN', esc([d.lan.status, d.lan.gebruikers !== null ? d.lan.gebruikers + ' gebruikers' : ''].filter(Boolean).join(' · ')) || '—');
    if (d.www) voeg('Controller', esc([d.www.status, d.www.latentie_ms !== null ? d.www.latentie_ms + ' ms' : ''].filter(Boolean).join(' · ')) || '—');
    const st = Array.isArray(d.storingen) ? d.storingen : [];
    voeg('Storingen', st.length ? st.map((x) => esc((x.onderdeel || '?') + ': ' + (x.status || '?'))).join(' · ') : 'geen');
  } else if (a.soort === 'proxmox') {
    voeg('Versie', esc([d.versie, d.release].filter(Boolean).join(' · ') || '—'));
    voeg('Nodes', (d.nodes_online ?? 0) + ' online' + (d.nodes_offline ? ' · <span class="chip rood">' + d.nodes_offline + ' offline</span>' : ''));
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    if (d.vms) voeg('Virtuele machines', d.vms.aan + ' aan · ' + d.vms.uit + ' uit · ' + d.vms.totaal + ' totaal');
    if (d.lxc) voeg('Containers', d.lxc.aan + ' aan · ' + d.lxc.uit + ' uit · ' + d.lxc.totaal + ' totaal');
    const st = Array.isArray(d.gestopt) ? d.gestopt : [];
    voeg('Gestopt', st.length ? st.map((x) => esc((x.naam || '?') + ' (' + x.soort + ', ' + x.node + ')')).join(' · ') : 'niets');
    voeg('Opslag', (Array.isArray(d.opslag) && d.opslag.length) ? (d.volle_opslag ? '<span class="chip rood">' + d.volle_opslag + ' bijna vol</span>' : 'gezond') : '—');
  } else if (a.soort === 'truenas') {
    voeg('Hostnaam', esc(d.hostnaam || '—'));
    voeg('Versie', esc(d.versie || '—'));
    voeg('Product', esc(d.product || '—'));
    voeg('Uptime', d.uptime_s !== null && d.uptime_s !== undefined ? uptimeTekst(d.uptime_s) : '—');
    voeg('Geheugen', d.geheugen_gb ? gb(d.geheugen_gb * 1e9) : '—');
    voeg('Cores', d.cores ?? '—');
    if (d.schijven) voeg('Schijven', (d.schijven.aantal ?? 0) + ' · waarvan ' + (d.schijven.ssd ?? 0) + ' SSD');
    voeg('Meldingen', (d.meldingen ?? 0) + (d.kritiek ? ' · <span class="chip rood">' + d.kritiek + ' kritiek</span>' : ''));
  } else {
    voeg('HTTP-code', d.code ?? '—');
    voeg('Responstijd', d.ms !== undefined ? d.ms + ' ms' : '—');
    const w = d.waarden || {};
    const sleutels = Object.keys(w).slice(0, 12);
    if (sleutels.length) voeg('Waarden', sleutels.map((k) => esc(k + ': ' + w[k])).join('<br>'));
  }
  return rijen.length ? '<table class="srv-tabel"><tbody>' + rijen.join('') + '</tbody></table>' : '<p class="leeg">Nog geen gegevens.</p>';
}

        + data.nodes.map((n) => '<tr><td><b>' + esc(n.naam) + '</b></td><td><span class="chip ' + (n.status === 'online' ? 'groen' : 'rood') + '">' + esc(n.status) + '</span></td><td>' + nlGetal(n.cpu_pct) + '%</td><td>' + nlGetal(n.ram_pct) + '%' + (n.ram_totaal_gb ? ' <span class="mono">(' + n.ram_gb + '/' + n.ram_totaal_gb + ' GB)</span>' : '') + '</td><td>' + nlGetal(n.disk_pct) + '%</td><td>' + (n.load ?? '—') + '</td><td>' + (n.uptime_s !== null && n.uptime_s !== undefined ? uptimeTekst(n.uptime_s) : '—') + '</td></tr>').join('')
        + '</tbody></table></div></div>' : '')
      + (Array.isArray(data.opslag) && data.opslag.length ? '<div class="kaart" style="margin-top:14px"><div class="kaart-kop"><h2>Opslag</h2><span class="chip">' + data.opslag.length + '</span></div><div class="kaart-body" style="padding:0">'

        + '<table class="srv-tabel"><thead><tr><th>Pool</th><th>Status</th><th>Gebruikt</th><th>Vrij</th><th>Totaal</th><th>%</th></tr></thead><tbody>'

      + (metingen.length ? '<div class="alerts">' + metingen.slice(-12).reverse().map((m) => '<div class="alert ' + (m.status === 'ok' ? '' : 'rood') + '"><div class="tekst">' + esc(datum(m.op)) + ' — ' + esc(m.status) + '</div></div>').join('') + '</div>' : leeg('Nog geen metingen.'))

function toonApparaatForm(apparaat = null) {
  const m = $('#modal');
  const a = apparaat || {};
  const soort = a.soort || 'unifi';
  const opties = Object.keys(SOORT_LABEL).map((k) => '<option value="' + k + '"' + (k === soort ? ' selected' : '') + '>' + esc(SOORT_LABEL[k]) + '</option>').join('');
