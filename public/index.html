<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Werdens Monitor</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="mask-icon" href="/favicon.svg" color="#1d4ed8">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="version" content="1.9.0">
<style>
:root{
  --bg:#070b10; --pane:#0e151d; --pane2:#111b25; --pane3:#16222e;
  --line:#1c2a37; --line2:#273848;
  --txt:#e8f0f8; --muted:#8aa0b6; --muted2:#63809a;
  --accent:#2ee6a8; --accent-d:#0f8f68; --accent-soft:rgba(46,230,168,.12);
  --amber:#f5b544; --amber-soft:rgba(245,181,68,.13);
  --red:#ff5f6f; --red-soft:rgba(255,95,111,.13);
  --blue:#63a9ff; --blue-soft:rgba(99,169,255,.12);
  --paars:#b18cff;
  --r:14px; --r-klein:9px; --hoogte:40px; --hoogte-klein:32px;
  --schaduw:0 1px 0 rgba(255,255,255,.03), 0 18px 40px -24px rgba(0,0,0,.9);
  --font:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 520px at 82% -10%, rgba(46,230,168,.09), transparent 62%),
    radial-gradient(800px 380px at 4% 0%, rgba(99,169,255,.07), transparent 58%),
    var(--bg);
  color:var(--txt); font-family:var(--font); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased; min-height:100vh;
}
body.uit{display:grid;place-items:center}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt)}
button{cursor:pointer}
::selection{background:rgba(46,230,168,.28)}

/* ── login ── */
#login{width:100%;max-width:392px;padding:24px}
#login .merk{margin-bottom:22px}
#login .kaart{padding:26px 24px}
#login h1{font-size:20px;margin:0 0 4px}
#login p.uitleg{color:var(--muted);margin:0 0 20px;font-size:14px}
#login label{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);margin-bottom:7px;font-weight:600}
#login input{width:100%;height:var(--hoogte)}
#login .knop{width:100%;justify-content:center;margin-top:16px;height:44px}
#login .fout{color:var(--red);font-size:13px;min-height:18px;margin-top:10px}
#login .fout.ok{color:var(--ok)}
#login .hulp{text-align:center;margin:14px 0 0;font-size:13px;color:var(--muted)}
#login .koppeling{background:none;border:0;padding:0;color:var(--accent);font:inherit;font-size:13px;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
#login .koppeling:hover{color:var(--accent-d)}
#login .herstel-uitleg{margin:0 0 14px;color:var(--muted);font-size:13.5px;line-height:1.55}
#login .stap2{margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
#login .stap2 .knop{margin-top:12px}
#login .stap2 label{margin-top:12px}
#login .stap2 .fout{margin-top:8px}
.login-voet{color:var(--muted2);font-size:12px;margin-top:16px;text-align:center}

/* ── shell ── */
#app{display:none;max-width:1180px;margin:0 auto;padding:0 18px 64px}
#app.aan{display:block}
header.kop{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;
  padding:16px 0 14px;background:linear-gradient(to bottom,var(--bg) 62%,rgba(7,11,16,.72) 100%);
  backdrop-filter:blur(6px);
}
.merk{display:flex;align-items:center;gap:11px;min-width:0}
.merk .logo{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;
  background:linear-gradient(150deg,#123c30,#0e151d 70%);border:1px solid #1d4b3c;box-shadow:inset 0 1px 0 rgba(46,230,168,.25)}
.merk .logo svg{width:20px;height:20px}
.merk .naam{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.merk .sub{font-size:11.5px;color:var(--muted2);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
header.kop .rechts{margin-left:auto;display:flex;align-items:center;gap:8px;flex:none}
.meting-tijd{font-size:12px;color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap}

nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);padding-bottom:0;margin-bottom:20px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--muted);
  padding:11px 14px 13px;font-size:14px;font-weight:600;border-bottom:2px solid transparent;white-space:nowrap;
}
nav.tabs button svg{width:17px;height:17px;flex:none}
nav.tabs button:hover{color:var(--txt)}
nav.tabs button.actief{color:var(--accent);border-bottom-color:var(--accent);background:linear-gradient(to top,rgba(46,230,168,.08),transparent)}
nav.tabs .teller{font-size:11px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--pane3);color:var(--muted);border:1px solid var(--line2)}
nav.tabs .teller.alarm{background:var(--red-soft);color:var(--red);border-color:rgba(255,95,111,.3)}

/* ── cards & typography ── */
.kaart{background:linear-gradient(180deg,rgba(255,255,255,.018),transparent 40%),var(--pane);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--schaduw)}
.kaart + .kaart{margin-top:14px}
.kaart-kop{display:flex;align-items:center;gap:10px;padding:15px 18px 12px;border-bottom:1px solid var(--line)}
.kaart-kop h2{font-size:12px;margin:0;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
.kaart-kop .rechts{margin-left:auto;display:flex;gap:8px;align-items:center}
.kaart-body{padding:16px 18px}
h3{font-size:15px;margin:0}
p.leeg{color:var(--muted2);font-size:13.5px;margin:0}
.raster{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.raster>*{min-width:0}
@media(min-width:820px){.raster.twee{grid-template-columns:1.35fr 1fr}.raster.drie{grid-template-columns:repeat(3,1fr)}}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:760px){.kpis{grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}}
.kpi{background:var(--pane);border:1px solid var(--line);border-radius:var(--r);padding:14px 15px;position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--line2)}
.kpi.goed:before{background:var(--accent)}.kpi.waarschuwing:before{background:var(--amber)}.kpi.fout:before{background:var(--red)}.kpi.info:before{background:var(--blue)}
.kpi .label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);font-weight:700;display:flex;gap:6px;align-items:center}
.kpi .waarde{font-size:27px;font-weight:700;line-height:1.15;margin-top:5px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .klein{font-size:12px;color:var(--muted);margin-top:2px}

/* ── status ── */
.stip{width:8px;height:8px;border-radius:50%;flex:none;display:inline-block;background:var(--muted2);box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.stip.ok{background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.stip.neer{background:var(--red);box-shadow:0 0 0 3px var(--red-soft)}
.stip.wacht{background:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.stip.puls{animation:puls 2.4s ease-in-out infinite}
@keyframes puls{0%,100%{opacity:1}50%{opacity:.45}}

.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:20px;
  background:var(--pane3);color:var(--muted);border:1px solid var(--line2);white-space:nowrap}
.chip.groen{background:var(--accent-soft);color:var(--accent);border-color:rgba(46,230,168,.28)}
.chip.rood{background:var(--red-soft);color:var(--red);border-color:rgba(255,95,111,.3)}
.chip.amber{background:var(--amber-soft);color:var(--amber);border-color:rgba(245,181,68,.3)}
.chip.blauw{background:var(--blue-soft);color:var(--blue);border-color:rgba(99,169,255,.3)}
.chip.mono{font-family:var(--mono);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle}
.chip.groot{font-size:13px;padding:3px 10px}

/* ── lijsten ── */
.rijen{display:flex;flex-direction:column}
.rij{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line);color:inherit}
.rij:first-child{border-top:0}
.rij:hover{background:rgba(255,255,255,.022);text-decoration:none}
.rij .groot{flex:1;min-width:0}
.rij .naam{font-weight:600;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.rij .naam .tekst{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rij .onder{font-size:12.5px;color:var(--muted2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rij .rechts{display:flex;align-items:center;gap:10px;flex:none;min-width:0;max-width:100%;font-variant-numeric:tabular-nums}

/* ── sparkline ── */
.spark{display:flex;gap:2px;align-items:flex-end;height:22px;flex:none}
.spark i{width:3px;border-radius:1px;background:var(--accent);opacity:.85;display:block}
.spark i.neer{background:var(--red);height:22px!important;opacity:1}
.spark i.leeg{background:var(--line2);height:6px!important}

/* ── knoppen ── */
.knop{display:inline-flex;align-items:center;gap:7px;height:var(--hoogte);padding:0 14px;border-radius:10px;
  border:1px solid var(--line2);background:var(--pane2);color:var(--txt);font-weight:600;font-size:13.5px;
  white-space:nowrap;flex:none;transition:background .12s,border-color .12s,transform .06s}
.knop:hover{background:var(--pane3);border-color:#39506a;text-decoration:none}
.knop:active{transform:translateY(1px)}
.knop svg{width:15px;height:15px}
.knop.primair{background:linear-gradient(180deg,#25c895,#14a578);border-color:#2ee6a8;color:#04211a;font-weight:700}
.knop.primair:hover{background:linear-gradient(180deg,#2ee6a8,#17b183)}
.knop.stil{background:transparent;border-color:transparent;color:var(--muted)}
.knop.stil:hover{background:var(--pane2);color:var(--txt)}
.knop.gevaar{color:var(--red);border-color:rgba(255,95,111,.35);background:var(--red-soft)}
.knop.klein{height:var(--hoogte-klein);font-size:12.5px;padding:0 10px;border-radius:8px}
.knop[disabled]{opacity:.5;cursor:not-allowed}
.knop.bezig{opacity:.75;pointer-events:none}

/* ── formulieren ── */
label.veld{display:block;margin-bottom:12px}
label.veld span{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted2);font-weight:700;margin-bottom:6px}
input,select,textarea{width:100%;background:var(--pane2);border:1px solid var(--line2);border-radius:9px;padding:0 12px;height:var(--hoogte);outline:none}
textarea{height:auto;min-height:96px;padding:10px 12px;resize:vertical;line-height:1.5;flex:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238aa0b6' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}
.form-rij{display:grid;gap:12px}
@media(min-width:700px){.form-rij.twee{grid-template-columns:1fr 1fr}.form-rij.drie{grid-template-columns:1fr 1fr 1fr}}
.hint{font-size:12px;color:var(--muted2);margin:6px 0 0}
.fout-tekst{color:var(--red);font-size:13px;margin-top:8px}

/* ── details/uitklap ── */
details.uitklap{border:1px solid var(--line);border-radius:var(--r);background:var(--pane);margin-bottom:16px}
details.uitklap>summary{list-style:none;cursor:pointer;padding:13px 16px;display:flex;align-items:center;gap:9px;font-weight:600;font-size:13.5px;color:var(--muted)}
details.uitklap>summary svg{width:17px;height:17px;flex:none}
details.uitklap>summary::-webkit-details-marker{display:none}
details.uitklap>summary:hover{color:var(--txt)}
details.uitklap>summary .plus{margin-left:auto;color:var(--muted2);font-size:18px;line-height:1}
details.uitklap[open]>summary{border-bottom:1px solid var(--line);color:var(--txt)}
details.uitklap .binnen{padding:16px}
/* Netwerkrijen: eigen opmaak, want de globale input-regel zet elk veld op 100% breed. */
.netrij{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.netrij input[type=checkbox]{width:16px;height:16px;min-width:16px;flex:none;padding:0;margin:0;accent-color:var(--accent);cursor:pointer}
.netrij .kip{font-family:var(--mono);font-size:12.5px;min-width:112px}
.netrij .knaam{flex:0 1 340px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.netrij .kpoorten{display:flex;gap:4px;flex-wrap:wrap;flex:1;justify-content:flex-end}
@media (max-width:700px){
  .netrij{flex-wrap:wrap;row-gap:6px}
  .netrij .knaam{flex:1 1 auto}
  .netrij .kpoorten{flex:1 1 100%;justify-content:flex-start}
}
.netrij.zal{opacity:.72}
.netwerk-kop{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}

/* ── projecten ── */
.project-grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:700px){.project-grid{grid-template-columns:1fr 1fr}}
.proj{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.proj .top{display:flex;align-items:center;gap:8px;min-width:0}
.proj .top .naam{font-weight:650;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.proj .top .rechts{margin-left:auto;display:flex;gap:6px;flex:none}
.proj .beschr{font-size:12.5px;color:var(--muted);margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:0}
.proj .voet{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted2);border-top:1px solid var(--line);padding-top:9px;margin-top:2px}
.proj .voet .sha{font-family:var(--mono);font-size:11px;color:var(--muted)}
.proj .voet .spacer{margin-left:auto}
.zoek{display:flex;gap:8px;margin-bottom:14px;align-items:center}
.zoek input{flex:1}
@media(min-width:760px){.zoek input{max-width:340px}}

/* ── tickets ── */
.ticket-rij{display:flex;gap:12px;padding:13px 16px;border-top:1px solid var(--line);align-items:flex-start;cursor:pointer}
.ticket-rij:first-child{border-top:0}
.ticket-rij:hover{background:rgba(255,255,255,.022)}
.ticket-rij .prio{width:3px;align-self:stretch;border-radius:2px;background:var(--muted2);flex:none}
.ticket-rij .prio.kritiek{background:var(--red)}.ticket-rij .prio.hoog{background:var(--amber)}.ticket-rij .prio.normaal{background:var(--blue)}.ticket-rij .prio.laag{background:var(--line2)}
.ticket-rij .midden{flex:1;min-width:0}
.ticket-rij .titel{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ticket-rij .meta{font-size:12px;color:var(--muted2);display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:2px}
.ticket-rij .meta .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.ticket-rij .rechts{align-self:center;flex:none;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
/* subnavigatie binnen een tab (Tickets / Rapportage / Kennisbank) */
.seg{display:flex;gap:3px;background:var(--pane3);border:1px solid var(--line);border-radius:12px;
  padding:4px;margin-bottom:16px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-width:0;white-space:nowrap;background:transparent;border:0;color:var(--muted);
  font-family:inherit;font-weight:600;font-size:13px;padding:9px 12px;border-radius:9px;min-height:38px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.seg button:hover{color:var(--txt)}
.seg button.actief{background:var(--pane);color:var(--accent);box-shadow:var(--schaduw)}
.seg .tel{font-size:11px;font-weight:700;background:var(--pane3);border:1px solid var(--line);
  border-radius:20px;padding:0 6px;color:var(--muted);font-variant-numeric:tabular-nums}
.seg button.actief .tel{background:var(--accent-soft);border-color:transparent;color:var(--accent-d)}
/* SLA-klok: vier blokjes met de resterende tijd en de status */
.sla{display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(min-width:720px){.sla{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sla-klok{background:var(--pane2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.sla-klok .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--muted2)}
.sla-klok .v{font-size:16px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sla-klok .n{font-size:11px;color:var(--muted2);margin-top:1px}
.sla-klok.op-tijd .v{color:var(--ok)}
.sla-klok.bijna .v{color:var(--amber)}
.sla-klok.overschreden .v{color:var(--red)}
.sla-klok.gehaald .v{color:var(--ok)}
.sla-balk{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:8px}
.sla-balk i{display:block;height:100%;border-radius:4px;background:var(--accent)}
.sla-balk.bijna i{background:var(--amber)}
.sla-balk.overschreden i{background:var(--red)}
/* kennisbank */
.kb-kaart{border-top:1px solid var(--line);padding:14px 16px}
.kb-kaart:first-child{border-top:0}
.kb-kop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.kb-kop b{font-size:13.5px}
.kb-tekst{font-size:12.5px;color:var(--muted);white-space:pre-wrap;line-height:1.45}
.kb-gebruik{margin-top:9px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.prio-uitkomst{font-size:12.5px;color:var(--muted);margin-top:-4px;margin-bottom:12px}
.prio-uitkomst b{color:var(--txt)}
.ticket-kop{display:flex;flex-direction:column;gap:10px;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ticket-kop h2{font-size:19px;margin:0;letter-spacing:-.01em}
.ticket-kop .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted2)}
.berichten{display:flex;flex-direction:column;gap:10px;margin:4px 0 16px}
.bericht{border:1px solid var(--line);border-radius:11px;padding:11px 13px;background:var(--pane2);max-width:min(680px,94%)}
.bericht.agent{border-color:rgba(99,169,255,.28);background:var(--blue-soft);margin-left:auto}
.bericht .kop{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted2);margin-bottom:5px}
.bericht .kop b{color:var(--txt);font-size:12px}
.bericht .tekst{white-space:pre-wrap;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.context-blok{background:var(--pane2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:12.5px}
.context-blok h4{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2)}
.context-blok ul{margin:0;padding-left:16px;color:var(--muted)}
.context-blok li{margin:3px 0}
.poorten{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}

/* ── toast ── */
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);z-index:60;background:#0d241d;border:1px solid rgba(46,230,168,.4);
  color:var(--accent);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.2s;max-width:88vw;text-align:center}
#toast.aan{opacity:1;transform:translate(-50%,0)}

.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}

.stat .k{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);font-weight:700}
.stat .v{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:1px}

  nav.tabs button svg{width:19px;height:19px}

  .rij{padding:11px 14px;flex-wrap:wrap;row-gap:3px}

/* ══════════════════════════════════════════════════════════════════════════
   Huisstijl Werdens Media — licht, blauw en cyaan uit het logo.
   Eén override-laag: hieronder gelden de merkkleuren, kaarten, knoppen,

:root{

  --ok:#059669; --ok-soft:#e6f6ef;

}
body{

body.uit{background:radial-gradient(900px 520px at 20% 0%,rgba(95,240,232,.16),transparent 55%),

.rij,.ticket-rij{border-color:var(--line)}

.knop{background:var(--pane);border:1px solid var(--line2);color:var(--txt)}

  box-shadow:0 10px 20px -14px rgba(74,76,248,.95)}

input,select,textarea{background-color:var(--pane);border:1px solid var(--line2);color:var(--txt)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238296ae' stroke-width='2'><path d='M3 5l4 4 4-4'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;padding-right:32px}

details.uitklap{background:var(--pane);border-color:var(--line)}
details.uitklap[open]>summary{border-color:var(--line)}

<script>
'use strict';
// ── helpers ──────────────────────────────────────────────────────────────────
const $ = (s, el = document) => el.querySelector(s);
const beeld = $('#beeld');
const nlGetal = (w) => Number.isFinite(Number(w)) ? String(Number(w)).replace('.', ',') : String(w ?? '');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// "2.4.0" wordt "v2.4.0"; "commit abc123" blijft zoals het is.
const versieLabel = (v) => { const t = String(v || '').trim(); if (!t) return ''; return /^\d/.test(t) ? 'v' + t : t; };

function datum(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return '—';
  return d.toLocaleString('nl-NL', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function geleden(iso) {
  if (!iso) return 'nooit';
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (!Number.isFinite(s)) return '—';
  if (s < 45) return 'net nu';
  if (s < 3600) return Math.round(s / 60) + ' min geleden';
  if (s < 86400) return Math.round(s / 3600) + ' uur geleden';
  return Math.round(s / 86400) + ' dagen geleden';
}
function toast(tekst, isFout = false) {
  const t = $('#toast');
  t.textContent = tekst;
  t.className = 'aan' + (isFout ? ' fout' : '');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.className = isFout ? 'fout' : ''; }, 3200);
}
async function api(pad, opties = {}) {
  const o = { headers: { 'content-type': 'application/json' }, ...opties };
  if (o.lichaam !== undefined) { o.body = JSON.stringify(o.lichaam); delete o.lichaam; }
  const res = await fetch(pad, o);
  if (res.status === 401 && pad !== '/api/login') { toonLogin(); throw new Error('Niet ingelogd'); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.fout || ('Fout ' + res.status));
  return data;
}
const ico = {
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  extern: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M14 4h6v6M20 4l-9 9M18 14v4a2 2 0 01-2 2H6a2 2 0 01-2-2V8a2 2 0 012-2h4"/></svg>',
  terug: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>',
  span: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 12a8 8 0 11-2.3-5.6M20 4v5h-5"/></svg>',
  fles: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M9 3h6v3l2 3v11a1 1 0 01-1 1H8a1 1 0 01-1-1V9l2-3z"/></svg>',
  netwerk: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="5" r="2.2"/><circle cx="5" cy="18" r="2.2"/><circle cx="19" cy="18" r="2.2"/><path d="M12 7.2v4.3M12 11.5l-5.5 4.6M12 11.5l5.5 4.6"/></svg>',
  zoek: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>',
};
function leeg(tekst) { return '<p class="leeg" style="padding:18px">' + esc(tekst) + '</p>'; }
function chip(tekst, kleur = '') { return '<span class="chip ' + kleur + '">' + esc(tekst) + '</span>'; }

function spark(historie) {
  if (!historie || !historie.length) return '<div class="spark"><i class="leeg"></i></div>';
  const laatste = historie.slice(-26);
  return '<div class="spark" title="Laatste metingen">' + laatste.map((c) => {
    const h = c.ok ? Math.max(5, Math.min(22, Math.round(22 - Math.min(2000, c.ms || 100) / 130))) : 22;
    return '<i class="' + (c.ok ? '' : 'neer') + '" style="height:' + h + 'px"></i>';
  }).join('') + '</div>';
}
function statusVan(site) {
  if (!site.actief) return { klasse: '', tekst: 'uit' };
  if (!site.laatste) return { klasse: 'wacht', tekst: 'wacht op meting' };
  return site.laatste.ok ? { klasse: 'ok', tekst: 'online' } : { klasse: 'neer', tekst: 'storing' };
}

// ── inloggen ─────────────────────────────────────────────────────────────────
function toonLogin() {
  $('#login').hidden = false;
  document.body.classList.add('uit');
  $('#app').classList.remove('aan');
  // Altijd met het gewone inlogformulier beginnen, niet met het herstelpaneel.
  const herstel = $('#ww-herstel');
  if (herstel) {
    herstel.hidden = true;
    const form = $('#ww-form'); if (form) form.hidden = true;
    const gewoon = $('#loginform'); if (gewoon) gewoon.hidden = false;
    const melding = $('#ww-fout'); if (melding) { melding.textContent = ''; melding.classList.remove('ok'); }
    const hulp = $('#ww-hulp'); if (hulp) hulp.hidden = false;
    const stuurKnop = $('#ww-stuur'); if (stuurKnop) stuurKnop.style.display = '';
  }
  setTimeout(() => { const w = $('#ww'); if (w) w.focus(); }, 60);
}
async function start() {
  try {
    const ik = await api('/api/ik');
    $('#login').hidden = true;
    document.body.classList.remove('uit');
    $('#app').classList.add('aan');
    laadOverzicht();
  } catch (e) { toonLogin(); }
}
$('#loginform').addEventListener('submit', async (e) => {
  e.preventDefault();
  const knop = e.target.querySelector('button');
  knop.classList.add('bezig');
  $('#login-fout').textContent = '';
  try {
    await api('/api/login', { method: 'POST', lichaam: { wachtwoord: $('#ww').value } });
    $('#ww').value = '';
    start();
  } catch (err) {
    $('#login-fout').textContent = err.message;
  } finally { knop.classList.remove('bezig'); }
});
// ── wachtwoord vergeten: code via Slack ─────────────────────────────────────
const wwHerstel = $('#ww-herstel');
const wwForm = $('#ww-form');
const wwFout = $('#ww-fout');
const wwMeld = (tekst, ok = false) => {
  wwFout.textContent = tekst || '';
  wwFout.classList.toggle('ok', Boolean(ok));
};
$('#ww-vergeten').addEventListener('click', async () => {
  $('#loginform').hidden = true;
  $('#ww-hulp').hidden = true;
  wwHerstel.hidden = false;
  $('#ww-stuur').style.display = '';
  wwMeld('');
  $('#ww-fout').classList.remove('ok');
  try {
    const kan = await api('/api/wachtwoord/kan');
    if (!kan.via_slack) {
      wwMeld('Er is nog geen Slack-webhook ingesteld, dus we kunnen geen code sturen. Zet die aan bij Instellingen → Slack-meldingen, of gebruik deploy/reset-wachtwoord.sh op de server.');
    }
  } catch (e) { wwMeld('Kon de status niet ophalen. Probeer het opnieuw.'); }
});
$('#ww-terug').addEventListener('click', () => {
  wwHerstel.hidden = true;
  wwForm.hidden = true;
  $('#loginform').hidden = false;
  $('#ww-hulp').hidden = false;
  wwMeld('');
  setTimeout(() => { const w = $('#ww'); if (w) w.focus(); }, 40);
});
$('#ww-stuur').addEventListener('click', async (e) => {
  const knop = e.currentTarget;
  if (knop.classList.contains('bezig')) return;
  knop.classList.add('bezig');
  wwMeld('');
  try {
    const r = await api('/api/wachtwoord/vergeten', { method: 'POST', lichaam: {} });
    wwForm.hidden = false;
    knop.style.display = 'none';
    wwMeld('Code verstuurd naar Slack. Hij is ' + (r.geldig_minuten || 10) + ' minuten geldig.', true);
    const c = $('#ww-code'); if (c) c.focus();
  } catch (err) {
    wwMeld(err.message);
  } finally { knop.classList.remove('bezig'); }
});
wwForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const code = $('#ww-code').value.replace(/\s/g, '');
  const nieuw = $('#ww-nieuw').value;
  const nog = $('#ww-nieuw2').value;
  if (!/^\d{6}$/.test(code)) { wwMeld('Vul de zes cijfers uit het Slack-bericht in.'); $('#ww-code').focus(); return; }
  if (nieuw.length < 8) { wwMeld('Kies een wachtwoord van minstens 8 tekens.'); $('#ww-nieuw').focus(); return; }
  if (nieuw !== nog) { wwMeld('De twee wachtwoorden zijn niet gelijk.'); $('#ww-nieuw2').focus(); return; }
  const knop = e.target.querySelector('button[type="submit"]');
  knop.classList.add('bezig');
  wwMeld('');
  try {
    await api('/api/wachtwoord/herstellen', { method: 'POST', lichaam: { code, wachtwoord: nieuw } });
    $('#ww-code').value = ''; $('#ww-nieuw').value = ''; $('#ww-nieuw2').value = '';
    wwMeld('Wachtwoord ingesteld. Je wordt ingelogd…', true);
    setTimeout(() => { wwHerstel.hidden = true; wwForm.hidden = true; start(); }, 400);
  } catch (err) {
    wwMeld(err.message);
  } finally { knop.classList.remove('bezig'); }
});

$('#uitloggen').addEventListener('click', async () => { try { await api('/api/logout', { method: 'POST' }); } catch {} toonLogin(); });
$('#vernieuw').addEventListener('click', () => laadHuidig(true));

// ── navigatie ────────────────────────────────────────────────────────────────
let huidigeTab = 'overzicht';
let siteDetail = null;
let ticketDetail = null;
let ticketWeergave = 'tickets';   // 'tickets' | 'rapport' | 'kennisbank'
let ticketOpenAantal = 0;
let kennisCache = [];
let kbZoek = '';
const laders = {};

$('#tabs').addEventListener('click', (e) => {
  const knop = e.target.closest('button[data-tab]');
  if (!knop) return;
  huidigeTab = knop.dataset.tab;
  siteDetail = null;
  ticketDetail = null;
  hostDetail = null;
  serverDetail = null;
  apparaatDetail = null;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b === knop));
  laadHuidig();
});
function laadHuidig(metKracht = false) {
  if (huidigeTab === 'overzicht') laadOverzicht();
  else if (huidigeTab === 'projecten') laadProjecten(metKracht);
  else if (huidigeTab === 'websites') siteDetail ? laadSiteDetail(siteDetail) : laadSites();
  else if (huidigeTab === 'hosts') hostDetail ? laadHostDetail(hostDetail) : laadHosts();
  else if (huidigeTab === 'servers') serverDetail ? laadServerDetail(serverDetail) : laadServers();
  else if (huidigeTab === 'apparaten') apparaatDetail ? laadApparaatDetail(apparaatDetail) : laadApparaten();
  else if (huidigeTab === 'meldingen') laadMeldingen();
  else if (huidigeTab === 'grafieken') laadGrafieken();
  else if (huidigeTab === 'tickets') {
    if (ticketDetail) laadTicketDetail(ticketDetail);
    else if (ticketWeergave === 'rapport') laadRapport();
    else if (ticketWeergave === 'kennisbank') laadKennisbank();
    else laadTickets();
  }
  else laadInstellingen();
}
function zetTeller(id, aantal, alarm = false) {
  const el = $('#' + id);
  if (!el) return;
  el.textContent = aantal > 0 ? aantal : '';
  el.className = 'teller' + (alarm ? ' alarm' : '');
}

// ── overzicht ────────────────────────────────────────────────────────────────
async function laadOverzicht() {
  try {
    const d = await api('/api/overzicht');
    const s = d.samenvatting;
    zetTeller('tab-projecten', s.projecten);
    zetTeller('tab-sites', s.sites);
    zetTeller('tab-tickets', s.tickets_open, s.tickets_open > 0);
    zetTeller('tab-hosts', s.hosts, s.hosts_neer > 0);
    zetTeller('tab-servers', s.servers, s.servers_vol > 0);
    $('#meting-tijd').textContent = s.laatste_meting ? 'Laatste meting ' + geleden(s.laatste_meting) : '';
    const sitesHtml = d.sites.length ? d.sites.map((site) => {
      const st = statusVan(site);
      const l = site.laatste || {};
      return '<a class="rij" href="#" data-site="' + site.id + '">'
        + '<span class="stip ' + st.klasse + (st.klasse === 'neer' ? ' puls' : '') + '"></span>'
        + '<div class="groot"><div class="naam"><span class="tekst">' + esc(site.naam) + '</span>'
        + (st.klasse === 'neer' ? chip('storing', 'rood') : '')
        + '</div><div class="onder">' + esc(site.url.replace(/^https?:\/\//, '').replace(/\/$/, '')) + ' · ' + geleden(l.op) + '</div></div>'
        + spark(site.geschiedenis)
        + '<div class="rechts">'
        + (l.versie ? '<span class="chip mono">' + esc(versieLabel(l.versie)) + '</span>' : '')
        + (l.ms != null ? '<span style="font-size:12px;color:var(--muted2);min-width:46px;text-align:right">' + nlGetal(l.ms) + ' ms</span>' : '')
        + '</div></a>';
    }).join('') : leeg('Nog geen websites toegevoegd.');
    const ticketsHtml = d.tickets.length ? d.tickets.map((t) =>
      '<div class="ticket-rij" data-ticket="' + t.id + '"><span class="prio ' + esc(t.prioriteit) + '"></span>'
      + '<div class="midden"><div class="titel">' + esc(t.titel) + '</div>'
      + '<div class="meta">' + (t.ip ? '<span class="mono">' + esc(t.ip) + '</span>' : '') + chip(t.status, t.status === 'open' ? 'amber' : 'blauw') + '<span>' + geleden(t.aangemaakt) + '</span></div></div></div>').join('')
      : leeg('Geen openstaande tickets.');
    const hostRijen = d.hosts && d.hosts.length ? d.hosts.map((h) => {
      const st = hostStatus(h.status);
      const naam = h.naam || h.hostnaam || h.ip;
      return '<div class="rij" data-host="' + esc(h.ip) + '">'
        + '<span class="stip ' + st.klasse + (st.klasse === 'neer' ? ' puls' : '') + '"></span>'
        + '<div class="groot"><div class="naam"><span class="tekst">' + esc(naam) + '</span>'
        + (h.status === 'onderhoud' ? chip('onderhoud', 'blauw') : '') + '</div>'
        + '<div class="onder">' + esc(h.ip) + ' · ' + (h.laatste_scan ? geleden(h.laatste_scan) : 'nog niet gescand') + '</div></div>'
        + '<div class="rechts">' + chip(h.poorten.length + ' poort' + (h.poorten.length === 1 ? '' : 'en'), h.poorten.length ? 'groen' : 'rood') + '</div></div>';
    }).join('') : leeg('Nog geen IP-adressen toegevoegd.');
    const serverRijen = d.servers && d.servers.length ? d.servers.map((sv) => {
      const st = serverStatus(sv.status);
      return '<div class="rij" data-server="' + sv.id + '">'
        + '<span class="stip ' + st.klasse + (st.klasse === 'neer' ? ' puls' : '') + '"></span>'
        + '<div class="groot"><div class="naam"><span class="tekst">' + esc(sv.naam) + '</span>'
        + (sv.lokaal ? chip('deze monitor', 'blauw') : '') + '</div>'
        + '<div class="onder">' + esc(sv.host || '') + ' · CPU ' + (sv.cpu_pct ?? '—') + '% · RAM ' + (sv.ram_pct ?? '—') + '% · schijf ' + (sv.disk_pct ?? '—') + '%</div></div>'
        + '<div class="rechts">' + (sv.temp_c !== null && sv.temp_c !== undefined ? '<span class="chip">' + nlGetal(sv.temp_c) + ' °C</span>' : '') + '</div></div>';
    }).join('') : leeg('Nog geen servers gemeten.');
    const gebeurtenissen = d.gebeurtenissen && d.gebeurtenissen.length ? '<div class="alerts">' + d.gebeurtenissen.map((g) =>
      '<div class="alert"><div class="tekst"><b>' + esc(g.soort) + '</b>' + (g.ip ? ' · ' + esc(g.ip) : '') + ' — ' + esc(g.tekst)

      + '</div>'

      + '<div class="raster twee" style="margin-bottom:14px">'
      + '<div class="kaart"><div class="kaart-kop"><h2>IP-adressen</h2><div class="rechts"><button class="knop klein" data-ga="hosts">Beheren</button></div></div><div class="rijen">' + hostRijen + '</div></div>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Laatste gebeurtenissen</h2></div><div class="kaart-body">' + gebeurtenissen + '</div></div>'

}
function kpi(label, waarde, klein, kleur) {
  return '<div class="kpi ' + kleur + '"><div class="label">' + esc(label) + '</div><div class="waarde">' + esc(String(waarde)) + '</div><div class="klein">' + esc(klein) + '</div></div>';
}
function koppelOverzicht() {
  beeld.querySelectorAll('[data-site]').forEach((el) => el.addEventListener('click', (e) => {
    e.preventDefault();
    siteDetail = el.dataset.site;
    huidigeTab = 'websites';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === 'websites'));
    laadSiteDetail(siteDetail);
  }));
  beeld.querySelectorAll('[data-ticket]').forEach((el) => el.addEventListener('click', () => {
    ticketDetail = el.dataset.ticket;
    huidigeTab = 'tickets';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === 'tickets'));
    laadTicketDetail(ticketDetail);
  }));
  beeld.querySelectorAll('[data-host]').forEach((el) => el.addEventListener('click', () => {
    hostDetail = el.dataset.host;
    huidigeTab = 'hosts';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === 'hosts'));
    laadHostDetail(hostDetail);
  }));
  beeld.querySelectorAll('[data-server]').forEach((el) => el.addEventListener('click', (e) => {
    e.preventDefault();
    serverDetail = Number(el.dataset.server);
    huidigeTab = 'servers';
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === 'servers'));
    laadHuidig();
  }));
  beeld.querySelectorAll('[data-ga]').forEach((el) => el.addEventListener('click', () => {
    huidigeTab = el.dataset.ga;
    siteDetail = null; ticketDetail = null;
    document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('actief', b.dataset.tab === huidigeTab));
    laadHuidig();
  }));
}

// ── projecten ────────────────────────────────────────────────────────────────
let projectenCache = [];
let projectFilter = 'alle';
let projectZoek = '';
async function laadProjecten(metKracht = false) {
  beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="leeg">Projecten ophalen…</p></div></div>';
  try {
    const d = metKracht
      ? await api('/api/projecten/verversen', { method: 'POST' })
      : await api('/api/projecten');
    projectenCache = d.projecten;
    zetTeller('tab-projecten', projectenCache.length);
    renderProjecten(d);
  } catch (e) {
    beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p>'
      + '<p class="hint">Zet een GitHub-token in de omgeving (GITHUB_TOKEN) of log in met gh op de server.</p></div></div>';
  }
}
function renderProjecten(d) {
  const filters = ['alle', 'publiek', 'privé', 'CI-fout'];
  const zichtbaar = projectenCache.filter((p) => projectFilter === 'alle' ? true
    : projectFilter === 'CI-fout' ? p.ci_status === 'failure'
    : p.zichtbaarheid === projectFilter)
    .filter((p) => !projectZoek || (p.naam + ' ' + p.beschrijving + ' ' + p.taal).toLowerCase().includes(projectZoek.toLowerCase()));
  const kaarten = zichtbaar.map((p) => {
    const ciKlasse = p.ci_status === 'success' ? 'groen' : p.ci_status === 'failure' ? 'rood' : p.ci_status ? 'amber' : '';
    const ciTekst = p.ci_status === 'success' ? 'CI groen' : p.ci_status === 'failure' ? 'CI faalt' : p.ci_status ? p.ci_status : 'geen CI';
    return '<div class="kaart proj">'
      + '<div class="top"><span class="stip ' + (p.ci_status === 'failure' ? 'neer' : p.ci_status === 'success' ? 'ok' : 'wacht') + '"></span>'
      + '<span class="naam">' + esc(p.naam) + '</span>'
      + '<span class="rechts">' + (p.zichtbaarheid === 'privé' ? chip('privé') : chip('publiek', 'blauw')) + '</span></div>'
      + '<p class="beschr">' + esc(p.beschrijving || 'Geen omschrijving') + '</p>'
      + '<div class="voet">'
      + (p.versie ? '<span class="chip mono">' + esc(p.versie) + '</span>' : '')
      + '<span class="chip ' + ciKlasse + '">' + esc(ciTekst) + '</span>'
      + (p.taal ? '<span>' + esc(p.taal) + '</span>' : '')
      + (p.issues ? '<span>' + p.issues + ' issue' + (p.issues === 1 ? '' : 's') + '</span>' : '')
      + '<span class="spacer"></span>'
      + '<span class="sha" title="' + esc(p.commit_bericht) + '">' + esc(p.commit_sha || '') + '</span>'
      + '<a class="knop klein stil" href="' + esc(p.url) + '" target="_blank" rel="noopener" title="Open op GitHub">' + ico.extern + '</a>'
      + '</div></div>';
  }).join('');
  beeld.innerHTML =
    '<div class="zoek"><input id="pzoek" placeholder="Zoek in projecten…" value="' + esc(projectZoek) + '">'
    + '<button class="knop" id="pververs">' + ico.span + 'Verversen</button></div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">'
    + filters.map((f) => '<button class="knop klein ' + (projectFilter === f ? 'primair' : '') + '" data-filter="' + f + '">' + f + '</button>').join('')
    + '</div>'
    + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-body" style="display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)">'
    + '<span><b style="color:var(--txt)">' + projectenCache.length + '</b> projecten</span>'
    + '<span><b style="color:var(--txt)">' + projectenCache.filter((p) => p.zichtbaarheid === 'publiek').length + '</b> publiek</span>'
    + '<span><b style="color:var(--txt)">' + projectenCache.filter((p) => p.ci_status === 'failure').length + '</b> CI-fouten</span>'
    + '<span style="margin-left:auto">Opgehaald ' + geleden(d.op) + '</span></div></div>'
    + (d.fout ? '<div class="kaart" style="border-color:rgba(255,95,111,.35);margin-bottom:14px"><div class="kaart-body"><p class="fout-tekst">' + esc(d.fout) + '</p></div></div>' : '')
    + (zichtbaar.length ? '<div class="project-grid">' + kaarten + '</div>' : '<div class="kaart">' + leeg('Geen projecten in deze selectie.') + '</div>');
  $('#pzoek').addEventListener('input', (e) => { projectZoek = e.target.value; renderProjecten(d); $('#pzoek').focus(); });
  $('#pververs').addEventListener('click', () => laadProjecten(true));
  beeld.querySelectorAll('[data-filter]').forEach((b) => b.addEventListener('click', () => { projectFilter = b.dataset.filter; renderProjecten(d); }));
}

async function laadSites() {

  try {
    const d = await api('/api/sites');
    zetTeller('tab-sites', d.sites.length);

      const st = statusVan(site);
      const l = site.laatste || {};
      const stats = site.stats || {};
      const detail = [];
      if (l.versie) detail.push('<span class="chip mono">' + esc(versieLabel(l.versie)) + '</span>');
      if (l.code) detail.push('<span class="chip ' + (l.ok ? 'groen' : 'rood') + '">HTTP ' + l.code + '</span>');
      if (l.ms != null) detail.push('<span style="color:var(--muted2)">' + nlGetal(l.ms) + ' ms</span>');
      if (l.tls_dagen != null) detail.push('<span style="color:' + (l.tls_dagen < 20 ? 'var(--amber)' : 'var(--muted2)') + '">TLS ' + l.tls_dagen + ' d</span>');
      if (site.uptime24 != null) detail.push('<span style="color:var(--muted2)">' + nlGetal(site.uptime24) + '% 24u</span>');
      return '<a class="rij" href="#" data-site="' + site.id + '">'
        + '<span class="stip ' + st.klasse + '"></span>'
        + '<div class="groot"><div class="naam"><span class="tekst">' + esc(site.naam) + '</span>'
        + (stats.gebruikers ? chip(stats.gebruikers + ' gebruikers') : '')
        + (stats.bestanden ? chip(stats.bestanden + ' bestanden') : '')
        + '</div><div class="onder">' + esc(site.url) + '</div>'
        + '<div class="meta" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12px">' + detail.join(' ') + '</div></div>'
        + '<div class="rechts"><span style="font-size:12px;color:var(--muted2)" class="alleen-breed">' + geleden(l.op) + '</span></div></a>';
    }).join('');
    beeld.innerHTML =
      '<details class="uitklap"><summary>' + ico.plus + ' Website toevoegen<span class="plus">+</span></summary><div class="binnen">'
      + '<form id="siteform" class="form-rij">'
      + '<div class="form-rij twee"><label class="veld"><span>Naam</span><input name="naam" required placeholder="Bijv. AkkoordKast"></label>'
      + '<label class="veld"><span>Adres</span><input name="url" required placeholder="http://192.168.1.24/"></label></div>'
      + '<div class="form-rij drie"><label class="veld"><span>IP (voor tickets)</span><input name="ip" placeholder="192.168.1.24"></label>'
      + '<label class="veld"><span>GitHub-repo</span><input name="repo" placeholder="akkoordkast"></label>'
      + '<label class="veld"><span>Interval (seconden)</span><input name="interval_s" type="number" min="30" value="60"></label></div>'
      + '<label class="veld"><span>Stats-adres (optioneel)</span><input name="stats_url" placeholder="http://192.168.1.24/api/stats"></label>'
      + '<p class="hint">Een stats-adres levert gebruikers, bestanden en databasegrootte; zie de README voor het contract.</p>'
      + '<button class="knop primair" type="submit">' + ico.plus + 'Toevoegen</button></form></div></details>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Websites</h2><div class="rechts">'
      + '<button class="knop klein" id="alles-control">Alles controleren</button></div></div><div class="rijen">'
      + (rijen || leeg('Nog geen websites. Voeg je eerste site toe.')) + '</div></div>'
      + '<p class="hint">Klik op een site voor versie, uptime, gebruikscijfers en de laatste metingen.</p>';
    beeld.querySelectorAll('[data-site]').forEach((el) => el.addEventListener('click', (e) => {
      e.preventDefault(); siteDetail = el.dataset.site; laadSiteDetail(siteDetail);
    }));
    $('#siteform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const lichaam = Object.fromEntries(f.entries());
      try {
        await api('/api/sites', { method: 'POST', lichaam });
        toast('Website toegevoegd');
        laadSites();
      } catch (err) { toast(err.message, true); }
    });
    $('#alles-control').addEventListener('click', async () => {
      const knop = $('#alles-control');
      knop.classList.add('bezig'); knop.textContent = 'Bezig…';
      for (const s of d.sites) { try { await api('/api/sites/' + s.id + '/controleer', { method: 'POST' }); } catch {} }
      toast('Alle sites gecontroleerd');
      laadSites();
    });
  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

      catch (err) { toast(err.message, true); e.target.classList.remove('bezig'); }

      bevestig('Site verwijderen', 'Weet je zeker dat je ' + site.naam + ' en alle metingen wilt verwijderen?', async () => {
        await api('/api/sites/' + id, { method: 'DELETE' }); toast('Site verwijderd'); siteDetail = null; laadSites();
      });

}

// ── grafieken (Grafana-achtig: tijdreeksen, drempels, annotaties) ─────────────
// De server stuurt alleen punten; hier tekenen we ze als SVG. Geen library, geen
// externe Grafana: één functie die een reeks omzet in een lijn met assen.
let grafiekBereik = '24u';

const GRAFIEK_KLEUREN = ['#2ea3f2', '#0ea5b7', '#f59e0b', '#8b5cf6', '#ef4444'];
const ERNST_LIJN = { kritiek: '#dc2626', hoog: '#ea580c', gemiddeld: '#f59e0b', waarschuwing: '#0ea5b7', info: '#059669' };

function grafiekSvg(reeksen, opties = {}) {
  const B = 780, H = 200, m = { l: 48, r: 16, t: 14, b: 26 };
  const van = Date.parse(opties.van), tot = Date.parse(opties.tot);
  const waarden = reeksen.flatMap((r) => r.punten.map((p) => p.waarde)).filter((v) => v !== null && v !== undefined);
  if (!waarden.length) return '<p class="leeg">Nog geen metingen in dit venster.</p>';
  let min = Math.min(...waarden), max = Math.max(...waarden);
  if (min === max) max = min + 1;
  const marge = (max - min) * 0.08;
  min = Math.max(0, min - marge); max += marge;
  const mooi = (v) => nlGetal(Math.round(v * 10) / 10);
  const x = (t) => m.l + ((t - van) / (tot - van)) * (B - m.l - m.r);
  const y = (v) => H - m.b - ((v - min) / (max - min)) * (H - m.t - m.b);
  const eenheid = opties.eenheid || '';
  const fmt = (v) => nlGetal(v) + eenheid;
  // Een drempel die ver buiten de metingen ligt (800 ms bij een ping van 2 ms)
  // zou de grafiek platdrukken; die tonen we alleen als tekst bij de kop.
  const drempelZichtbaar = opties.drempel !== undefined && opties.drempel !== null
    && opties.drempel >= min && opties.drempel <= max;

  let uit = '<svg viewBox="0 0 ' + B + ' ' + H + '" width="100%" height="' + H + '" role="img" aria-label="' + esc(opties.titel || 'grafiek') + '">';
  uit += '<rect x="0" y="0" width="' + B + '" height="' + H + '" fill="none"/>';
  for (let i = 0; i <= 4; i++) {
    const v = min + ((max - min) * i) / 4;
    const yy = y(v);
    uit += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (B - m.r) + '" y2="' + yy + '" stroke="#e5ecf4" stroke-width="1"/>';
    uit += '<text x="' + (m.l - 8) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="11" fill="#7c8ba1">' + esc(mooi(v) + eenheid) + '</text>';
  }
  // Annotaties: verticale lijnen op het moment van een melding.
  for (const a of (opties.annotaties || [])) {
    const t = Date.parse(a.op);
    if (!(t >= van && t <= tot)) continue;
    const xx = x(t);
    const kleur = ERNST_LIJN[a.ernst] || '#f59e0b';
    uit += '<line x1="' + xx + '" y1="' + m.t + '" x2="' + xx + '" y2="' + (H - m.b) + '" stroke="' + kleur + '" stroke-width="1" stroke-dasharray="3 3" opacity="0.7"/>';
    uit += '<circle cx="' + xx + '" cy="' + m.t + '" r="2.5" fill="' + kleur + '"/>';
  }
  // Drempellijn (zoals Grafana's threshold).
  if (drempelZichtbaar) {
    const yy = y(opties.drempel);
    uit += '<line x1="' + m.l + '" y1="' + yy + '" x2="' + (B - m.r) + '" y2="' + yy + '" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="6 4"/>';
    uit += '<text x="' + (B - m.r) + '" y="' + (yy - 5) + '" text-anchor="end" font-size="10.5" fill="#dc2626">' + esc(mooi(opties.drempel) + eenheid) + '</text>';
  }
  reeksen.forEach((r, i) => {
    const kleur = r.kleur || GRAFIEK_KLEUREN[i % GRAFIEK_KLEUREN.length];
    let d = '';
    let vorigeNull = true;
    for (const p of r.punten) {
      if (p.waarde === null || p.waarde === undefined) { vorigeNull = true; continue; }
      const xx = x(Date.parse(p.op)), yy = y(p.waarde);
      d += (vorigeNull ? 'M' : 'L') + xx.toFixed(1) + ' ' + yy.toFixed(1) + ' ';
      vorigeNull = false;
    }
    if (d) uit += '<path d="' + d.trim() + '" fill="none" stroke="' + kleur + '" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"' + (r.gestippeld ? ' stroke-dasharray="5 4"' : '') + '/>';
  });
  // Tijdlabels onder de grafiek.
  const stappen = [0, 0.5, 1];
  for (const deel of stappen) {
    const t = van + (tot - van) * deel;
    const xx = x(t);
    const label = urenLabel(van, tot, t);
    uit += '<text x="' + xx + '" y="' + (H - 8) + '" text-anchor="' + (deel === 0 ? 'start' : deel === 1 ? 'end' : 'middle') + '" font-size="11" fill="#7c8ba1">' + esc(label) + '</text>';
  }
  uit += '</svg>';
  if (reeksen.length > 1) {
    uit += '<div class="grafiek-legenda">' + reeksen.map((r, i) => '<span><i style="background:' + (r.kleur || GRAFIEK_KLEUREN[i % GRAFIEK_KLEUREN.length]) + '"></i>' + esc(r.naam) + '</span>').join('') + '</div>';
  }
  return uit;
}

function urenLabel(van, tot, t) {
  const d = new Date(t);
  const lang = tot - van > 48 * 3600e3;
  return lang
    ? d.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short' })
    : d.toLocaleTimeString('nl-NL', { hour: '2-digit', minute: '2-digit' });
}

function csvVan(reeksen) {
  const kop = ['tijd', ...reeksen.map((r) => r.naam)];
  const rijen = [kop.join(';')];
  const lengte = Math.max(...reeksen.map((r) => r.punten.length));
  for (let i = 0; i < lengte; i++) {
    const eerste = reeksen.find((r) => r.punten[i]);
    rijen.push([eerste ? eerste.punten[i].op : '', ...reeksen.map((r) => { const p = r.punten[i]; return p && p.waarde !== null && p.waarde !== undefined ? String(p.waarde).replace('.', ',') : ''; })].join(';'));
  }
  return rijen.join('\n');
}

function downloadCsv(naam, reeksen) {
  const blob = new Blob([csvVan(reeksen)], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = naam.replace(/[^a-z0-9-]+/gi, '-').toLowerCase() + '.csv';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function grafiekKaart(titel, reeksen, opties = {}) {
  const laatste = reeksen[0] && reeksen[0].punten.length ? reeksen[0].punten[reeksen[0].punten.length - 1].waarde : null;
  const id = 'csv-' + Math.random().toString(36).slice(2, 8);
  return '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>' + esc(titel) + '</h2>'
    + '<div class="rechts"><span class="chip">' + (laatste !== null && laatste !== undefined ? esc(nlGetal(laatste) + (opties.eenheid || '')) : '—') + '</span>'
    + (opties.drempel !== undefined && opties.drempel !== null ? '<span class="chip" title="Drempel">drempel ' + esc(nlGetal(opties.drempel) + (opties.eenheid || '')) + '</span>' : '')
    + '<button class="knop stil klein" id="' + id + '">CSV</button></div></div>'
    + '<div class="kaart-body">' + grafiekSvg(reeksen, opties) + '</div></div>';
}

async function laadGrafieken() {
  const d = await api('/api/grafiek?bereik=' + grafiekBereik).catch(() => ({ hosts: [], servers: [], sites: [], apparaten: [], annotaties: [] }));
  const bereiken = ['1u', '6u', '24u', '7d', '30d'];
  const knoppen = bereiken.map((b) => '<button class="knop klein' + (b === grafiekBereik ? ' primair' : '') + '" data-bereik="' + b + '">' + b + '</button>').join(' ');
  const kaarten = [];

  for (const h of (d.hosts || [])) {
    kaarten.push({ titel: 'Ping · ' + h.naam, reeksen: [{ naam: h.naam, punten: h.punten }], opties: { van: d.van, tot: d.tot, eenheid: ' ms', drempel: 800, annotaties: d.annotaties } });
  }
  for (const s of (d.servers || [])) {
    kaarten.push({
      titel: 'Belasting · ' + s.naam,
      reeksen: [{ naam: 'CPU', punten: s.punten }, { naam: 'RAM', punten: s.ram || [], kleur: GRAFIEK_KLEUREN[1], gestippeld: true }],
      opties: { van: d.van, tot: d.tot, eenheid: '%', drempel: 90, annotaties: d.annotaties },
    });
    if (s.temp && s.temp.some((p) => p.waarde !== null)) {
      kaarten.push({ titel: 'Temperatuur · ' + s.naam, reeksen: [{ naam: 'Temp', punten: s.temp, kleur: GRAFIEK_KLEUREN[2] }], opties: { van: d.van, tot: d.tot, eenheid: ' °C', drempel: 80, annotaties: d.annotaties } });
    }
  }
  for (const s of (d.sites || [])) {
    kaarten.push({ titel: 'Responstijd · ' + s.naam, reeksen: [{ naam: s.naam, punten: s.punten }], opties: { van: d.van, tot: d.tot, eenheid: ' ms', drempel: 2000, annotaties: d.annotaties } });
  }

  beeld.innerHTML =
    '<div class="kaarten-kop"><div><h2>Grafieken</h2><p class="hint">Tijdreeksen uit de eigen database: ping per host, CPU en RAM per server, responstijd per website. Stippellijnen zijn drempels, de gekleurde strepen zijn meldingen in hetzelfde venster. Met CSV haal je de punten eruit.</p></div>'
    + '<div style="display:flex;gap:6px;flex-wrap:wrap">' + knoppen + '</div></div>'
    + (kaarten.length ? kaarten.map((k) => grafiekKaart(k.titel, k.reeksen, k.opties)).join('')
        : '<div class="kaart"><div class="kaart-body">' + leeg('Nog geen metingen. Voeg hosts, servers of websites toe en laat de monitor een tijdje draaien.') + '</div></div>')
    + ((d.annotaties || []).length ? '<div class="kaart" style="margin-top:14px"><div class="kaart-kop"><h2>Meldingen in dit venster</h2><span class="chip">' + d.annotaties.length + '</span></div><div class="kaart-body" style="padding:0"><div class="alerts" style="padding:12px 16px">'
        + d.annotaties.slice(-12).reverse().map((a) => '<div class="alert ' + (a.ernst === 'kritiek' || a.ernst === 'hoog' ? 'rood' : 'amber') + '"><div class="tekst"><b>' + esc(a.ip) + '</b> — ' + esc(a.bericht) + '</div><span class="tijd">' + esc(datum(a.op)) + '</span></div>').join('')
        + '</div></div></div>' : '');

  document.querySelectorAll('[data-bereik]').forEach((b) => b.addEventListener('click', () => {
    grafiekBereik = b.dataset.bereik;
    laadGrafieken();
  }));
  document.querySelectorAll('[id^="csv-"]').forEach((b, i) => b.addEventListener('click', () => {
    const k = kaarten[i];
    if (k) downloadCsv(k.titel, k.reeksen);
  }));
}

// ── meldingen (ernst, bevestigen, escalatie, onderhoud, SLA) ──────────────────
let meldingFilter = 'alle';

const ERNST_KLEUR = { kritiek: 'rood', hoog: 'amber', gemiddeld: 'amber', waarschuwing: '', info: 'groen' };
const ERNST_ICOON = { kritiek: '●', hoog: '●', gemiddeld: '●', waarschuwing: '●', info: '●' };

function meldingRij(a) {
  const k = ERNST_KLEUR[a.ernst] || '';
  const ack = a.bevestigd ? '<span class="chip groen" title="' + esc(a.bevestigd_door || '') + '">bevestigd</span>' : '';
  const ond = a.in_onderhoud ? '<span class="chip">onderhoud</span>' : '';
  return '<div class="melding-rij" data-melding="' + a.id + '">'
    + '<div class="melding-kop"><span class="chip ' + k + '">' + esc(a.ernst || '') + '</span>'
    + '<b>' + esc(a.naam || a.ip || '') + '</b>' + ack + ond
    + '<span class="tijd">' + geleden(a.op) + '</span></div>'
    + '<div class="melding-tekst">' + esc(a.bericht || '') + '</div>'
    + '<div class="melding-voet">'
    + '<span class="hint">' + esc(a.soort || '') + (a.meldingen > 1 ? ' · ' + a.meldingen + '× gemeld' : '')
    + (a.uptime24 !== null && a.uptime24 !== undefined ? ' · uptime 24u ' + nlGetal(a.uptime24) + '%' : '') + '</span>'
    + '<span class="melding-acties">'
    + (a.bevestigd ? '<button class="knop stil klein" data-terugzetten="' + a.id + '">Bevestiging intrekken</button>'
        : '<button class="knop klein" data-bevestig="' + a.id + '">Bevestigen</button>')
    + (a.ticket_id ? '<button type="button" class="knop klein stil" data-ticket-open="' + a.ticket_id + '">Ticket #' + a.ticket_id + '</button>'
        : '<button type="button" class="knop klein" data-ticket-maken="' + a.id + '">Ticket maken</button>')
    + '<button class="knop klein" data-oplossen="' + a.id + '">Oplossen</button>'
    + '</span></div>'
    + (a.notitie ? '<div class="hint" style="margin-top:4px">Notitie: ' + esc(a.notitie) + '</div>' : '')
    + '</div>';
}

async function laadMeldingen() {
  const d = await api('/api/problemen').catch(() => ({ problemen: [], tellingen: {}, ernst: {} }));
  const open = d.problemen || [];
  const tellingen = d.tellingen || {};
  const ernstLabels = d.ernst || {};
  zetTeller('tab-meldingen', open.length, open.some((a) => a.ernst === 'kritiek' || a.ernst === 'hoog'));
  const zichtbaar = meldingFilter === 'alle' ? open : open.filter((a) => a.ernst === meldingFilter);
  const chips = [['alle', open.length], ...Object.keys(ernstLabels).map((k) => [k, tellingen[k] || 0])];
  const knoppen = chips.map(([k, n]) =>
    '<button class="knop klein' + (meldingFilter === k ? ' primair' : '') + '" data-ernst="' + k + '">' + esc(k === 'alle' ? 'Alle' : ernstLabels[k]) + ' <span class="mono">' + n + '</span></button>').join(' ');

  let sla = '';
  try {
    const s = await api('/api/sla');
    const rijen = (s.hosts || []).filter((h) => h.uptime24 !== null || h.open);
    if (rijen.length) {
      sla = '<div class="kaart" style="margin-top:16px"><div class="kaart-kop"><h2>SLA per host</h2><span class="chip">24 uur · 7 dagen</span></div><div class="kaart-body" style="padding:0">'
        + '<table class="srv-tabel"><thead><tr><th>Host</th><th>Uptime 24 uur</th><th>Uptime 7 dagen</th><th>Open meldingen</th></tr></thead><tbody>'
        + rijen.map((h) => '<tr><td><b>' + esc(h.naam) + '</b><div class="mono">' + esc(h.ip) + '</div></td>'
          + '<td>' + (h.uptime24 === null || h.uptime24 === undefined ? '—' : '<span class="chip ' + (h.uptime24 < 99 ? 'rood' : h.uptime24 < 99.9 ? 'amber' : 'groen') + '">' + nlGetal(h.uptime24) + '%</span>') + '</td>'
          + '<td>' + (h.uptime168 === null || h.uptime168 === undefined ? '—' : nlGetal(h.uptime168) + '%') + '</td>'
          + '<td>' + (h.open || 0) + '</td></tr>').join('')
        + '</tbody></table></div></div>';
    }
  } catch { /* SLA is bijzaak */ }

  beeld.innerHTML =
    '<div class="kaarten-kop"><div><h2>Meldingen</h2><p class="hint">Open storingen met hun ernst. Bevestig een melding als je hem hebt gezien; hij blijft dan open, maar gaat niet opnieuw naar Slack. Kritieke en hoge meldingen worden na een uur opnieuw gemeld als ze niet bevestigd zijn. Tijdens een onderhoudsvenster gaat er niets naar buiten.</p></div>'
    + '<button class="knop primair" id="ond-plannen">Onderhoud inplannen</button></div>'
    + '<div class="kaart"><div class="kaart-body" style="display:flex;gap:8px;flex-wrap:wrap">' + knoppen + '</div></div>'
    + (open.length ? '<div class="kaart" style="margin-top:14px"><div class="kaart-body" style="padding:0">'
        + (zichtbaar.length ? zichtbaar.map(meldingRij).join('') : '<p class="leeg" style="padding:16px">Geen meldingen met deze ernst.</p>')
        + '</div></div>'
      : '<div class="kaart" style="margin-top:14px"><div class="kaart-body">' + leeg('Geen open meldingen. Alles is rustig.') + '</div></div>')
    + sla;

  document.querySelectorAll('[data-ernst]').forEach((b) => b.addEventListener('click', () => {
    meldingFilter = b.dataset.ernst;
    laadMeldingen();
  }));
  document.querySelectorAll('[data-bevestig]').forEach((b) => b.addEventListener('click', () => bevestigMelding(Number(b.dataset.bevestig))));
  document.querySelectorAll('[data-terugzetten]').forEach((b) => b.addEventListener('click', () => bevestigMelding(Number(b.dataset.terugzetten), true)));
  document.querySelectorAll('[data-oplossen]').forEach((b) => b.addEventListener('click', () => oplossenMelding(Number(b.dataset.oplossen))));
  document.querySelectorAll('[data-ticket-maken]').forEach((b) => b.addEventListener('click', async (e) => {
    e.preventDefault();
    e.stopPropagation();
    b.classList.add('bezig');
    try {
      const r = await api('/api/problemen/' + b.dataset.ticketMaken + '/ticket', { method: 'POST', lichaam: {} });
      toast(r.bestond ? 'Ticket #' + r.ticket.id + ' bestond al' : 'Ticket #' + r.ticket.id + ' gemaakt');
      huidigeTab = 'tickets';
      ticketWeergave = 'tickets';
      ticketDetail = String(r.ticket.id);
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('actief', x.dataset.tab === 'tickets'));
      laadHuidig();
    } catch (err) { toast(err.message, true); b.classList.remove('bezig'); }
  }));
  document.querySelectorAll('[data-ticket-open]').forEach((b) => b.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    huidigeTab = 'tickets';
    ticketWeergave = 'tickets';
    ticketDetail = String(b.dataset.ticketOpen);
    document.querySelectorAll('#tabs button').forEach((x) => x.classList.toggle('actief', x.dataset.tab === 'tickets'));
    laadHuidig();
  }));
  const plan = $('#ond-plannen');
  if (plan) plan.addEventListener('click', toonOnderhoudForm);
}

async function bevestigMelding(id, terug = false) {
  try {
    if (terug) {
      await api('/api/problemen/' + id + '/terugzetten', { method: 'POST', lichaam: {} });
      toast('Bevestiging ingetrokken');
    } else {
      const notitie = prompt('Notitie (optioneel):', '') || '';
      await api('/api/problemen/' + id + '/bevestigen', { method: 'POST', lichaam: { notitie } });
      toast('Melding bevestigd');
    }
    laadMeldingen();
  } catch (e) { toast(e.message, true); }
}

async function oplossenMelding(id) {
  try {
    await api('/api/problemen/' + id + '/oplossen', { method: 'POST', lichaam: {} });
    toast('Melding opgelost');
    laadMeldingen();
  } catch (e) { toast(e.message, true); }
}

async function toonOnderhoudForm() {
  const m = $('#modal');
  let hosts = [];
  try { hosts = (await api('/api/hosts')).hosts || []; } catch { hosts = []; }
  const nuLokaal = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const later = new Date(Date.now() + 3600e3 - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  const opties = '<option value="*">Alle hosts en sites</option>' + hosts.map((h) => '<option value="' + esc(h.ip) + '">' + esc((h.naam || '') + ' ' + h.ip) + '</option>').join('');
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">Onderhoud inplannen</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">Tijdens het venster gaat er geen melding naar Slack en worden hosts niet gescand. Bestaande meldingen blijven staan.</p>'
    + '<form id="ondform">'
    + '<label class="veld"><span>Voor</span><select name="ip">' + opties + '</select></label>'
    + '<label class="veld"><span>Van</span><input name="van" type="datetime-local" value="' + nuLokaal + '"></label>'
    + '<label class="veld"><span>Tot</span><input name="tot" type="datetime-local" value="' + later + '" required></label>'
    + '<label class="veld"><span>Reden</span><input name="reden" placeholder="bijv. firmware-update switch"></label>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button type="button" class="knop" id="ond-annuleer">Annuleren</button><button type="submit" class="knop primair">Inplannen</button></div></form>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#ond-annuleer').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#ondform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      await api('/api/onderhoud', { method: 'POST', lichaam: {
        ip: f.get('ip'), van: new Date(f.get('van')).toISOString(), tot: new Date(f.get('tot')).toISOString(), reden: f.get('reden'),
      } });
      sluit();
      toast('Onderhoud ingepland');
      laadMeldingen();
    } catch (err) { toast(err.message, true); }
  });
}

let ticketCache = [];
// ── Tickets, rapportage en kennisbank (TopDesk-laag) ────────────────────────
// Eén tab met drie weergaven. De subnavigatie staat bovenaan, zodat je niet
// hoeft te raden waar de rapportage of de kennisbank is gebleven.
const OPEN_STATUSSEN = ['open', 'in behandeling', 'wacht op Tom', 'wacht op klant', 'wacht op leverancier'];
const STATUS_KLEUR = {
  'open': 'amber', 'in behandeling': 'blauw', 'wacht op Tom': 'blauw',
  'wacht op klant': 'amber', 'wacht op leverancier': 'amber', 'opgelost': 'groen', 'gesloten': '',
};
const SOORT_LABEL_TICKET = { incident: 'Incident', change: 'Change' };

// Dezelfde matrix als de server: impact x urgentie, de hoogste van de twee telt
// zwaarder. Zo zie je in het formulier meteen wat de prioriteit wordt.
function prioriteitUit(impact, urgentie) {
  const volg = ['laag', 'normaal', 'hoog'];
  const i = volg.indexOf(String(impact || 'normaal'));
  const u = volg.indexOf(String(urgentie || 'normaal'));
  const score = Math.max(i, u) + Math.min(i, u);
  if (score >= 4) return 'kritiek';
  if (score >= 2) return 'hoog';
  if (score >= 1) return 'normaal';
  return 'laag';
}
function slaKlasse(tekst) {
  if (tekst === 'overschreden') return 'overschreden';
  if (tekst === 'bijna') return 'bijna';
  if (tekst === 'gehaald' || tekst === 'op tijd') return 'gehaald';
  return 'op-tijd';
}
function minutenTekst(m) {
  if (m === null || m === undefined) return '—';
  const n = Number(m);
  if (!Number.isFinite(n)) return '—';
  if (n < 60) return n + ' min';
  const uur = Math.floor(n / 60);
  const rest = n % 60;
  if (uur < 24) return uur + ' u' + (rest ? ' ' + rest + ' m' : '');
  const dag = Math.floor(uur / 24);
  return dag + ' d' + (uur % 24 ? ' ' + (uur % 24) + ' u' : '');
}
function opties(lijst, huidig, leegLabel) {
  const eerste = leegLabel === undefined ? '' : '<option value="">' + esc(leegLabel) + '</option>';
  return eerste + lijst.map((w) => '<option value="' + esc(w) + '"' + (w === huidig ? ' selected' : '') + '>' + esc(w) + '</option>').join('');
}

function ticketNav() {
  const knop = (sleutel, label, aantal) => '<button type="button" data-tseg="' + sleutel + '"'
    + (ticketWeergave === sleutel ? ' class="actief"' : '') + '>' + label
    + (aantal !== undefined && aantal !== null ? '<span class="tel">' + aantal + '</span>' : '') + '</button>';
  return '<div class="seg" id="ticket-seg">' + knop('tickets', 'Tickets', ticketOpenAantal)
    + knop('rapport', 'Rapportage') + knop('kennisbank', 'Kennisbank', kennisCache.length || null) + '</div>';
}
function koppelTicketNav() {
  const seg = $('#ticket-seg');
  if (!seg) return;
  seg.querySelectorAll('[data-tseg]').forEach((b) => b.addEventListener('click', () => {
    ticketWeergave = b.dataset.tseg;
    ticketDetail = null;
    laadHuidig();
  }));
}

// De SLA-klokken: eerste reactie, oplossing met de resterende tijd, verstreken
// tijd en de afspraak die erbij hoort. De balk laat zien hoeveel van de
// oplostijd al gebruikt is.
function slaBlok(t) {
  const s = t.sla || {};
  const afspraak = s.afspraak || { reactie: 0, oplos: 0 };
  const klaar = t.status === 'opgelost' || t.status === 'gesloten';
  const klok = (k, v, n, klasse) => '<div class="sla-klok ' + slaKlasse(klasse) + '">'
    + '<div class="k">' + esc(k) + '</div><div class="v">' + esc(v) + '</div><div class="n">' + esc(n) + '</div></div>';
  const gebruikt = afspraak.oplos ? Math.min(100, Math.round(((s.verstreken || 0) / afspraak.oplos) * 100)) : 0;
  return '<div class="sla">'
    + klok('Eerste reactie', s.eerste_reactie === null || s.eerste_reactie === undefined ? 'nog niet' : minutenTekst(s.eerste_reactie),
      'afspraak ' + minutenTekst(afspraak.reactie), s.reactie)
    + klok('Oplossing', klaar ? 'afgerond' : 'nog ' + minutenTekst(s.resterend),
      'afspraak ' + minutenTekst(afspraak.oplos), s.oplossing)
    + klok('Verstreken', minutenTekst(s.verstreken), t.wacht ? 'klok staat stil' : 'klok loopt', s.oplossing)
    + klok('SLA', t.sla_label || '—', klaar ? (s.oplossing === 'gehaald' ? 'binnen de afspraak' : 'over de afspraak') : 'prioriteit ' + t.prioriteit, s.oplossing)
    + '</div>'
    + '<div class="sla-balk ' + slaKlasse(s.oplossing) + '" title="' + gebruikt + '% van de oplostijd gebruikt"><i style="width:' + gebruikt + '%"></i></div>';
}

function ticketRij(t) {
  const s = t.sla || {};
  const klaar = t.status === 'opgelost' || t.status === 'gesloten';
  const tekst = t.wacht ? 'klok stil'
    : s.oplossing === 'overschreden' ? 'over SLA'
    : s.oplossing === 'bijna' ? 'bijna over SLA'
    : klaar ? 'binnen SLA' : 'binnen SLA';
  const kleur = s.oplossing === 'overschreden' ? 'rood' : s.oplossing === 'bijna' ? 'amber' : klaar ? 'groen' : '';
  return '<div class="ticket-rij" data-ticket="' + t.id + '">'
    + '<span class="prio ' + esc(t.prioriteit) + '"></span>'
    + '<div class="midden"><div class="titel">#' + t.id + ' ' + esc(t.titel) + '</div>'
    + '<div class="meta">'
    + (t.ip ? '<span class="mono">' + esc(t.ip) + '</span>' : '')
    + chip(t.status, STATUS_KLEUR[t.status] || '')
    + (t.prioriteit !== 'normaal' ? chip(t.prioriteit, t.prioriteit === 'kritiek' ? 'rood' : 'amber') : '')
    + (t.categorie ? '<span>' + esc(t.categorie) + '</span>' : '')
    + (t.behandelaar ? '<span>' + esc(t.behandelaar) + '</span>' : '')
    + '<span>' + (t.berichten || 0) + ' bericht' + ((t.berichten || 0) === 1 ? '' : 'en') + '</span>'
    + '<span>' + geleden(t.aangemaakt) + '</span></div></div>'
    + '<div class="rechts">' + chip(tekst, kleur) + '</div></div>';
}

async function laadTickets(voorgevuld = null) {
  ticketWeergave = 'tickets';
  beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="leeg">Tickets laden…</p></div></div>';
  try {
    const d = await api('/api/tickets');
    ticketCache = d.tickets;
    window.TICKET_CATEGORIEEN = d.categorieen || [];
    window.TICKET_BEHANDELAARS = d.behandelaars || [];
    window.TICKET_SLA = d.sla_label || {};
    ticketOpenAantal = ticketCache.filter((t) => OPEN_STATUSSEN.includes(t.status)).length;
    zetTeller('tab-tickets', ticketOpenAantal, ticketCache.some((t) => t.prioriteit === 'kritiek' && OPEN_STATUSSEN.includes(t.status)));
    beeld.innerHTML = ticketNav()
      + ticketFormulier()
      + '<div class="kaart"><div class="kaart-kop"><h2>Alle tickets</h2><div class="rechts">'
      + '<span style="font-size:12px;color:var(--muted2)">' + ticketCache.length + ' totaal · ' + ticketOpenAantal + ' open</span></div></div>'
      + (ticketCache.length ? '<div>' + ticketCache.map(ticketRij).join('') + '</div>'
        : leeg('Nog geen tickets. Maak het eerste aan voor je ICT-agent.')) + '</div>'
      + '<p class="hint">De agent leest deze tickets via de agent-API (zie Instellingen) en schrijft zijn bevindingen terug in het ticket. '
      + 'Een melding van buiten komt binnen via <a href="/melden" target="_blank" rel="noopener">/melden</a>.</p>';
    koppelTicketNav();
    beeld.querySelectorAll('[data-ticket]').forEach((el) => el.addEventListener('click', () => { ticketDetail = el.dataset.ticket; laadTicketDetail(ticketDetail); }));

    // Prioriteit meteen laten zien: impact x urgentie, zoals de server rekent.
    const uitkomst = $('#prio-uitkomst');
    const ververs = () => {
      const p = prioriteitUit($('#impact').value, $('#urgentie').value);
      uitkomst.innerHTML = 'Prioriteit wordt <b>' + esc(p) + '</b> · SLA ' + esc((window.TICKET_SLA || {})[p] || '') + '.';
      uitkomst.style.color = p === 'kritiek' ? 'var(--red)' : p === 'hoog' ? 'var(--amber)' : 'var(--muted)';
    };
    $('#impact').addEventListener('change', ververs);
    $('#urgentie').addEventListener('change', ververs);
    ververs();

    const soort = $('#ticket-soort');
    const changeVelden = $('#change-velden');
    soort.addEventListener('change', () => { changeVelden.style.display = soort.value === 'change' ? '' : 'none'; });

    // Vanuit een IP-adres: het formulier meteen openen en invullen.
    if (voorgevuld) {
      const det = beeld.querySelector('details.uitklap');
      if (det) det.open = true;
      const f = $('#ticketform');
      if (f) {
        if (voorgevuld.titel) f.titel.value = voorgevuld.titel;
        if (voorgevuld.ip) f.ip.value = voorgevuld.ip;
        if (voorgevuld.omschrijving) f.omschrijving.value = voorgevuld.omschrijving;
        if (voorgevuld.categorie) f.categorie.value = voorgevuld.categorie;
        f.scrollIntoView({ behavior: 'smooth', block: 'start' });
        setTimeout(() => f.titel.focus(), 120);
      }
    }

    $('#scan-knop').addEventListener('click', async () => {
      const ip = $('[name=ip]').value.trim();
      if (!ip) return toast('Vul eerst een IP-adres in', true);
      const knop = $('#scan-knop');
      knop.classList.add('bezig'); knop.textContent = 'Aftasten…';
      try {
        const r = await api('/api/hosts/scan', { method: 'POST', lichaam: { ip } });
        const sc = r.scan;
        $('#scan-uit').innerHTML = '<div class="context-blok" style="margin-bottom:12px"><h4>Scan ' + esc(sc.ip) + '</h4>'
          + '<div style="font-size:12.5px;color:var(--muted)">Open poorten: ' + (sc.poorten.length ? '' : 'geen') + '</div>'
          + '<div class="poorten">' + sc.poorten.map((pt) => '<span class="chip mono groen">' + pt + '</span>').join('') + '</div>'
          + (sc.diensten.length ? '<ul style="margin-top:9px">' + sc.diensten.map((x) => '<li>poort ' + x.poort + ' — ' + esc(x.titel || x.server || x.fout || 'geen titel') + ' (' + (x.code || '—') + ')</li>').join('') + '</ul>' : '')
          + '</div>';
      } catch (err) { toast(err.message, true); }
      finally { knop.classList.remove('bezig'); knop.innerHTML = ico.span + 'IP aftasten'; }
    });

    $('#ticketform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const lichaam = Object.fromEntries(new FormData(e.target).entries());
      if (lichaam.soort !== 'change') { delete lichaam.change_van; delete lichaam.change_tot; }
      try {
        const r = await api('/api/tickets', { method: 'POST', lichaam });
        toast('Ticket #' + r.ticket.id + ' aangemaakt');
        ticketDetail = String(r.ticket.id);
        laadTicketDetail(ticketDetail);
      } catch (err) { toast(err.message, true); }
    });
  } catch (e) {
    beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>';
  }
}

      const rolLabel = b.rol === 'agent' ? 'ICT-agent' : b.rol === 'klant' ? 'Klant' : b.rol === 'systeem' ? 'Monitor' : 'Tom';

function procentTekst(p) { return p === null || p === undefined ? '—' : p + '%'; }
