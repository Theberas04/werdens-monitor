  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">' + (apparaat ? 'Apparaat wijzigen' : 'Apparaat toevoegen') + '</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">De monitor leest het apparaat via zijn eigen API. Bij UniFi de controller-URL en een beheerdersaccount; bij TrueNAS een API-key uit de webinterface (Instellingen → API-sleutels); bij Proxmox een API-token uit Datacenter → Permissions → API Tokens.</p>'
    + '<form id="appform">'
    + '<label class="veld"><span>Naam</span><input name="naam" value="' + esc(a.naam || '') + '" placeholder="bijv. unifi-thuis" required></label>'
    + '<label class="veld"><span>Soort</span><select name="soort" id="app-soort">' + opties + '</select></label>'
    + '<label class="veld"><span>URL</span><input name="url" value="' + esc(a.url || '') + '" placeholder="https://192.168.1.1" required></label>'
    + '<label class="veld"><span>Gebruiker of token (bij generiek)</span><input name="gebruiker" value="' + esc(a.gebruiker || '') + '" placeholder="beheerder of bearer-token"></label>'
    + '<label class="veld"><span>Wachtwoord of API-key</span><input name="geheim" type="password" placeholder="' + (apparaat && a.heeft_geheim ? 'laat leeg om het bestaande te houden' : 'wachtwoord of API-key') + '"></label>'
    + '<p class="hint" id="app-hint">' + esc(veldHint) + '</p>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button type="button" class="knop" id="app-annuleer">Annuleren</button><button type="submit" class="knop primair">' + (apparaat ? 'Opslaan' : 'Toevoegen') + '</button></div></form>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#app-annuleer').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#app-soort').addEventListener('change', (e) => {
    $('#app-hint').textContent = SOORT_HINT[e.target.value] || '';
  });
  $('#appform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    const lichaam = { naam: f.get('naam'), soort: f.get('soort'), url: f.get('url'), gebruiker: f.get('gebruiker'), geheim: f.get('geheim') };
    try {
      if (apparaat) await api('/api/apparaten/' + apparaat.id, { method: 'PATCH', lichaam });
      else await api('/api/apparaten', { method: 'POST', lichaam });
      sluit();
      toast(apparaat ? 'Apparaat bijgewerkt' : 'Apparaat toegevoegd');
      if (apparaat) laadApparaatDetail(apparaat.id); else { apparaatDetail = null; laadHuidig(); }
    } catch (err) { toast(err.message, true); }
  });
}

function toonServerForm() {
  const m = $('#modal');
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">Server toevoegen</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 16px">Een externe server meet zichzelf met het agent-script en stuurt de cijfers hierheen. Je krijgt een token dat je op die server instelt.</p>'
    + '<form id="srvform"><label class="veld"><span>Naam</span><input name="naam" placeholder="bijv. proxmox-thuis" required></label>'
    + '<label class="veld"><span>Hostnaam of IP (optioneel)</span><input name="host" placeholder="192.168.1.50"></label>'
    + '<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button type="button" class="knop" id="srv-annuleer">Annuleren</button><button type="submit" class="knop primair">Toevoegen</button></div></form>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#srv-annuleer').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#srvform').addEventListener('submit', async (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    try {
      const r = await api('/api/servers', { method: 'POST', lichaam: { naam: f.get('naam'), host: f.get('host') } });
      sluit();
      toast('Server toegevoegd');
      toonTokenModal(r.server, r.token);
      laadServers();
    } catch (err) { toast(err.message, true); }
  });
}

function toonTokenModal(server, token) {
  const m = $('#modal');
  const t = token || '••••••••';
  const commando = 'BASE_URL=' + location.origin + ' TOKEN=' + t + ' node werdens-agent.js';
  $('#modal-inhoud').innerHTML = '<h3 style="margin-bottom:6px">Agent-token voor ' + esc(server.naam) + '</h3>'
    + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Zet dit token in de omgeving van de agent op die server. Het token is alleen nu zichtbaar; later kun je het via de serverpagina vernieuwen.</p>'
    + '<div class="tokenvak" id="tokenwaarde">' + esc(t) + '</div>'
    + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin:12px 0"><button class="knop" id="token-kopieer">Token kopiëren</button><button class="knop" id="commando-kopieer">Commando kopiëren</button></div>'
    + '<div class="tokenvak" style="font-size:11.5px">' + esc(commando) + '</div>'
    + '<p class="hint">Download het agent-script uit de repo: <code>scripts/werdens-agent.js</code>. Zet daar <code>BASE_URL</code> en <code>TOKEN</code> in de omgeving en laat het via cron elke minuut draaien.</p>'
    + '<div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="knop primair" id="token-sluit">Sluiten</button></div>';
  m.classList.add('aan');
  const sluit = () => m.classList.remove('aan');
  $('#token-sluit').addEventListener('click', sluit);
  m.addEventListener('click', (e) => { if (e.target === m) sluit(); }, { once: true });
  $('#token-kopieer').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(t); toast('Token gekopieerd'); } catch { toast('Kopiëren lukte niet', true); }
  });
  $('#commando-kopieer').addEventListener('click', async () => {
    try { await navigator.clipboard.writeText(commando); toast('Commando gekopieerd'); } catch { toast('Kopiëren lukte niet', true); }
  });
}

// ── instellingen ─────────────────────────────────────────────────────────────
async function laadInstellingen() {
  try {
    const d = await api('/api/instellingen');
    const curl = 'curl -H "Authorization: Bearer ' + d.agent_token + '" http://<dit-adres>/api/agent/tickets';
    beeld.innerHTML =
      '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>ICT-agent koppelen</h2></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">De agent leest en schrijft alleen tickets, met dit token. Geef het aan je ICT-agent en laat hem de opdracht hieronder uitvoeren.</p>'
      + '<label class="veld"><span>Agent-token</span><div style="display:flex;gap:8px"><input id="token" value="' + esc(d.agent_token) + '" readonly style="font-family:var(--mono);font-size:12.5px">'
      + '<button class="knop" id="kopieer">Kopiëren</button><button class="knop gevaar" id="nieuw-token">Vernieuwen</button></div></label>'
      + '<div style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:pre-wrap;overflow-x:auto">'
      + esc('GET  /api/agent/tickets                 open tickets\nGET  /api/agent/tickets/:id             ticket + context\nPOST /api/agent/tickets/:id/berichten     bevinding terug\nPATCH /api/agent/tickets/:id            status zetten\nGET  /api/agent/sites                   site-status\nPOST /api/agent/scan { "ip": "..." }    host aftasten') + '</div>'
      + '<p class="hint">Voorbeeld: <code>' + esc(curl) + '</code></p>'
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Slack-meldingen</h2><span class="chip ' + (d.slack_aan && d.slack_webhook ? 'groen' : '') + '">' + (d.slack_aan && d.slack_webhook ? 'aan' : 'uit') + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Storingen worden als bericht naar een Slack-kanaal gestuurd. Maak in Slack een <b>Incoming Webhook</b> (App-directory → Incoming Webhooks → Add to Slack), kies het kanaal en plak de URL hier. Eén storing wordt één keer gemeld; blijft hij open, dan niet elke meetronde opnieuw.</p>'
      + '<form id="slackform"><label class="veld"><span>Webhook-URL</span><input name="slack_webhook" value="' + esc(d.slack_webhook || '') + '" placeholder="https://hooks.slack.com/services/..." autocomplete="off" spellcheck="false"></label>'
      + '<div style="display:flex;gap:16px;flex-wrap:wrap;margin:12px 0 14px"><label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" name="slack_aan"' + (d.slack_aan ? ' checked' : '') + '> Meldingen versturen</label>'
      + '<label style="display:flex;gap:8px;align-items:center;font-size:13.5px"><input type="checkbox" name="slack_herstel"' + (d.slack_herstel ? ' checked' : '') + '> Ook herstel melden</label></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="knop primair" type="submit">Opslaan</button><button class="knop" type="button" id="slack-test">Testbericht</button></div></form>'
      + (d.slack_laatst ? '<p class="hint">Laatst verzonden: ' + esc(geleden(d.slack_laatst)) + '</p>' : '')
      + (d.slack_laatst_fout ? '<p class="hint" style="color:var(--red)">Laatste fout: ' + esc(d.slack_laatst_fout) + '</p>' : '')
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Beheerder</h2></div><div class="kaart-body">'
      + '<form id="wwform" class="form-rij">'
      + '<label class="veld"><span>Naam</span><input name="admin_naam" value="' + esc(d.admin_naam) + '"></label>'
      + '<div class="form-rij twee"><label class="veld"><span>Huidig wachtwoord</span><input name="huidig_wachtwoord" type="password" autocomplete="current-password"></label>'
      + '<label class="veld"><span>Nieuw wachtwoord</span><input name="wachtwoord" type="password" autocomplete="new-password" minlength="8" placeholder="min. 8 tekens"></label></div>'
      + '<button class="knop primair" type="submit">Opslaan</button></form></div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>GitHub-token</h2><span class="chip ' + (d.github_token === 'ingesteld' ? 'groen' : '') + '">' + esc(d.github_token) + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Nodig voor de Projecten-tab (ook besloten repo&#39;s) en voor het bijwerken. Maak een token op GitHub → Settings → Developer settings → Personal access tokens met <b>repo</b> (en <b>read:user</b>). Het token wordt in de database bewaard en nooit teruggetoond.</p>'
      + '<form id="ghform"><label class="veld"><span>Token' + (d.github_login ? ' (nu: ' + esc(d.github_login) + (d.github_scopes ? ' · ' + esc(d.github_scopes) : '') + ')' : '') + '</span>'
      + '<input name="github_token" type="password" placeholder="' + (d.github_token === 'ingesteld' ? 'laat leeg om te behouden' : 'ghp_... of github_pat_...') + '" autocomplete="off" spellcheck="false"></label>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop primair" type="submit">Opslaan en testen</button>'
      + (d.github_token === 'ingesteld' ? '<button class="knop gevaar" type="button" id="gh-weg">Token verwijderen</button>' : '') + '</div></form>'
      + (d.github_token_bron ? '<p class="hint">Bron: ' + esc({ dashboard: 'ingesteld in dit dashboard', omgeving: 'omgevingsvariabele GITHUB_TOKEN', 'gh-config': 'de gh-CLI op deze machine' }[d.github_token_bron] || d.github_token_bron) + '</p>' : '')
      + (d.projecten_fout ? '<p class="hint" style="color:var(--red)">' + esc(d.projecten_fout) + '</p>' : '')
      + '</div></div>'
      + '<div class="kaart" style="margin-bottom:14px"><div class="kaart-kop"><h2>Bijwerken</h2><span class="chip" id="upd-chip">' + esc(d.update_versie || d.versie) + '</span></div><div class="kaart-body">'
      + '<p style="color:var(--muted);font-size:13.5px;margin:0 0 14px">Haalt de nieuwste versie van GitHub en vervangt de programmabestanden; je gegevens blijven staan. Daarna start de dienst zichzelf opnieuw.</p>'
      + '<div id="upd-uitslag"><p class="hint" style="margin:0">Nu: versie <b>' + esc(d.update_versie || d.versie) + '</b>' + (d.update_sha ? ' · ' + esc(String(d.update_sha).slice(0, 7)) : '') + '</p></div>'
      + '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="knop" type="button" id="upd-check">Controleer op updates</button>'
      + '<button class="knop primair" type="button" id="upd-doe" disabled>Nu bijwerken</button></div>'
      + '</div></div>'
      + '<div class="kaart"><div class="kaart-kop"><h2>Systeem</h2></div><div class="kaart-body">'
      + '<div style="display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)">'
      + '<div>Versie <b style="color:var(--txt)">' + esc(d.versie) + '</b></div>'
      + '<div>GitHub-token <b style="color:var(--txt)">' + esc(d.github_token) + '</b></div>'
      + '<div>Projecten opgehaald <b style="color:var(--txt)">' + geleden(d.projecten_op) + '</b></div>'
      + (d.projecten_fout ? '<div style="color:var(--red)">' + esc(d.projecten_fout) + '</div>' : '')
      + '</div></div></div>';
    $('#kopieer').addEventListener('click', async () => {
      try { await navigator.clipboard.writeText(d.agent_token); toast('Token gekopieerd'); }
      catch { toast('Kopiëren lukte niet', true); }
    });
    $('#nieuw-token').addEventListener('click', async () => {
      try { await api('/api/instellingen', { method: 'PATCH', lichaam: { agent_token: 'nieuw' } }); toast('Nieuw token aangemaakt'); laadInstellingen(); }
      catch (e) { toast(e.message, true); }
    });
    $('#slackform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      try {
        await api('/api/instellingen', { method: 'PATCH', lichaam: {
          slack_webhook: f.get('slack_webhook') || '',
          slack_aan: !!f.get('slack_aan'),
          slack_herstel: !!f.get('slack_herstel'),
        } });
        toast('Slack-instellingen opgeslagen'); laadInstellingen();
      } catch (err) { toast(err.message, true); }
    });
    $('#slack-test').addEventListener('click', async () => {
      const knop = $('#slack-test');
      knop.disabled = true; knop.textContent = 'Versturen…';
      try { await api('/api/slack/test', { method: 'POST' }); toast('Testbericht verstuurd'); }
      catch (err) { toast(err.message, true); }
      finally { knop.disabled = false; knop.textContent = 'Testbericht'; }
    });
    $('#ghform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const f = new FormData(e.target);
      const knop = e.target.querySelector('button[type=submit]');
      knop.disabled = true; knop.textContent = 'Controleren…';
      try {
        const r = await api('/api/instellingen', { method: 'PATCH', lichaam: { github_token: f.get('github_token') || '' } });
        toast('Token opgeslagen' + (r.github_login ? ' als ' + r.github_login : ''));
        laadInstellingen();
      } catch (err) { toast(err.message, true); knop.disabled = false; knop.textContent = 'Opslaan en testen'; }
    });
    const ghWeg = $('#gh-weg');
    if (ghWeg) ghWeg.addEventListener('click', async () => {
      try { await api('/api/instellingen', { method: 'PATCH', lichaam: { github_token: '' } }); toast('Token verwijderd'); laadInstellingen(); }
      catch (err) { toast(err.message, true); }
    });
    $('#upd-check').addEventListener('click', async () => {
      const knop = $('#upd-check');
      knop.disabled = true; knop.textContent = 'Kijken…';
      try {
        const r = await api('/api/update/controleer', { method: 'POST' });
        $('#upd-uitslag').innerHTML = r.nieuw
          ? '<p style="margin:0;font-size:13.5px">Nieuw op GitHub: <b>' + esc(String(r.laatste.kort || '')) + '</b> — ' + esc(r.laatste.bericht || '') + (r.laatste.datum ? '<br><span class="hint" style="margin:0">' + geleden(r.laatste.datum) + '</span>' : '') + '</p>'
          : '<p style="margin:0;font-size:13.5px;color:var(--green)">Je draait al de nieuwste versie.</p>';
        $('#upd-doe').disabled = !r.nieuw;
      } catch (err) { toast(err.message, true); }
      finally { knop.disabled = false; knop.textContent = 'Controleer op updates'; }
    });
    $('#upd-doe').addEventListener('click', async () => {
      if (!confirm('Nu bijwerken? De dienst herstart daarna vanzelf.')) return;
      const knop = $('#upd-doe');
      knop.disabled = true; knop.textContent = 'Bijwerken…';
      try {
        const r = await api('/api/update/uitvoeren', { method: 'POST' });
        toast(r.al_actueel ? 'Al de nieuwste versie' : 'Bijgewerkt; de dienst herstart…');
        $('#upd-uitslag').innerHTML = '<p style="margin:0;font-size:13.5px">Bijgewerkt naar <b>' + esc(String(r.sha || '').slice(0, 7)) + '</b>. De pagina ververst over een paar seconden.</p>';
        setTimeout(() => location.reload(), 6000);
      } catch (err) { toast(err.message, true); knop.disabled = false; knop.textContent = 'Nu bijwerken'; }
    });
    $('#wwform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const lichaam = Object.fromEntries(new FormData(e.target).entries());
      try {
        const r = await api('/api/instellingen', { method: 'PATCH', lichaam });
        toast('Opgeslagen');
        if (r.opnieuw_inloggen) { toonLogin(); }
      } catch (err) { toast(err.message, true); }
    });
  } catch (e) { beeld.innerHTML = '<div class="kaart"><div class="kaart-body"><p class="fout-tekst">' + esc(e.message) + '</p></div></div>'; }
}

// ── start ────────────────────────────────────────────────────────────────────
start();
setInterval(() => { if (huidigeTab === 'overzicht') laadOverzicht(); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
